<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>canvas-chat-tree</title>
  <script>
    // Pick the theme before anything is drawn, so the page never flashes the
    // wrong one: the saved choice if there is one, otherwise the system setting.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('canvas-chat-tree:theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    /* Every colour on the page is a variable with a dark and a light value.
       Dark is the default; the light values override it when <html> has
       data-theme="light". Nothing below this block names a colour directly. */
    :root {
      color-scheme: dark;
      --card-w: 360px;

      /* Surfaces and text */
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1d212a;
      --panel-3: #232833;
      --border: #2a2f3a;
      --border-strong: #3b4252;
      --text: #e6e8ec;
      --text-soft: #d3d7de;
      --muted: #9aa3b2;
      --accent: #7aa2f7;
      --on-accent: #0f1115;
      --error: #f0787a;
      --ok: #6fd08c;
      --highlight: #6680ff; /* active path: the highlight blue, lifted a little for the dark background */
      --highlight-glow: rgba(102, 128, 255, 0.55);
      --grid: #252a35;
      --grid-image: radial-gradient(circle, var(--grid) 1px, transparent 1.2px); /* dots */
      --edge: #4a5366;

      /* Primary button */
      --primary-bg: #2b3a5c;
      --primary-border: #3d5080;
      --primary-bg-hover: #344670;
      --primary-border-hover: #4a6199;

      /* Rings and shadows */
      --error-ring: rgba(240, 120, 122, 0.35);
      --reading-ring: rgba(122, 162, 247, 0.55);
      --shadow-1: rgba(0, 0, 0, 0.35);
      --shadow-2: rgba(0, 0, 0, 0.45);
      --shadow-3: rgba(0, 0, 0, 0.55);

      /* Minimap */
      --minimap-bg: rgba(23, 26, 33, 0.94);
      --frame-fill: rgba(255, 255, 255, 0.07);
      --frame-line: #e6e8ec;

      /* Accent colours for branch families: 8 muted tones */
      --branch-0: #6d8fd1;
      --branch-1: #5fae9b;
      --branch-2: #c9a45c;
      --branch-3: #b07fc7;
      --branch-4: #7fb069;
      --branch-5: #d08a6e;
      --branch-6: #5aa9c7;
      --branch-7: #c77f9c;

      /* Sticky notes: 5 colours, each a fill and a line */
      --sticky-yellow-bg: #453f22;
      --sticky-yellow-line: #9a8840;
      --sticky-green-bg: #24402f;
      --sticky-green-line: #4f8f68;
      --sticky-blue-bg: #23364f;
      --sticky-blue-line: #5380b5;
      --sticky-pink-bg: #4a2a3c;
      --sticky-pink-line: #a8648a;
      --sticky-purple-bg: #38294f;
      --sticky-purple-line: #8263b8;
      --sticky-text: #eceef2;
      --sticky-faint: rgba(236, 238, 242, 0.5);
      --sticky-muted: rgba(236, 238, 242, 0.75);
      --sticky-well: rgba(0, 0, 0, 0.2);
      --sticky-btn: rgba(0, 0, 0, 0.28);
      --sticky-btn-hover: rgba(0, 0, 0, 0.45);
      --sticky-btn-border: rgba(255, 255, 255, 0.22);
      --sticky-btn-border-hover: rgba(255, 255, 255, 0.4);
      --sticky-dot-border: rgba(255, 255, 255, 0.25);
      --sticky-error: #ffb4b5;

      /* File type badges: the same in both themes, light text on a mid tone */
      --file-pdf: #d1483f;
      --file-image: #2f9a6c;
      --file-text: #6b7385;
      --file-word: #2f6fd6;
      --file-other: #8a8f9c;
      --file-on: #ffffff;
    }

    /* Light theme: neutral greys and white, no warm tones. */
    :root[data-theme="light"] {
      color-scheme: light;

      --bg: #f2f2f2;          /* canvas: very light neutral grey */
      --panel: #ffffff;       /* top bar, cards, panels */
      --panel-2: #ffffff;     /* buttons */
      --panel-3: #f0f0f0;     /* button hover, inline code */
      --border: #e0e0e0;
      --border-strong: #c9c9c9;
      --text: #1a1a1a;
      --text-soft: #2b2b2b;
      --muted: #6b6b6b;
      --accent: #4262ff;      /* primary highlight: focus, selection, active path */
      --on-accent: #ffffff;
      --error: #d92d2d;
      --ok: #1f9d55;
      --highlight: #4262ff;
      --highlight-glow: rgba(66, 98, 255, 0.4);
      --grid: #e4e4e4;
      --grid-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px); /* square grid */
      --edge: #b5b5b5;

      --primary-bg: #e9edff;
      --primary-border: #b7c2ff;
      --primary-bg-hover: #d9e0ff;
      --primary-border-hover: #94a5ff;

      --error-ring: rgba(217, 45, 45, 0.22);
      --reading-ring: rgba(66, 98, 255, 0.4);
      --shadow-1: rgba(0, 0, 0, 0.08);
      --shadow-2: rgba(0, 0, 0, 0.12);
      --shadow-3: rgba(0, 0, 0, 0.18);

      --minimap-bg: rgba(255, 255, 255, 0.95);
      --frame-fill: rgba(66, 98, 255, 0.08);
      --frame-line: #4262ff;

      /* The same 8 branch families: cool, clean tones for grey and white */
      --branch-0: #5b6b8c;
      --branch-1: #12a594;
      --branch-2: #e0a100;
      --branch-3: #8e5ad6;
      --branch-4: #3fa34d;
      --branch-5: #e8743b;
      --branch-6: #1ba3c6;
      --branch-7: #d6569a;

      /* Bright pastels with dark text */
      --sticky-yellow-bg: #fff9b1;
      --sticky-yellow-line: #e3c930;
      --sticky-green-bg: #d5f692;
      --sticky-green-line: #94c93a;
      --sticky-blue-bg: #a6ccf5;
      --sticky-blue-line: #4f95e0;
      --sticky-pink-bg: #ffcee0;
      --sticky-pink-line: #ee7fae;
      --sticky-purple-bg: #dedaff;
      --sticky-purple-line: #9485ee;
      --sticky-text: #1a1a1a;
      --sticky-faint: rgba(0, 0, 0, 0.42);
      --sticky-muted: rgba(0, 0, 0, 0.62);
      --sticky-well: rgba(255, 255, 255, 0.55);
      --sticky-btn: rgba(255, 255, 255, 0.6);
      --sticky-btn-hover: rgba(255, 255, 255, 0.92);
      --sticky-btn-border: rgba(0, 0, 0, 0.18);
      --sticky-btn-border-hover: rgba(0, 0, 0, 0.35);
      --sticky-dot-border: rgba(0, 0, 0, 0.2);
      --sticky-error: #b3261e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #app { height: 100%; display: flex; flex-direction: column; }

    /* Shown before the app scripts have loaded */
    .boot { margin: auto; text-align: center; color: var(--muted); padding: 16px; }

    button, select {
      font: inherit;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      height: 32px;
    }
    button { cursor: pointer; white-space: nowrap; }
    button:hover:not(:disabled) { border-color: var(--border-strong); background: var(--panel-3); }
    button:disabled, select:disabled { opacity: 0.55; cursor: default; }
    button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button.primary { background: var(--primary-bg); border-color: var(--primary-border); }
    button.primary:hover:not(:disabled) { background: var(--primary-bg-hover); border-color: var(--primary-border-hover); }
    select { max-width: 240px; }

    /* Top bar */
    .topbar {
      flex: none;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      z-index: 2;
    }
    .brand { font-weight: 600; color: var(--muted); white-space: nowrap; }
    .title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .title small { font-weight: 400; color: var(--muted); margin-left: 6px; }
    .spacer { flex: 1; min-width: 0; }
    .zoom { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
    .inline-status { color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
    .inline-status.bad { color: var(--error); min-width: 0; }
    .clip { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .zoom, .topbar button, .topbar select { flex: none; }
    .topbar .icon-only { width: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    @media (max-width: 1280px) { .brand, .title { display: none; } }

    /* Viewport and world */
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background-color: var(--bg);
      background-image: var(--grid-image);
    }
    .viewport.panning { cursor: grabbing; user-select: none; }
    .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
    .edges path { fill: none; stroke: var(--edge); stroke-width: 2.5; stroke-linecap: round; }
    .edges path.active { stroke: var(--highlight) !important; stroke-width: 5; }
    .edges path.draft { stroke: var(--accent); stroke-dasharray: 6 6; opacity: 0.8; }

    /* Node cards */
    .card {
      position: absolute;
      width: var(--card-w);
      background: var(--panel);
      /* --node is the card's accent colour (its branch family), set per card */
      border: 2px solid var(--node, var(--border));
      border-radius: 10px;
      box-shadow: 0 4px 16px var(--shadow-1);
      cursor: default;
    }
    /* Rings are drawn with box-shadow so they never change the card's size. */
    .card.error { border-color: var(--error); box-shadow: 0 0 0 2px var(--error-ring), 0 4px 16px var(--shadow-1); }
    .card.reading { box-shadow: 0 0 0 2px var(--reading-ring), 0 4px 16px var(--shadow-1); }
    .card.active { border-color: var(--highlight); box-shadow: 0 0 0 1px var(--highlight), 0 0 20px 3px var(--highlight-glow), 0 4px 16px var(--shadow-1); }

    /* While a path is selected, everything that is not on it steps back. */
    .card, .sticky, .filebub, .edges path, .edges line { transition: opacity 0.15s ease; }
    .world.has-path .card:not(.active),
    .world.has-path .sticky:not(.onpath),
    .world.has-path .filebub:not(.onpath),
    .world.has-path .edges path:not(.active):not(.draft),
    .world.has-path .edges line.tether:not(.onpath) { opacity: 0.45; }
    .card.target { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 4px 16px var(--shadow-1); }
    .card.drop { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent), 0 4px 16px var(--shadow-1); }
    .card.dragging { z-index: 1; box-shadow: 0 10px 28px var(--shadow-3); }
    .card.dragging .card-head { cursor: grabbing; }
    .card-badge {
      position: absolute;
      left: 0;
      bottom: 100%;
      margin-bottom: 6px;
      max-width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      font-size: 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      white-space: nowrap;
    }
    .card-badge.bad { color: var(--error); border-color: var(--error); }
    .card-badge button { height: 22px; padding: 0 8px; font-size: 12px; }
    .card-badge .inline-status { font-size: 12px; }
    .card-head {
      padding: 10px 12px;
      font-weight: 600;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 96px;
      overflow-y: auto;
      border-bottom: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      /* a wash of the accent colour, so a branch family reads at a glance */
      background: color-mix(in srgb, var(--node, transparent) 26%, var(--panel));
      border-bottom-color: color-mix(in srgb, var(--node, var(--border)) 45%, var(--border));
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .card-body {
      padding: 10px 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 220px;
      overflow-y: auto;
      color: var(--text-soft);
    }
    .card-body.muted { color: var(--muted); }

    /* Markdown in replies */
    .md { white-space: normal; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p { margin: 0 0 8px; }
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 12px 0 6px; line-height: 1.3; color: var(--text); }
    .md h1 { font-size: 16px; }
    .md h2 { font-size: 15px; }
    .md h3, .md h4, .md h5, .md h6 { font-size: 14px; }
    .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
    .md li { margin: 2px 0; }
    .md li > p { margin: 0; }
    .md strong { color: var(--text); }
    .md a { color: var(--accent); }
    .md code {
      font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--panel-3);
      border-radius: 4px;
      padding: 1px 4px;
    }
    .md pre {
      margin: 0 0 8px;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow-x: auto;
    }
    .md pre code { background: none; padding: 0; white-space: pre; }
    .md blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--border); color: var(--muted); }
    .md hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }
    .card-body.err { color: var(--error); }
    .card-note { padding: 0 12px 10px; color: var(--error); font-size: 13px; overflow-wrap: anywhere; }
    .card-note.soft { color: var(--muted); }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
    }
    .card-actions button { height: 28px; padding: 2px 10px; font-size: 13px; }
    .card-actions .push { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
    .card-actions .icon { width: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .scroll { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

    /* Collapse toggle: a pill on the card's bottom edge, where its children hang from */
    .fold {
      position: absolute;
      left: 50%;
      bottom: -12px;
      transform: translateX(-50%);
      z-index: 1;
      height: 22px;
      padding: 0 9px;
      font-size: 11px;
      line-height: 1;
      border-radius: 11px;
      background: var(--panel-2);
      border: 1px solid var(--node, var(--border));
      color: var(--muted);
    }
    .fold:hover:not(:disabled) { color: var(--text); border-color: var(--node, var(--border-strong)); }
    .fold.closed { background: var(--node, var(--accent)); border-color: var(--node, var(--accent)); color: var(--on-accent); font-weight: 700; }
    .fold.closed:hover:not(:disabled) { background: var(--node, var(--accent)); color: var(--on-accent); filter: brightness(1.12); }

    /* Minimap */
    .minimap {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 200px;
      height: 140px;
      z-index: 1;
      overflow: hidden;
      background: var(--minimap-bg);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      box-shadow: 0 6px 18px var(--shadow-2);
      cursor: crosshair;
      touch-action: none;
    }
    .minimap svg { display: block; width: 100%; height: 100%; }
    .minimap .frame { fill: var(--frame-fill); stroke: var(--frame-line); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    @media (max-width: 700px) { .minimap { display: none; } }

    /* Sticky notes */
    .sticky {
      --s-bg: var(--sticky-yellow-bg);
      --s-line: var(--sticky-yellow-line);
      position: absolute;
      width: 200px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      color: var(--sticky-text);
      background: var(--s-bg);
      border: 1px solid var(--s-line);
      border-radius: 6px;
      box-shadow: 0 6px 18px var(--shadow-2);
      cursor: grab;
      touch-action: none;
    }
    .sticky.c-green { --s-bg: var(--sticky-green-bg); --s-line: var(--sticky-green-line); }
    .sticky.c-blue { --s-bg: var(--sticky-blue-bg); --s-line: var(--sticky-blue-line); }
    .sticky.c-pink { --s-bg: var(--sticky-pink-bg); --s-line: var(--sticky-pink-line); }
    .sticky.c-purple { --s-bg: var(--sticky-purple-bg); --s-line: var(--sticky-purple-line); }
    .sticky.dragging { cursor: grabbing; z-index: 3; box-shadow: 0 12px 28px var(--shadow-3); }
    .sticky-text {
      min-height: 72px;
      max-height: 240px;
      overflow-y: auto;
      padding: 10px 10px 6px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: none;
      -webkit-user-select: none;
    }
    .sticky-text.empty { color: var(--sticky-faint); font-style: italic; }
    textarea.sticky-text {
      display: block;
      width: 100%;
      height: 130px;
      resize: none;
      border: 0;
      outline: 0;
      border-radius: 5px 5px 0 0;
      background: var(--sticky-well);
      color: inherit;
      font-family: inherit;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }
    .sticky-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 4px 8px 6px;
      font-size: 11px;
      color: var(--sticky-muted);
      cursor: default;
    }
    .sticky-bar .dot {
      flex: none;
      width: 13px;
      height: 13px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--sticky-dot-border);
      background: var(--dot);
    }
    .sticky-bar .dot:hover:not(:disabled) { background: var(--dot); border-color: var(--sticky-text); }
    .sticky-bar .dot.on { outline: 2px solid var(--sticky-text); outline-offset: 1px; }
    .sticky-bar .mini {
      flex: none;
      height: 20px;
      padding: 0 6px;
      font-size: 11px;
      background: var(--sticky-btn);
      border-color: var(--sticky-btn-border);
    }
    .sticky-bar .mini:hover:not(:disabled) { background: var(--sticky-btn-hover); border-color: var(--sticky-btn-border-hover); }
    .sticky-bar .mini.x { width: 20px; padding: 0; }
    .sticky-bar .state { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sticky-bar .state.bad { color: var(--sticky-error); }
    .sticky-bar .inline-status { font-size: 11px; color: inherit; }
    .sticky-bar .spin { width: 10px; height: 10px; }
    .edges line.tether { stroke-width: 1.5; stroke-dasharray: 4 5; stroke-linecap: round; }

    /* File bubbles: uploaded files on the canvas */
    .filebub {
      position: absolute;
      width: 220px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      box-shadow: 0 6px 18px var(--shadow-2);
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .filebub.dragging { cursor: grabbing; z-index: 3; box-shadow: 0 12px 28px var(--shadow-3); }
    .filebub.reading { box-shadow: 0 0 0 2px var(--reading-ring), 0 6px 18px var(--shadow-2); }
    .filebub.bad { border-color: var(--error); }
    .filebub.uploading { cursor: default; border-style: dashed; }
    /* An error message may need more room than a preview does. */
    .filebub.uploading .filebub-preview { height: auto; min-height: 110px; padding: 8px 0; }
    .filebub-head { display: flex; align-items: flex-start; gap: 8px; padding: 9px 10px 7px; }
    .filebub-name {
      font-weight: 600;
      font-size: 13px;
      line-height: 1.3;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .filebub-size { font-size: 11px; color: var(--muted); }
    .file-icon {
      flex: none;
      min-width: 34px;
      height: 20px;
      padding: 0 5px;
      border-radius: 4px;
      background: var(--file-other);
      color: var(--file-on);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .file-icon.k-pdf { background: var(--file-pdf); }
    .file-icon.k-image { background: var(--file-image); }
    .file-icon.k-text { background: var(--file-text); }
    .file-icon.k-word { background: var(--file-word); }
    .file-icon.big { min-width: 56px; height: 34px; font-size: 15px; border-radius: 6px; }
    .filebub-preview {
      height: 110px;
      margin: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .filebub-preview img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .filebub-preview .lines {
      align-self: stretch;
      width: 100%;
      padding: 6px 8px;
      font-size: 11px;
      line-height: 1.4;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow: hidden;
    }
    .filebub-preview .stack { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 10px; min-width: 0; width: 100%; }
    .filebub-preview .err { color: var(--error); overflow-wrap: anywhere; }
    .filebub-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 5px 8px 7px 10px;
      font-size: 11px;
      color: var(--muted);
      cursor: default;
    }
    .filebub-bar button { flex: none; height: 20px; padding: 0 6px; font-size: 11px; }
    .filebub-bar .x { width: 20px; padding: 0; }
    .filebub-bar .state { margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .filebub-bar .state.bad { color: var(--error); }
    .filebub-bar .inline-status { font-size: 11px; }
    .filebub-bar .spin { width: 10px; height: 10px; }
    .progress { width: 100%; height: 6px; border-radius: 3px; background: var(--panel-3); border: 1px solid var(--border); overflow: hidden; }
    .progress > i { display: block; height: 100%; background: var(--accent); transition: width 0.15s linear; }
    .percent { font-variant-numeric: tabular-nums; }

    /* Shown while files are dragged over the canvas */
    .drop-hint {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      z-index: 4;
      max-width: calc(100% - 32px);
      padding: 8px 14px;
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
      border-radius: 10px;
      box-shadow: 0 6px 18px var(--shadow-2);
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .viewport.dropping { outline: 3px dashed var(--accent); outline-offset: -3px; }

    /* A file open in the reader panel */
    a.btn {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 2px 10px;
      font-size: 13px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      white-space: nowrap;
      flex: none;
    }
    a.btn:hover { border-color: var(--border-strong); background: var(--panel-3); }
    a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .reader-bar .file-title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reader-scroll.flush { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
    .file-frame { flex: 1; width: 100%; border: 0; background: var(--bg); }
    .file-foot { flex: none; padding: 6px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
    .file-foot a, .file-note a { color: var(--accent); }
    .file-image { display: block; max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
    .file-text { font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-soft); }
    .file-text.prose { font: inherit; font-size: 15px; line-height: 1.6; }
    .file-note { margin: 0 0 12px; color: var(--muted); font-size: 12px; }

    /* Where the node being written will land */
    .ghost {
      position: absolute;
      width: var(--card-w);
      height: 120px;
      border: 2px dashed var(--accent);
      border-radius: 10px;
      opacity: 0.6;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    /* Composer */
    .composer {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(560px, calc(100% - 32px));
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      box-shadow: 0 10px 32px var(--shadow-3);
      padding: 12px;
      cursor: default;
      z-index: 2;
    }
    .composer.centred { bottom: auto; top: 50%; transform: translate(-50%, -50%); }
    .composer-label {
      color: var(--muted);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .composer.centred .composer-label { color: var(--text); font-weight: 600; font-size: 16px; }
    .composer textarea {
      display: block;
      width: 100%;
      min-height: 76px;
      max-height: 240px;
      resize: vertical;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .composer textarea:disabled { opacity: 0.6; }
    .composer-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .composer-row .hint { color: var(--muted); font-size: 12px; }
    .composer-error { color: var(--error); margin-top: 8px; overflow-wrap: anywhere; }

    /* Reader panel: one node's full prompt and reply, beside the canvas */
    .reader {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(480px, 100%);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--border-strong);
      box-shadow: -10px 0 32px var(--shadow-2);
      cursor: default;
      z-index: 3;
    }
    .reader-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .reader-bar .name { font-weight: 600; color: var(--muted); }
    .reader-bar button { height: 28px; padding: 2px 10px; font-size: 13px; flex: none; }
    .reader-bar .close { width: 28px; padding: 0; font-size: 16px; line-height: 1; }
    .reader-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 28px; }
    .reader-label {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .reader-label small { text-transform: none; letter-spacing: 0; }
    .reader-prompt {
      margin: 0 0 20px;
      padding: 10px 12px;
      font-weight: 600;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .reader-reply { font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; color: var(--text-soft); }
    .reader-reply.md h1 { font-size: 20px; }
    .reader-reply.md h2 { font-size: 17px; }
    .reader-reply.md h3, .reader-reply.md h4, .reader-reply.md h5, .reader-reply.md h6 { font-size: 15px; }
    .reader-reply.md p, .reader-reply.md ul, .reader-reply.md ol, .reader-reply.md pre, .reader-reply.md blockquote { margin-bottom: 12px; }
    .reader-reply.md code { font-size: 13.5px; }
    .reader-error { color: var(--error); white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 12px; }
    .reader-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); }
    /* With the reader open on a wide screen, the composer centres in the space that is left. */
    @media (min-width: 1000px) {
      .viewport.reader-open .composer:not(.centred) { left: calc((100% - 480px) / 2); }
    }

    /* Context panel (shares the reader panel's frame) */
    .ctx-intro { margin: 0 0 18px; color: var(--muted); }
    .ctx-instructions {
      display: block;
      width: 100%;
      min-height: 140px;
      max-height: 320px;
      resize: vertical;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .ctx-state { display: flex; align-items: center; gap: 8px; min-height: 28px; margin: 6px 0 22px; font-size: 12px; color: var(--muted); }
    .ctx-state.bad { color: var(--error); }
    .ctx-state button { height: 24px; padding: 0 8px; font-size: 12px; }
    .ctx-warning {
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--error);
      border-radius: 8px;
      color: var(--error);
      background: color-mix(in srgb, var(--error) 9%, var(--panel));
      overflow-wrap: anywhere;
    }
    .ctx-warning ul { margin: 6px 0 0; padding-left: 20px; }
    .ctx-empty { color: var(--muted); }
    .ctx-note {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .ctx-note.out { border-style: dashed; }
    .ctx-note .swatch { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--dot); }
    .ctx-note .line {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      height: auto;
      padding: 0;
      border: 0;
      background: none;
    }
    .ctx-note .line:hover:not(:disabled) { background: none; text-decoration: underline; }
    .ctx-note .tag { flex: none; font-size: 11px; color: var(--muted); white-space: nowrap; }
    .ctx-note .tag.bad { color: var(--error); }
    .ctx-note .unpin { flex: none; height: 24px; padding: 0 8px; font-size: 12px; }
    .topbar button.on { border-color: var(--accent); color: var(--accent); }

    /* Pin on stickies */
    .sticky-bar .mini.pin { width: 20px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .sticky-bar .mini.pin.on, .sticky-bar .mini.pin.on:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .pin-mark {
      position: absolute;
      top: -9px;
      right: -9px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      box-shadow: 0 2px 6px var(--shadow-2);
      pointer-events: none;
    }

    /* Branch context: the same round badge as the pin, in the card's accent colour */
    .pin-mark.branch { background: var(--node, var(--accent)); }
    .edges line.tether.branch { stroke-dasharray: none; stroke-width: 2.5; }
    .edges line.link-draft { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 6; stroke-linecap: round; }

    /* Attach handle: drag from it onto a card */
    .attach-handle {
      position: absolute;
      left: -9px;
      top: 50%;
      width: 16px;
      height: 16px;
      margin-top: -8px;
      padding: 0;
      border-radius: 50%;
      background: var(--panel);
      border: 2px solid var(--accent);
      box-shadow: 0 2px 6px var(--shadow-2);
      cursor: crosshair;
      opacity: 0.55;
      touch-action: none;
    }
    .attach-handle:hover:not(:disabled), .attach-handle.on { opacity: 1; background: var(--accent); border-color: var(--accent); }

    /* Context control on a bubble, and the menu it opens */
    .ctx-btn { width: 20px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .filebub-bar .ctx-btn { width: 22px; }
    .ctx-btn.on, .ctx-btn.on:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .sticky.menu-open, .filebub.menu-open { z-index: 6; }
    .bubble-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 250px;
      padding: 6px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: 0 10px 28px var(--shadow-3);
      cursor: default;
      font-size: 13px;
      user-select: none;
      -webkit-user-select: none;
    }
    .menu-label { padding: 4px 8px 2px; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    .menu-sep { height: 1px; margin: 6px 2px; background: var(--border); }
    .bubble-menu .menu-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
      height: auto;
      padding: 6px 8px;
      border: 0;
      border-radius: 6px;
      background: none;
      color: var(--text);
      font-size: 13px;
      text-align: left;
      white-space: normal;
    }
    .bubble-menu .menu-item:hover:not(:disabled) { background: var(--panel-3); }
    .bubble-menu .menu-item.on { background: var(--primary-bg); }
    .bubble-menu .menu-item .tick { flex: none; width: 14px; color: var(--accent); }
    .bubble-menu .menu-item .what { min-width: 0; overflow-wrap: anywhere; }
    .bubble-menu .menu-item small { display: block; color: var(--muted); font-size: 11px; line-height: 1.35; }

    /* Context chips: what a node can see, under its header */
    .card-chips {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }
    .chip {
      flex: 0 1 auto;
      min-width: 0;
      max-width: 112px;
      height: 22px;
      padding: 0 7px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      border-radius: 11px;
      background: var(--panel-2);
      border: 1px solid var(--border-strong);
      color: var(--text-soft);
    }
    .chip svg { flex: none; }
    .chip .chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .chip.branch { border-color: var(--chip, var(--border-strong)); }
    .chip.branch svg { color: var(--chip, currentColor); }
    .chip.more { flex: none; color: var(--muted); cursor: default; }

    /* Attach to…: cards are the things to click */
    .world.picking .card { cursor: copy; }
    .world.picking .card:hover { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent), 0 4px 16px var(--shadow-1); }
    .world.picking .card * { cursor: copy; }

    /* Context panel: groups of branch items */
    .ctx-group { display: block; width: 100%; height: auto; margin: 12px 0 6px; padding: 0; border: 0; background: none; text-align: left; font-weight: 600; white-space: normal; overflow-wrap: anywhere; }
    .ctx-group:hover:not(:disabled) { background: none; text-decoration: underline; }
    .ctx-group .bar { display: inline-block; width: 10px; height: 10px; margin-right: 7px; border-radius: 3px; background: var(--node, var(--border-strong)); }
    .ctx-section { margin-top: 24px; }

    /* Toast: short messages about a whole-canvas action (Tidy and its undo) */
    .toast {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 32px);
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: 0 6px 18px var(--shadow-2);
      cursor: default;
      white-space: nowrap;
    }
    .toast.bad { border-color: var(--error); }
    .toast .msg { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .toast .msg.bad { color: var(--error); }
    .toast .count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .toast button { height: 28px; padding: 2px 10px; font-size: 13px; flex: none; }

    /* Centre overlay: loading, error and empty states */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 16px;
    }
    .notice {
      pointer-events: auto;
      cursor: default;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      text-align: center;
      max-width: 420px;
      color: var(--muted);
    }
    .notice.bad { border-color: var(--error); }
    .notice strong { display: block; color: var(--text); margin-bottom: 4px; }
    .notice .row { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .notice button { margin-top: 12px; }

    .spin {
      flex: none;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot" id="boot">Loading canvas-chat-tree…</div>
  </div>

  <script>
    // If the app scripts (loaded from esm.sh) never arrive, say so instead of
    // leaving "Loading…" on screen forever.
    setTimeout(function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.innerHTML = 'Could not load the app scripts (from esm.sh). Check your connection.<br><br>';
      var b = document.createElement('button');
      b.textContent = 'Reload';
      b.onclick = function () { location.reload(); };
      boot.appendChild(b);
    }, 10000);
  </script>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.25.4';
    import { useState, useEffect, useLayoutEffect, useRef, useCallback, useMemo } from 'https://esm.sh/preact@10.25.4/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    // micromark is safe by default: raw HTML in the text is escaped and
    // dangerous link protocols (javascript:, data:, ...) are dropped.
    import { micromark } from 'https://esm.sh/micromark@4.0.0';

    const html = htm.bind(h);

    const CARD_W = 360;
    const MIN_ZOOM = 0.1;
    const MAX_ZOOM = 2;
    const FIT_PADDING = 60;
    const GRID = 24;
    const GAP_X = 60;          // horizontal gap between sibling cards
    const GAP_Y = 80;          // vertical gap between a parent and its children
    const GHOST_H = 120;       // height of the "new node lands here" outline
    const NEW_CARD_H = 260;    // assumed height of a not-yet-created card, for overlap checks
    const POLL_MS = 1500;
    const TREE_GAP = 140;        // gap between separate trees after Tidy
    const UNMEASURED_H = 370;    // tallest a card can be; used when a card's height is not known
    const TIDY_MS = 450;         // length of the Tidy animation
    const UNDO_MS = 10000;       // how long "Undo tidy" stays available
    const READER_W = 480;      // width of the reader panel
    const READER_WIDE = 1000;  // from this window width, reader and composer fit side by side
    const STICKY_W = 200;
    const STICKY_COLORS = ['yellow', 'green', 'blue', 'pink', 'purple'];
    // Dot, connector and minimap colour for each sticky colour: the theme's line colour.
    const STICKY_LINE = Object.fromEntries(STICKY_COLORS.map((c) => [c, `var(--sticky-${c}-line)`]));
    const DRAG_THRESHOLD = 5;  // a press that moves less than this many pixels is a click, not a drag
    const FILE_W = 220;        // width of a file bubble
    const FILE_H = 200;        // its height before it has been measured
    const MAX_FILE_BYTES = 10 * 1024 * 1024;          // same hard limit as the server
    const STORAGE_WARN_BYTES = 200 * 1024 * 1024;     // warn when one canvas stores more than this
    const FILE_TEXT_LIMIT = 200000;                   // most characters of a file's text shown in the reader
    // Accepted file endings and the kind of file each one is.
    const FILE_KINDS = { pdf: 'pdf', png: 'image', jpg: 'image', jpeg: 'image', webp: 'image', gif: 'image', txt: 'text', md: 'text', csv: 'text', docx: 'word' };
    const FILE_ACCEPT = Object.keys(FILE_KINDS).map((ext) => '.' + ext).join(',');
    const ACCEPTED_LABEL = 'PDF, PNG, JPG, WEBP, GIF, TXT, MD, CSV and DOCX';
    const KIND_LABEL = { pdf: 'PDF document', image: 'Image', text: 'Text file', word: 'Word document', other: 'File' };
    const fileExt = (name) => (name.includes('.') ? name.split('.').pop().toLowerCase() : '');
    const fileKind = (name) => FILE_KINDS[fileExt(name)] || 'other';
    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
      const mb = bytes / (1024 * 1024);
      return (mb < 10 ? mb.toFixed(1) : Math.round(mb)) + ' MB';
    }

    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const snippet = (text, max = 60) => {
      const one = text.replace(/\s+/g, ' ').trim();
      return one.length > max ? one.slice(0, max - 1) + '…' : one;
    };

    // --- Theme --------------------------------------------------------------

    const THEME_KEY = 'canvas-chat-tree:theme';
    const systemTheme = () =>
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    // The theme the user picked with the toggle, or null if they never picked one.
    function chosenTheme() {
      try {
        const theme = localStorage.getItem(THEME_KEY);
        return theme === 'light' || theme === 'dark' ? theme : null;
      } catch {
        return null;
      }
    }

    // --- Markdown -----------------------------------------------------------

    const escapeHtml = (text) => text.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // Reply text -> sanitised HTML. Images are dropped so a reply can never
    // make the page fetch something from another site.
    function renderMarkdown(text) {
      try {
        return micromark(text).replace(/<img\b[^>]*>/g, '');
      } catch {
        return `<p>${escapeHtml(text)}</p>`;
      }
    }

    // Links in replies open in a new tab instead of replacing the canvas.
    function onMarkdownClick(e) {
      const link = e.target.closest('a');
      if (!link) return;
      e.preventDefault();
      if (/^https?:/i.test(link.href)) window.open(link.href, '_blank', 'noopener,noreferrer');
    }

    // --- Network ------------------------------------------------------------

    async function api(path, options = {}) {
      let res;
      try {
        res = await fetch(path, { headers: { 'content-type': 'application/json' }, ...options });
      } catch {
        throw new Error('Network error. Check your connection and try again.');
      }
      let data = null;
      try { data = await res.json(); } catch { /* not JSON */ }
      if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status}).`);
      return data;
    }

    // --- Small pieces -------------------------------------------------------

    // Spinner with a label and seconds counting up, so nothing waits silently.
    // Counts from `since` (a timestamp in ms) when given, otherwise from when it appeared.
    function Spinner({ label, since }) {
      const [now, setNow] = useState(Date.now());
      const mounted = useRef(Date.now());
      useEffect(() => {
        const t = setInterval(() => setNow(Date.now()), 250);
        return () => clearInterval(t);
      }, []);
      const seconds = Math.max(0, Math.floor((now - (since || mounted.current)) / 1000));
      return html`<span class="inline-status"><span class="spin"></span>${label} ${seconds}s</span>`;
    }

    // Seconds left until a moment in time, counting down.
    function Countdown({ until }) {
      const [now, setNow] = useState(Date.now());
      useEffect(() => {
        const t = setInterval(() => setNow(Date.now()), 250);
        return () => clearInterval(t);
      }, []);
      return html`<span class="count">${Math.max(0, Math.ceil((until - now) / 1000))}s</span>`;
    }

    function Card({ node, colour, isActive, liveText, isTarget, isDrop, isDragging, isReading, chips, onChip, pendingSince, pollError, retry, move, onHeight, onContinue, onBranch, onRetry, onExpand, onAddSticky, descendants, isCollapsed, onToggleCollapse, onDragStart, onDragMove, onDragEnd, onSaveRetry }) {
      const ref = useRef(null);
      const bodyRef = useRef(null);
      const stickToBottom = useRef(true);

      // While the AI is writing, show the text so far: live from the stream,
      // or the partial reply saved in the database when polling instead.
      const text = node.status === 'done' ? node.reply
        : node.status === 'pending' ? (liveText || node.reply || '')
        : '';
      const replyHtml = useMemo(() => (text ? renderMarkdown(text) : ''), [text]);

      // Follow the text as it arrives, unless the reader has scrolled up.
      useLayoutEffect(() => {
        const el = bodyRef.current;
        if (el && node.status === 'pending' && stickToBottom.current) el.scrollTop = el.scrollHeight;
      }, [replyHtml, node.status]);
      const onBodyScroll = (e) => {
        const el = e.currentTarget;
        stickToBottom.current = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
      };

      // Report the card's real height so edges can start at its bottom-centre.
      useLayoutEffect(() => {
        const el = ref.current;
        const report = () => onHeight(node.id, el.offsetHeight);
        report();
        const ro = new ResizeObserver(report);
        ro.observe(el);
        return () => ro.disconnect();
      }, [node.id, onHeight]);

      let body;
      let note = null;
      let actions = null;
      const expand = html`
        <span class="push">
          <button class="icon" onClick=${() => onAddSticky(node)} title="Add a sticky note to this card" aria-label="Add a sticky note to this card">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
              <path d="M2.5 2.5h11v7l-4 4h-7z" /><path d="M13.5 9.5h-4v4" />
            </svg>
          </button>
          <button onClick=${() => onExpand(node)} title="Read the full prompt and reply in a side panel">Expand</button>
        </span>`;

      if (node.status === 'pending') {
        if (text) {
          body = html`<div class="card-body md scroll" ref=${bodyRef} onScroll=${onBodyScroll} onClick=${onMarkdownClick} dangerouslySetInnerHTML=${{ __html: replyHtml }}></div>`;
          actions = html`<div class="card-actions"><${Spinner} label="Writing…" since=${pendingSince} />${expand}</div>`;
        } else {
          body = html`<div class="card-body muted"><${Spinner} label="Thinking…" since=${pendingSince} /></div>`;
        }
        if (pollError) {
          note = html`<div class="card-note soft">Could not check for the reply (${pollError}) Trying again every few seconds.</div>`;
        }
      } else if (node.status === 'error') {
        body = html`<div class="card-body err scroll">${node.error || 'The AI call failed.'}</div>`;
        if (retry && retry.error) note = html`<div class="card-note">Retry failed: ${retry.error}</div>`;
        actions = html`
          <div class="card-actions">
            <button class="primary" disabled=${retry && retry.busy} onClick=${() => onRetry(node)}>Retry</button>
            ${retry && retry.busy && html`<${Spinner} label="Retrying…" />`}
            ${expand}
          </div>`;
      } else {
        body = html`<div class="card-body md scroll" onClick=${onMarkdownClick} dangerouslySetInnerHTML=${{ __html: replyHtml }}></div>`;
        actions = html`
          <div class="card-actions">
            <button onClick=${() => onContinue(node)} title="Add a follow-up directly below">Continue</button>
            <button onClick=${() => onBranch(node)} title="Start a second direction from this node">Branch</button>
            ${expand}
          </div>`;
      }

      return html`
        <div
          class=${'card ' + node.status + (isTarget ? ' target' : '') + (isDragging ? ' dragging' : '') + (isReading ? ' reading' : '') + (isActive ? ' active' : '') + (isDrop ? ' drop' : '')}
          ref=${ref}
          data-id=${node.id}
          style=${{ left: node.x + 'px', top: node.y + 'px', '--node': `var(--branch-${colour})` }}
        >
          ${move && html`
            <div class=${'card-badge' + (move.error ? ' bad' : '')}>
              ${move.busy
                ? html`<${Spinner} label="Saving position…" />`
                : html`<span class="clip" title=${move.error}>Position not saved: ${move.error}</span>
                       <button onClick=${() => onSaveRetry(node.id)}>Retry</button>`}
            </div>`}
          <div
            class="card-head scroll"
            title="Click to highlight the path to this node · drag to move"
            onPointerDown=${(e) => onDragStart(e, node)}
            onPointerMove=${onDragMove}
            onPointerUp=${onDragEnd}
            onPointerCancel=${onDragEnd}
          >${node.prompt}</div>
          ${chips && chips.length > 0 && html`
            <div class="card-chips" aria-label="What this node can see">
              ${chips.slice(0, 3).map((c) => html`
                <button
                  key=${c.kind + c.id}
                  class=${'chip ' + c.scope}
                  style=${c.scope === 'branch' ? { '--chip': c.accent } : null}
                  title=${`${c.kind === 'file' ? 'File' : 'Note'}: ${c.label} · ${c.scope === 'canvas' ? 'whole canvas' : c.own ? 'attached to this node' : `attached to “${c.from}”`}. Click to show it.`}
                  onClick=${() => onChip(c.kind, c.id)}
                ><${ModeIcon} mode=${c.scope} /><span class="chip-text">${c.label}</span></button>`)}
              ${chips.length > 3 && html`<span class="chip more" title=${chips.slice(3).map((c) => c.label).join('\n')}>+${chips.length - 3}</span>`}
            </div>`}
          ${body}
          ${note}
          ${actions}
          ${descendants > 0 && html`
            <button
              class=${'fold' + (isCollapsed ? ' closed' : '')}
              onClick=${() => onToggleCollapse(node.id)}
              title=${isCollapsed
                ? `Show the ${descendants} hidden ${descendants === 1 ? 'node' : 'nodes'} below`
                : `Hide the ${descendants} ${descendants === 1 ? 'node' : 'nodes'} below`}
              aria-expanded=${!isCollapsed}
            >${isCollapsed ? '+' + descendants : '▾ ' + descendants}</button>`}
        </div>`;
    }

    // Overview of the whole canvas. Cards are blocks in their branch colours,
    // the frame is what is on screen. Click or drag to move the view there.
    function Minimap({ blocks, view, size, onMove }) {
      const ref = useRef(null);
      const frozenRef = useRef(null);
      const [frozen, setFrozen] = useState(null);

      // What is on screen, in canvas coordinates.
      const frame = { x: -view.x / view.k, y: -view.y / view.k, w: size.w / view.k, h: size.h / view.k };

      // The map always covers every block and the frame, with a little margin.
      let minX = frame.x, minY = frame.y, maxX = frame.x + frame.w, maxY = frame.y + frame.h;
      for (const b of blocks) {
        minX = Math.min(minX, b.x);
        minY = Math.min(minY, b.y);
        maxX = Math.max(maxX, b.x + b.w);
        maxY = Math.max(maxY, b.y + b.h);
      }
      const margin = Math.max(maxX - minX, maxY - minY) * 0.04;
      const live = { x: minX - margin, y: minY - margin, w: Math.max(1, maxX - minX + margin * 2), h: Math.max(1, maxY - minY + margin * 2) };
      // While dragging, the map's extent is frozen. Otherwise it would rescale
      // under the pointer as the frame moves, and the view would run away.
      const bounds = frozen || live;

      const toCanvas = (e, bb) => {
        const r = ref.current.getBoundingClientRect();
        const scale = Math.min(r.width / bb.w, r.height / bb.h);
        const offsetX = (r.width - bb.w * scale) / 2;
        const offsetY = (r.height - bb.h * scale) / 2;
        return { x: bb.x + (e.clientX - r.left - offsetX) / scale, y: bb.y + (e.clientY - r.top - offsetY) / scale };
      };
      const onDown = (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
        frozenRef.current = live;
        setFrozen(live);
        onMove(toCanvas(e, live));
      };
      const onDrag = (e) => {
        if (frozenRef.current) onMove(toCanvas(e, frozenRef.current));
      };
      const onUp = () => {
        frozenRef.current = null;
        setFrozen(null);
      };

      return html`
        <div
          class="minimap"
          ref=${ref}
          title="Click or drag to move the view"
          onPointerDown=${onDown}
          onPointerMove=${onDrag}
          onPointerUp=${onUp}
          onPointerCancel=${onUp}
        >
          <svg viewBox=${`${bounds.x} ${bounds.y} ${bounds.w} ${bounds.h}`} preserveAspectRatio="xMidYMid meet">
            ${blocks.map((b) => html`<rect key=${b.key} x=${b.x} y=${b.y} width=${b.w} height=${b.h} rx=${b.w * 0.04} fill=${b.fill} opacity=${b.opacity} />`)}
            <rect class="frame" x=${frame.x} y=${frame.y} width=${frame.w} height=${frame.h} />
          </svg>
        </div>`;
    }

    // A sticky note. Plain text only. Double-click to edit, drag to move.
    // Everything in the bottom bar is a normal button and never starts a drag.
    function Sticky({ sticky, x, y, isEditing, isDragging, onPath, save, removal, onHeight, onDragStart, onDragMove, onDragEnd, onEdit, onEndEdit, onInput, onColor, onAskDelete, onCancelDelete, onDelete, onRetrySave, ctx }) {
      const ref = useRef(null);
      const inputRef = useRef(null);

      useLayoutEffect(() => {
        const el = ref.current;
        const report = () => onHeight(sticky.id, el.offsetHeight);
        report();
        const ro = new ResizeObserver(report);
        ro.observe(el);
        return () => ro.disconnect();
      }, [sticky.id, onHeight]);

      // Entering edit mode puts the cursor at the end of the text.
      useEffect(() => {
        const el = inputRef.current;
        if (!isEditing || !el) return;
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }, [isEditing]);

      const stop = (e) => e.stopPropagation();
      const inBar = (e) => e.target.closest('.sticky-bar, .bubble-menu, .attach-handle');

      let bar;
      if (removal) {
        bar = removal.busy
          ? html`<${Spinner} label="Deleting…" />`
          : html`
              <span class=${removal.error ? 'bad' : ''} title=${removal.error || ''}>${removal.error ? 'Could not delete.' : 'Delete this note?'}</span>
              <button class="mini" onClick=${() => onDelete(sticky.id)}>${removal.error ? 'Retry' : 'Delete'}</button>
              <button class="mini" onClick=${() => onCancelDelete(sticky.id)}>Cancel</button>`;
      } else {
        let state = null;
        if (save && save.state === 'saving') state = html`<span class="state">Saving…</span>`;
        else if (save && save.state === 'saved') state = html`<span class="state">Saved</span>`;
        else if (save && save.state === 'failed') {
          state = html`
            <span class="state bad" title=${save.error}>Not saved</span>
            <button class="mini" onClick=${() => onRetrySave(sticky.id)}>Retry</button>`;
        } else state = html`<span class="state"></span>`;
        const failed = save && save.state === 'failed';
        bar = html`
          ${!failed && STICKY_COLORS.map((c) => html`
            <button
              key=${c}
              class=${'dot' + (sticky.color === c ? ' on' : '')}
              style=${{ '--dot': STICKY_LINE[c] }}
              title=${c[0].toUpperCase() + c.slice(1)}
              aria-label=${'Colour: ' + c}
              onClick=${() => onColor(sticky.id, c)}
            ></button>`)}
          ${state}
          <${ContextButton} kind="sticky" item=${sticky} ctx=${ctx} className="mini" />
          <button class="mini x" title="Delete this note" aria-label="Delete this note" onClick=${() => onAskDelete(sticky.id)}>×</button>`;
      }

      return html`
        <div
          class=${'sticky c-' + sticky.color + (isDragging ? ' dragging' : '') + (onPath ? ' onpath' : '') + (ctx.menuOpen ? ' menu-open' : '')}
          data-sticky=${sticky.id}
          ref=${ref}
          style=${{ left: x + 'px', top: y + 'px' }}
          onPointerDown=${(e) => { if (!isEditing && !inBar(e)) onDragStart(e, sticky); }}
          onPointerMove=${onDragMove}
          onPointerUp=${onDragEnd}
          onPointerCancel=${onDragEnd}
          onDblClick=${(e) => { if (!inBar(e)) onEdit(sticky.id); }}
        >
          <${BubbleExtras} kind="sticky" item=${sticky} ctx=${ctx} />
          ${isEditing
            ? html`<textarea
                ref=${inputRef}
                class="sticky-text scroll"
                placeholder="Write a note…"
                value=${sticky.content}
                onInput=${(e) => onInput(sticky.id, e.target.value)}
                onBlur=${() => onEndEdit(sticky.id)}
                onKeyDown=${(e) => { if (e.key === 'Escape') { e.preventDefault(); e.currentTarget.blur(); } }}
                onPointerDown=${stop}
              ></textarea>`
            : html`<div class=${'sticky-text scroll' + (sticky.content ? '' : ' empty')} title="Double-click to edit · drag to move">${sticky.content || 'Double-click to write'}</div>`}
          <div class="sticky-bar" onPointerDown=${stop}>${bar}</div>
        </div>`;
    }

    // --- Context control shared by stickies and file bubbles ------------------

    const MODE_LABEL = { off: 'Off', branch: 'This branch', canvas: 'Whole canvas' };
    const modeOf = (item) => (item.context_mode === 'branch' && item.node_id ? 'branch' : item.context_mode === 'canvas' ? 'canvas' : 'off');

    const BranchIcon = () => html`
      <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 2.5v11M4.5 9.5c0-3 7-1.5 7-5" /><circle cx="11.5" cy="3.5" r="1.4" fill="currentColor" stroke="none" /><circle cx="4.5" cy="13.2" r="1.4" fill="currentColor" stroke="none" />
      </svg>`;
    const OffIcon = () => html`
      <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="8" cy="8" r="5.2" /><path d="M4.4 11.6l7.2-7.2" />
      </svg>`;
    const ModeIcon = ({ mode }) => (mode === 'branch' ? html`<${BranchIcon} />` : mode === 'canvas' ? html`<${PinIcon} filled=${true} />` : html`<${OffIcon} />`);

    // The small button on a bubble that shows its context mode and opens the bubble menu.
    function ContextButton({ kind, item, ctx, className }) {
      const mode = modeOf(item);
      const what = mode === 'branch' ? `AI context: this branch (“${ctx.nodeTitle}” and everything below it)`
        : mode === 'canvas' ? 'AI context: whole canvas'
        : 'AI context: off';
      return html`
        <button
          class=${className + ' ctx-btn' + (mode !== 'off' ? ' on' : '')}
          title=${what + '. Click to change, attach or detach.'}
          aria-label=${what}
          aria-haspopup="menu"
          aria-expanded=${!!ctx.menuOpen}
          onClick=${() => ctx.onToggleMenu(item.id)}
        ><${ModeIcon} mode=${mode} /></button>`;
    }

    // Drawn on the bubble itself: its badge (pin or branch), the attach handle
    // and, when open, the bubble menu.
    function BubbleExtras({ kind, item, ctx }) {
      const mode = modeOf(item);
      const attached = !!item.node_id;
      const stop = (e) => e.stopPropagation();
      const option = (value, hint, disabled) => html`
        <button
          class=${'menu-item' + (mode === value ? ' on' : '')}
          role="menuitemradio"
          aria-checked=${mode === value}
          disabled=${disabled}
          onClick=${() => ctx.onMode(kind, item.id, value)}
        >
          <span class="tick">${mode === value ? '●' : '○'}</span>
          <span class="what">${MODE_LABEL[value]}<small>${hint}</small></span>
        </button>`;
      return html`
        ${mode === 'canvas' && html`<span class="pin-mark" title="Whole canvas: every node on this canvas can use it"><${PinIcon} filled=${true} /></span>`}
        ${mode === 'branch' && html`<span class="pin-mark branch" style=${{ '--node': ctx.accent }} title=${`This branch: “${ctx.nodeTitle}” and everything below it can use it`}><${BranchIcon} /></span>`}
        <button
          class=${'attach-handle' + (ctx.isLinking ? ' on' : '')}
          title="Drag onto a card to attach"
          aria-label="Attach: drag onto a card"
          onPointerDown=${(e) => ctx.onLinkStart(e, kind, item)}
          onPointerMove=${ctx.onLinkMove}
          onPointerUp=${ctx.onLinkEnd}
          onPointerCancel=${ctx.onLinkEnd}
          onDblClick=${stop}
        ></button>
        ${ctx.menuOpen && html`
          <div class="bubble-menu" role="menu" onPointerDown=${stop} onDblClick=${stop}>
            <div class="menu-label">AI context</div>
            ${option('off', 'Not given to the AI')}
            ${option('branch', attached ? `“${ctx.nodeTitle}” and every node below it` : 'Attach it to a card first', !attached)}
            ${option('canvas', 'Every node on this canvas')}
            <div class="menu-sep"></div>
            <button class="menu-item" role="menuitem" onClick=${() => ctx.onAttachPick(kind, item.id)}>
              <span class="tick"></span>
              <span class="what">${attached ? 'Attach to another card…' : 'Attach to…'}<small>Then click the card</small></span>
            </button>
            ${attached && html`
              <button class="menu-item" role="menuitem" onClick=${() => ctx.onDetach(kind, item.id)}>
                <span class="tick"></span>
                <span class="what">Detach<small>From “${ctx.nodeTitle}”</small></span>
              </button>`}
          </div>`}`;
    }

    // --- File bubbles -------------------------------------------------------

    // The coloured type badge: PDF, IMG, DOC, or the ending of a text file.
    function FileIcon({ name, big }) {
      const kind = fileKind(name);
      const label = kind === 'pdf' ? 'PDF' : kind === 'image' ? 'IMG' : kind === 'word' ? 'DOC' : kind === 'text' ? fileExt(name).toUpperCase() : 'FILE';
      return html`<span class=${'file-icon k-' + kind + (big ? ' big' : '')} aria-hidden="true">${label}</span>`;
    }

    // A file's text is loaded on demand and kept for the rest of the session
    // (a file's content never changes after upload).
    const fileTextCache = new Map();
    function loadFileText(id, limit) {
      const key = id + ':' + limit;
      if (!fileTextCache.has(key)) {
        const request = api(`/api/files/${id}/text?limit=${limit}`);
        request.catch(() => fileTextCache.delete(key)); // a failed load can be tried again
        fileTextCache.set(key, request);
      }
      return fileTextCache.get(key);
    }
    function useFileText(id, limit, enabled) {
      const [state, setState] = useState({ status: enabled ? 'loading' : 'idle', data: null, error: null });
      const [attempt, setAttempt] = useState(0);
      useEffect(() => {
        if (!enabled) { setState({ status: 'idle', data: null, error: null }); return undefined; }
        let current = true;
        setState({ status: 'loading', data: null, error: null });
        loadFileText(id, limit).then(
          (data) => { if (current) setState({ status: 'ready', data, error: null }); },
          (err) => { if (current) setState({ status: 'error', data: null, error: err.message }); });
        return () => { current = false; };
      }, [id, limit, enabled, attempt]);
      return { ...state, retry: () => setAttempt((a) => a + 1) };
    }

    // An uploaded file on the canvas. Click to open it in the reader panel,
    // drag to move. The bottom bar holds normal buttons and never starts a drag.
    function FileBubble({ file, x, y, isDragging, isReading, onPath, save, removal, onHeight, onDragStart, onDragMove, onDragEnd, onAskDelete, onCancelDelete, onDelete, onRetrySave, ctx }) {
      const ref = useRef(null);
      const kind = fileKind(file.name);
      const hasText = (kind === 'text' || kind === 'word') && file.status === 'ready';
      const preview = useFileText(file.id, 280, hasText);
      const [thumb, setThumb] = useState('loading'); // image thumbnail: loading | ready | failed

      useLayoutEffect(() => {
        const el = ref.current;
        const report = () => onHeight(file.id, el.offsetHeight);
        report();
        const ro = new ResizeObserver(report);
        ro.observe(el);
        return () => ro.disconnect();
      }, [file.id, onHeight]);

      const stop = (e) => e.stopPropagation();
      const inBar = (e) => e.target.closest('.filebub-bar, .bubble-menu, .attach-handle');

      let inner;
      if (kind === 'image') {
        inner = thumb === 'failed'
          ? html`<div class="stack"><${FileIcon} name=${file.name} big=${true} /><span>Preview not available</span></div>`
          : html`<img src=${`/api/files/${file.id}/content`} alt="" draggable=${false} loading="lazy" onLoad=${() => setThumb('ready')} onError=${() => setThumb('failed')} />`;
      } else if (hasText && preview.status === 'loading') {
        inner = html`<${Spinner} label="Loading preview…" />`;
      } else if (hasText && preview.status === 'ready' && preview.data.text.trim()) {
        inner = html`<div class="lines">${preview.data.text}</div>`;
      } else {
        inner = html`
          <div class="stack">
            <${FileIcon} name=${file.name} big=${true} />
            ${file.status === 'error' && html`<span class="err">Text could not be read</span>`}
            ${hasText && preview.status === 'ready' && html`<span>(empty)</span>`}
            ${hasText && preview.status === 'error' && html`<span class="err">Preview failed</span>`}
          </div>`;
      }

      let bar;
      if (removal) {
        bar = removal.busy
          ? html`<${Spinner} label="Deleting…" />`
          : html`
              <span class=${'state' + (removal.error ? ' bad' : '')} title=${removal.error || ''}>${removal.error ? 'Could not delete.' : 'Delete this file?'}</span>
              <button onClick=${() => onDelete(file.id)}>${removal.error ? 'Retry' : 'Delete'}</button>
              <button onClick=${() => onCancelDelete(file.id)}>Cancel</button>`;
      } else if (save && save.state === 'failed') {
        bar = html`
          <span class="state bad" title=${save.error}>Not saved</span>
          <button onClick=${() => onRetrySave(file.id)}>Retry</button>
          <${ContextButton} kind="file" item=${file} ctx=${ctx} className="" />
          <button class="x" title="Delete this file" aria-label="Delete this file" onClick=${() => onAskDelete(file.id)}>×</button>`;
      } else {
        bar = html`
          <span class="state">${save && save.state === 'saving' ? 'Saving…' : `${KIND_LABEL[kind]} · ${formatBytes(file.size)}`}</span>
          <${ContextButton} kind="file" item=${file} ctx=${ctx} className="" />
          <button class="x" title="Delete this file" aria-label="Delete this file" onClick=${() => onAskDelete(file.id)}>×</button>`;
      }

      return html`
        <div
          class=${'filebub' + (isDragging ? ' dragging' : '') + (isReading ? ' reading' : '') + (onPath ? ' onpath' : '') + (file.status === 'error' ? ' bad' : '') + (ctx.menuOpen ? ' menu-open' : '')}
          ref=${ref}
          data-file=${file.id}
          style=${{ left: x + 'px', top: y + 'px' }}
          title=${file.status === 'error' && file.error ? file.error : 'Click to open · drag to move'}
          onPointerDown=${(e) => { if (!inBar(e)) onDragStart(e, file); }}
          onPointerMove=${onDragMove}
          onPointerUp=${onDragEnd}
          onPointerCancel=${onDragEnd}
        >
          <div class="filebub-head">
            <${FileIcon} name=${file.name} />
            <span class="filebub-name" title=${file.name}>${file.name}</span>
          </div>
          <div class="filebub-preview">${inner}</div>
          <div class="filebub-bar" onPointerDown=${stop}>${bar}</div>
          <${BubbleExtras} kind="file" item=${file} ctx=${ctx} />
        </div>`;
    }

    // A file on its way to the server: progress bar with percentage, then
    // "Processing…", or the error with Retry where a retry can help.
    function UploadBubble({ upload, x, y, onRetry, onDismiss }) {
      const percent = Math.round(upload.progress * 100);
      let inner;
      let bar;
      if (upload.state === 'failed') {
        inner = html`<div class="stack"><span class="err">${upload.error}</span></div>`;
        bar = html`
          <span class="state bad">Not uploaded</span>
          ${upload.canRetry && html`<button class="primary" onClick=${() => onRetry(upload.key)}>Retry</button>`}
          <button onClick=${() => onDismiss(upload.key)}>Dismiss</button>`;
      } else if (upload.state === 'processing') {
        inner = html`<div class="stack"><div class="progress"><i style=${{ width: '100%' }}></i></div><${Spinner} label="Processing…" since=${upload.since} /></div>`;
        bar = html`<span class="state">Uploaded, saving…</span>`;
      } else {
        inner = html`
          <div class="stack">
            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow=${percent}><i style=${{ width: percent + '%' }}></i></div>
            <span class="percent">Uploading… ${percent}%</span>
          </div>`;
        bar = html`
          <span class="state">${formatBytes(upload.size)}</span>
          <button onClick=${() => onDismiss(upload.key)}>Cancel</button>`;
      }
      const stop = (e) => e.stopPropagation();
      return html`
        <div class=${'filebub uploading onpath' + (upload.state === 'failed' ? ' bad' : '')} style=${{ left: x + 'px', top: y + 'px' }} onPointerDown=${stop}>
          <div class="filebub-head">
            <${FileIcon} name=${upload.name} />
            <span class="filebub-name" title=${upload.name}>${upload.name}</span>
          </div>
          <div class="filebub-preview">${inner}</div>
          <div class="filebub-bar">${bar}</div>
        </div>`;
    }

    // A file open in the reader panel: images are shown, PDFs sit in the
    // browser's own viewer, text and Word files are shown as text.
    function FileViewer({ file, onClose }) {
      const kind = fileKind(file.name);
      const url = `/api/files/${file.id}/content`;
      const hasText = (kind === 'text' || kind === 'word') && file.status === 'ready';
      const text = useFileText(file.id, FILE_TEXT_LIMIT, hasText);
      const [image, setImage] = useState({ state: 'loading', attempt: 0 });
      useEffect(() => { setImage({ state: 'loading', attempt: 0 }); }, [file.id]);
      const isMarkdown = fileExt(file.name) === 'md';
      const mdHtml = useMemo(() => (isMarkdown && text.status === 'ready' ? renderMarkdown(text.data.text) : ''), [isMarkdown, text.status, text.data]);

      let body;
      let flush = false;
      if (kind === 'pdf') {
        flush = true;
        body = html`
          <iframe class="file-frame" src=${url} title=${file.name}></iframe>
          <div class="file-foot">If the PDF does not show here, <a href=${url} target="_blank" rel="noopener noreferrer">open it in a new tab</a>.</div>`;
      } else if (kind === 'image') {
        body = html`
          ${image.state === 'loading' && html`<div class="reader-foot"><${Spinner} label="Loading image…" /></div>`}
          ${image.state === 'failed'
            ? html`<div class="reader-error">The image could not be loaded.</div>
                   <div class="reader-foot"><button class="primary" onClick=${() => setImage((i) => ({ state: 'loading', attempt: i.attempt + 1 }))}>Retry</button></div>`
            : html`<img
                key=${image.attempt}
                class="file-image"
                src=${image.attempt ? `${url}?retry=${image.attempt}` : url}
                alt=${file.name}
                style=${{ display: image.state === 'ready' ? 'block' : 'none' }}
                onLoad=${() => setImage((i) => ({ ...i, state: 'ready' }))}
                onError=${() => setImage((i) => ({ ...i, state: 'failed' }))}
              />`}`;
      } else if (file.status === 'error') {
        body = html`<div class="reader-error">${file.error || 'This file could not be read.'}</div>`;
      } else if (text.status === 'loading' || text.status === 'idle') {
        body = html`<div class="reader-foot"><${Spinner} label="Loading text…" /></div>`;
      } else if (text.status === 'error') {
        body = html`
          <div class="reader-error">Could not load the text: ${text.error}</div>
          <div class="reader-foot"><button class="primary" onClick=${text.retry}>Retry</button></div>`;
      } else {
        const note = text.data.truncated
          ? html`<p class="file-note">Showing the first ${text.data.text.length.toLocaleString('en-GB')} of ${text.data.total.toLocaleString('en-GB')} characters. Download the file to see all of it.</p>`
          : kind === 'word' ? html`<p class="file-note">Text taken from the Word file, without its formatting.</p>` : null;
        const content = !text.data.text.trim()
          ? html`<div class="ctx-empty">This file has no text.</div>`
          : isMarkdown
            ? html`<div class="reader-reply md" onClick=${onMarkdownClick} dangerouslySetInnerHTML=${{ __html: mdHtml }}></div>`
            : html`<div class=${'file-text' + (kind === 'word' ? ' prose' : '')}>${text.data.text}</div>`;
        body = html`${note}${content}`;
      }

      return html`
        <aside class="reader file" aria-label="File in the reader panel">
          <div class="reader-bar">
            <${FileIcon} name=${file.name} />
            <span class="file-title" title=${file.name}>${file.name}</span>
            <span class="spacer"></span>
            <a class="btn" href=${url + '?download=1'} download=${file.name} title=${`Download ${file.name} (${formatBytes(file.size)})`}>Download</a>
            <button class="close" onClick=${onClose} aria-label="Close reader" title="Close (Esc)">×</button>
          </div>
          <div class=${'reader-scroll scroll' + (flush ? ' flush' : '')}>${body}</div>
        </aside>`;
    }

    // Copy text to the clipboard; falls back to the old selection trick where
    // the Clipboard API is not available.
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch { /* try the fallback */ }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (!ok) throw new Error('The browser blocked copying.');
    }

    function Reader({ node, liveText, pendingSince, retry, onClose, onContinue, onBranch, onRetry }) {
      const [copy, setCopy] = useState({ state: 'idle', error: null }); // idle | busy | done | failed
      const copyTimer = useRef(null);
      useEffect(() => () => clearTimeout(copyTimer.current), []);
      // A different node in the panel starts with a fresh Copy button.
      useEffect(() => { clearTimeout(copyTimer.current); setCopy({ state: 'idle', error: null }); }, [node.id]);

      const text = node.status === 'done' ? node.reply
        : node.status === 'pending' ? (liveText || node.reply || '')
        : '';
      const replyHtml = useMemo(() => (text ? renderMarkdown(text) : ''), [text]);

      const onCopy = async () => {
        clearTimeout(copyTimer.current);
        setCopy({ state: 'busy', error: null });
        try {
          await copyText(node.reply);
          setCopy({ state: 'done', error: null });
          copyTimer.current = setTimeout(() => setCopy({ state: 'idle', error: null }), 2000);
        } catch (err) {
          setCopy({ state: 'failed', error: err.message });
        }
      };
      const copyLabel = copy.state === 'busy' ? 'Copying…' : copy.state === 'done' ? 'Copied' : copy.state === 'failed' ? 'Copy failed · Retry' : 'Copy';

      const done = node.status === 'done';
      let reply;
      if (node.status === 'error') {
        reply = html`
          <div class="reader-error">${node.error || 'The AI call failed.'}</div>
          ${retry && retry.error && html`<div class="reader-error">Retry failed: ${retry.error}</div>`}
          <div class="reader-foot">
            <button class="primary" disabled=${retry && retry.busy} onClick=${() => onRetry(node)}>Retry</button>
            ${retry && retry.busy && html`<${Spinner} label="Retrying…" />`}
          </div>`;
      } else if (!text) {
        reply = html`<div class="reader-foot"><${Spinner} label="Thinking…" since=${pendingSince} /></div>`;
      } else {
        reply = html`
          <div class="reader-reply md" onClick=${onMarkdownClick} dangerouslySetInnerHTML=${{ __html: replyHtml }}></div>
          ${!done && html`<div class="reader-foot"><${Spinner} label="Writing…" since=${pendingSince} /></div>`}`;
      }

      return html`
        <aside class="reader" aria-label="Reader panel">
          <div class="reader-bar">
            <span class="name">Reader</span>
            <span class="spacer"></span>
            <button disabled=${!done || copy.state === 'busy'} onClick=${onCopy} title=${copy.error || 'Copy the reply as Markdown'}>${copyLabel}</button>
            <button disabled=${!done} onClick=${() => onContinue(node)} title="Add a follow-up directly below">Continue</button>
            <button disabled=${!done} onClick=${() => onBranch(node)} title="Start a second direction from this node">Branch</button>
            <button class="close" onClick=${onClose} aria-label="Close reader" title="Close (Esc)">×</button>
          </div>
          <div class="reader-scroll scroll">
            <div class="reader-label">Prompt</div>
            <div class="reader-prompt">${node.prompt}</div>
