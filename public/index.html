        for (const upload of fresh) if (upload.state === 'uploading') sendUpload(upload);
      };

      // Dragging files in from the computer. The card under the pointer lights
      // up as the drop target before release.
      const carriesFiles = (e) => !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
      const onFileDragOver = (e) => {
        if (!carriesFiles(e) || doc.status !== 'ready') return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        const card = e.target.closest ? e.target.closest('.card') : null;
        const nodeId = card ? card.dataset.id : null;
        setDropping((prev) => (prev && prev.nodeId === nodeId ? prev : { nodeId }));
      };
      const onFileDragLeave = (e) => {
        if (!e.currentTarget.contains(e.relatedTarget)) setDropping(null);
      };
      const onFileDrop = (e) => {
        if (!carriesFiles(e)) return;
        e.preventDefault();
        setDropping(null);
        if (doc.status !== 'ready') return;
        const files = Array.from(e.dataTransfer.files || []);
        const card = e.target.closest ? e.target.closest('.card') : null;
        if (card && card.dataset.id) return addFiles(files, { nodeId: card.dataset.id });
        // Dropped on a panel: there is no canvas point under it, so use the centre.
        if (e.target.closest && e.target.closest('.reader, .composer, .minimap')) return addFiles(files, null);
        const rect = viewportRef.current.getBoundingClientRect();
        const v = viewRef.current;
        addFiles(files, { x: (e.clientX - rect.left - v.x) / v.k, y: (e.clientY - rect.top - v.y) / v.k });
      };
      // A file dropped anywhere else on the page must not make the browser open it.
      useEffect(() => {
        const guard = (e) => {
          if (e.defaultPrevented || !e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'none';
        };
        const clear = () => setDropping(null);
        window.addEventListener('dragover', guard);
        window.addEventListener('drop', guard);
        window.addEventListener('dragend', clear);
        return () => {
          window.removeEventListener('dragover', guard);
          window.removeEventListener('drop', guard);
          window.removeEventListener('dragend', clear);
        };
      }, []);

      // Deleting, with a small confirm inside the bubble (shares the stickies' confirm state).
      const deleteFile = async (id) => {
        const file = doc.files.find((f) => f.id === id);
        setRemovals((m) => ({ ...m, [id]: { busy: true, error: null } }));
        try {
          await api('/api/files/' + id, { method: 'DELETE' });
          setDoc((d) => ({ ...d, files: d.files.filter((f) => f.id !== id) }));
          setFileReaderId((current) => (current === id ? null : current));
          setSaveState(id, null);
          delete saveQueue.current[id];
          cancelDeleteSticky(id);
          if (file) bumpStoredBytes(file.canvas_id, -file.size);
        } catch (err) {
          setRemovals((m) => ({ ...m, [id]: { busy: false, error: err.message } }));
        }
      };

      // Dragging: like stickies, the stored x and y move by the drag distance,
      // which works for free files (canvas position) and attached ones (offset).
      // A press that does not move is a click and opens the file.
      const fileDrag = useRef(null);
      const onFileDragStart = (e, file) => {
        if (e.button !== 0) return;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
        fileDrag.current = {
          id: file.id, pointerId: e.pointerId,
          startX: e.clientX, startY: e.clientY,
          origX: file.x, origY: file.y, x: file.x, y: file.y,
          moved: false,
        };
      };
      const onFileDragMove = (e) => {
        const d = fileDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        const dx = e.clientX - d.startX;
        const dy = e.clientY - d.startY;
        if (!d.moved && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
        if (!d.moved) { d.moved = true; setDraggingFile(d.id); }
        const k = viewRef.current.k;
        d.x = Math.round(d.origX + dx / k);
        d.y = Math.round(d.origY + dy / k);
        updateFile(d.id, { x: d.x, y: d.y });
      };
      const onFileDragEnd = (e) => {
        const d = fileDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        fileDrag.current = null;
        setDraggingFile(null);
        if (d.moved) saveFile(d.id, { x: d.x, y: d.y });
        else if (e.type === 'pointerup') openFile(d.id);
      };

      // -- Render ------------------------------------------------------------

      const byId = new Map(doc.nodes.map((n) => [n.id, n]));
      const colours = branchColours(doc.nodes);
      const tree = treeInfo(doc.nodes);
      const hidden = hiddenNodes(collapsed, tree.childrenOf);
      const visibleNodes = doc.nodes.filter((n) => !hidden.has(n.id));
      const activePath = selectedId && byId.has(selectedId) ? pathTo(selectedId, byId) : new Set();

      // An edge takes the accent colour of the card it leads into. Edges on the
      // active path are drawn last so they sit on top.
      const edges = [];
      const activeEdges = [];
      for (const child of visibleNodes) {
        const parent = child.parent_id && byId.get(child.parent_id);
        if (parent && heights[parent.id] !== undefined) {
          const active = activePath.has(child.id);
          (active ? activeEdges : edges).push(html`
            <path
              key=${child.id}
              class=${active ? 'active' : ''}
              style=${{ stroke: `var(--branch-${colours.get(child.id)})` }}
              d=${curve(parent.x + CARD_W / 2, parent.y + heights[parent.id], child.x + CARD_W / 2, child.y)}
            />`);
        }
      }
      edges.push(...activeEdges);

      // Attached stickies: a short dashed connector from the card's edge to the sticky's edge.
      // A sticky attached to a hidden node is hidden with it.
      const placedStickies = doc.stickies
        .filter((st) => !(st.node_id && hidden.has(st.node_id)))
        .map((st) => ({ st, ...stickyPosition(st, byId) }));

      // Files, and files still uploading, are placed the same way as stickies.
      const placedFiles = doc.files
        .filter((f) => !(f.node_id && hidden.has(f.node_id)))
        .map((f) => ({ f, ...stickyPosition(f, byId) }));
      const placedUploads = uploads
        .filter((u) => doc.canvas && u.canvasId === doc.canvas.id && !(u.nodeId && hidden.has(u.nodeId)))
        .map((u) => ({ u, ...stickyPosition({ node_id: u.nodeId, x: u.x, y: u.y }, byId) }));
      const readerFile = fileReaderId ? doc.files.find((f) => f.id === fileReaderId) : null;
      const storedBytes = doc.files.reduce((sum, f) => sum + f.size, 0);
      const dropNode = dropping && dropping.nodeId ? byId.get(dropping.nodeId) : null;

      // Minimap blocks: every card on show in its branch colour, plus stickies.
      const miniBlocks = [
        ...visibleNodes.map((n) => ({ key: n.id, x: n.x, y: n.y, w: CARD_W, h: heights[n.id] || 200, fill: `var(--branch-${colours.get(n.id)})`, opacity: 0.9 })),
        ...placedStickies.map(({ st, x, y }) => ({ key: st.id, x, y, w: STICKY_W, h: stickyHeights[st.id] || 120, fill: STICKY_LINE[st.color] || STICKY_LINE.yellow, opacity: 0.75 })),
        ...placedFiles.map(({ f, x, y }) => ({ key: f.id, x, y, w: FILE_W, h: stickyHeights[f.id] || FILE_H, fill: 'var(--muted)', opacity: 0.75 })),
      ];
      // Attached files: the same short dashed connector as attached stickies.
      for (const { f, x, y } of placedFiles) {
        const node = f.node_id ? byId.get(f.node_id) : null;
        if (!node || heights[node.id] === undefined) continue;
        const cardRect = { x: node.x, y: node.y, w: CARD_W, h: heights[node.id] };
        const fileRect = { x, y, w: FILE_W, h: stickyHeights[f.id] || FILE_H };
        if (rectsOverlap(cardRect, fileRect)) continue;
        const a = borderPoint(cardRect, fileRect.x + fileRect.w / 2, fileRect.y + fileRect.h / 2);
        const b = borderPoint(fileRect, cardRect.x + cardRect.w / 2, cardRect.y + cardRect.h / 2);
        const scoped = modeOf(f) === 'branch';
        edges.push(html`<line key=${'tether-' + f.id} class=${'tether' + (scoped ? ' branch' : '') + (activePath.has(node.id) ? ' onpath' : '')} style=${{ stroke: scoped ? `var(--branch-${colours.get(node.id)})` : 'var(--muted)' }} x1=${a.x} y1=${a.y} x2=${b.x} y2=${b.y} />`);
      }
      // The connector being dragged from an attach handle.
      if (linking) {
        const item = (linking.kind === 'file' ? placedFiles.map((p) => ({ item: p.f, x: p.x, y: p.y })) : placedStickies.map((p) => ({ item: p.st, x: p.x, y: p.y }))).find((p) => p.item.id === linking.id);
        if (item) {
          const rect = { x: item.x, y: item.y, w: linking.kind === 'file' ? FILE_W : STICKY_W, h: stickyHeights[linking.id] || (linking.kind === 'file' ? FILE_H : 120) };
          const from = borderPoint(rect, linking.x, linking.y);
          edges.push(html`<line key="link-draft" class="link-draft" x1=${from.x} y1=${from.y} x2=${linking.x} y2=${linking.y} />`);
        }
      }
      for (const { st, x, y } of placedStickies) {
        const node = st.node_id ? byId.get(st.node_id) : null;
        if (!node || heights[node.id] === undefined) continue;
        const cardRect = { x: node.x, y: node.y, w: CARD_W, h: heights[node.id] };
        const noteRect = { x, y, w: STICKY_W, h: stickyHeights[st.id] || 120 };
        if (rectsOverlap(cardRect, noteRect)) continue;
        const a = borderPoint(cardRect, noteRect.x + noteRect.w / 2, noteRect.y + noteRect.h / 2);
        const b = borderPoint(noteRect, cardRect.x + cardRect.w / 2, cardRect.y + cardRect.h / 2);
        const scoped = modeOf(st) === 'branch';
        edges.push(html`<line key=${'tether-' + st.id} class=${'tether' + (scoped ? ' branch' : '') + (activePath.has(node.id) ? ' onpath' : '')} style=${{ stroke: scoped ? `var(--branch-${colours.get(node.id)})` : (STICKY_LINE[st.color] || STICKY_LINE.yellow) }} x1=${a.x} y1=${a.y} x2=${b.x} y2=${b.y} />`);
      }

      // The node being written: a dashed outline where it will land, joined to its parent.
      const ready = doc.status === 'ready';
      const isEmpty = ready && doc.nodes.length === 0;
      const composerParent = composer && composer.parentId ? byId.get(composer.parentId) : null;
      const readerNode = readerId ? byId.get(readerId) : null;
      const contextCount = doc.stickies.filter((st) => modeOf(st) !== 'off').length + doc.files.filter((f) => modeOf(f) !== 'off').length;

      // Context chips: what each node can see. Its own branch items first, then
      // each ancestor's (nearest first), then everything on the whole canvas.
      const accentOf = (nodeId) => `var(--branch-${colours.get(nodeId)})`;
      const chipOf = (kind, item) => ({ kind, id: item.id, label: kind === 'file' ? item.name : snippet(firstLine(item.content), 40) });
      const usable = [
        ...doc.stickies.filter((st) => (st.content || '').trim()).map((st) => ({ kind: 'sticky', item: st })),
        ...doc.files.map((f) => ({ kind: 'file', item: f })),
      ];
      const canvasChips = usable.filter(({ item }) => modeOf(item) === 'canvas').map(({ kind, item }) => ({ ...chipOf(kind, item), scope: 'canvas' }));
      const branchItems = new Map(); // node id -> [{ kind, item }]
      for (const entry of usable) {
        if (modeOf(entry.item) !== 'branch' || !byId.has(entry.item.node_id)) continue;
        if (!branchItems.has(entry.item.node_id)) branchItems.set(entry.item.node_id, []);
        branchItems.get(entry.item.node_id).push(entry);
      }
      const chipsFor = (node) => {
        if (canvasChips.length === 0 && branchItems.size === 0) return null;
        const chips = [];
        const seen = new Set();
        for (let n = node; n && !seen.has(n.id); n = n.parent_id ? byId.get(n.parent_id) : null) {
          seen.add(n.id);
          for (const { kind, item } of branchItems.get(n.id) || []) {
            chips.push({ ...chipOf(kind, item), scope: 'branch', own: n.id === node.id, from: snippet(n.prompt, 40), accent: accentOf(n.id) });
          }
        }
        return [...chips, ...canvasChips];
      };

      // Jump to a bubble or a node: open any collapsed ancestor, then centre on it.
      const uncollapseAbove = (nodeId, inclusive) => {
        let changed = false;
        const next = new Set(collapsed);
        const seen = new Set();
        let n = byId.get(nodeId);
        if (n && !inclusive) n = n.parent_id ? byId.get(n.parent_id) : null;
        for (; n && !seen.has(n.id); n = n.parent_id ? byId.get(n.parent_id) : null) {
          seen.add(n.id);
          if (next.delete(n.id)) changed = true;
        }
        if (changed) { setCollapsed(next); if (doc.canvas) saveCollapsed(doc.canvas.id, next); }
      };
      const showBubble = (kind, id) => {
        const item = findBubble(kind, id);
        if (!item) return;
        if (item.node_id) uncollapseAbove(item.node_id, false);
        const pos = stickyPosition(item, byId);
        const w = kind === 'file' ? FILE_W : STICKY_W;
        centreOn({ x: pos.x + w / 2, y: pos.y + (stickyHeights[id] || (kind === 'file' ? FILE_H : 120)) / 2 });
      };
      const showNode = (id) => {
        const node = byId.get(id);
        if (!node) return;
        uncollapseAbove(id, false);
        setSelectedId(id);
        centreOn({ x: node.x + CARD_W / 2, y: node.y + (heights[id] || 200) / 2 });
      };

      // Everything a bubble needs for its context control, menu and attach handle.
      const bubbleCtx = (item) => {
        const node = item.node_id ? byId.get(item.node_id) : null;
        return {
          menuOpen: menuFor === item.id,
          isLinking: !!linking && linking.id === item.id,
          nodeTitle: node ? snippet(node.prompt, 40) : '',
          accent: node ? accentOf(node.id) : null,
          onToggleMenu: toggleMenu,
          onMode: setContextMode,
          onAttachPick: startAttachPick,
          onDetach: detachBubble,
          onLinkStart, onLinkMove, onLinkEnd,
        };
      };
      const pickItem = attachPick ? findBubble(attachPick.kind, attachPick.id) : null;
      const pickName = pickItem ? (attachPick.kind === 'file' ? pickItem.name : snippet(firstLine(pickItem.content) || 'this note', 40)) : '';
      const showGhost = composer && composer.x !== null && !isEmpty;
      if (showGhost && composerParent && heights[composerParent.id] !== undefined) {
        edges.push(html`<path key="draft" class="draft" d=${curve(composerParent.x + CARD_W / 2, composerParent.y + heights[composerParent.id], composer.x + CARD_W / 2, composer.y)} />`);
      }

      let composerLabel = '';
      if (composer) {
        if (isEmpty) composerLabel = 'Start a conversation';
        else if (composer.mode === 'root') composerLabel = 'New conversation';
        else if (composerParent) composerLabel = `${composer.mode === 'branch' ? 'Branch from' : 'Continue from'} “${snippet(composerParent.prompt)}”`;
      }

      // Dot grid follows pan and zoom; spacing widens when zoomed far out.
      const gridStep = GRID * view.k * (view.k < 0.4 ? 4 : 1);
      const viewportStyle = {
        backgroundSize: `${gridStep}px ${gridStep}px`,
        backgroundPosition: `${view.x}px ${view.y}px`,
      };

      let overlay = null;
      if (list.status === 'loading') {
        overlay = html`<div class="notice"><div class="row"><${Spinner} label="Loading canvases…" /></div></div>`;
      } else if (list.status === 'error') {
        overlay = html`<div class="notice bad"><strong>Could not load your canvases</strong>${list.error}<br /><button onClick=${loadList}>Retry</button></div>`;
      } else if (!canvasId) {
        overlay = html`<div class="notice"><strong>No canvases yet</strong>Create one to get started.<br /><button onClick=${onNewCanvas} disabled=${creating.busy}>New canvas</button></div>`;
      } else if (doc.status === 'loading') {
        overlay = html`<div class="notice"><div class="row"><${Spinner} label="Loading canvas…" /></div></div>`;
      } else if (doc.status === 'error') {
        overlay = html`<div class="notice bad"><strong>Could not load this canvas</strong>${doc.error}<br /><button onClick=${() => loadCanvas(canvasId)}>Retry</button></div>`;
      }

      return html`
        <div class="topbar">
          <span class="brand">canvas-chat-tree</span>
          <select
            aria-label="Switch canvas"
            value=${canvasId || ''}
            disabled=${list.status !== 'ready' || list.items.length === 0}
            onChange=${(e) => setCanvasId(e.target.value)}
          >
            ${list.items.length === 0 && html`<option value="">No canvases</option>`}
            ${list.items.map((c) => html`<option key=${c.id} value=${c.id}>${c.title}${c.file_bytes > 0 ? ` · ${formatBytes(c.file_bytes)}` : ''}</option>`)}
          </select>
          <button onClick=${onNewCanvas} disabled=${creating.busy || list.status !== 'ready'}>New canvas</button>
          <button onClick=${onNewConversation} disabled=${!ready || isEmpty || (composer && composer.busy)}>New conversation</button>
          <button onClick=${() => addSticky(null)} disabled=${!ready || stickyAdd.busy} title="Add a free sticky note at the centre of the screen">+ Sticky</button>
          <button onClick=${() => fileInputRef.current.click()} disabled=${!ready} title=${`Add files to this canvas: ${ACCEPTED_LABEL}, up to 10 MB each. You can also drag files onto the canvas or onto a card.`}>+ File</button>
          <input
            ref=${fileInputRef}
            type="file"
            multiple
            accept=${FILE_ACCEPT}
            style=${{ display: 'none' }}
            onChange=${(e) => { addFiles(Array.from(e.target.files || []), null); e.target.value = ''; }}
          />
          <button onClick=${runTidy} disabled=${!ready || doc.nodes.length === 0 || tidyBusy} title="Rearrange every card into a clean tree and save the positions">Tidy</button>
          <button
            class=${contextOpen ? 'on' : ''}
            onClick=${toggleContext}
            disabled=${!ready}
            title="Instructions, and the notes and files given to the AI on this canvas"
          >Context${contextCount > 0 ? ` · ${contextCount}` : ''}</button>
          ${stickyAdd.busy && html`<${Spinner} label="Adding sticky…" />`}
          ${stickyAdd.error && html`
            <span class="inline-status bad">
              <span class="clip" title=${stickyAdd.error}>Could not add the sticky: ${stickyAdd.error}</span>
              <button onClick=${() => addSticky(stickyAdd.node)}>Retry</button>
            </span>`}
          ${creating.busy && html`<${Spinner} label="Creating canvas…" />`}
          ${creating.error && html`
            <span class="inline-status bad">
              <span class="clip" title=${creating.error}>Could not create the canvas: ${creating.error}</span>
              <button onClick=${() => createCanvas(creating.title)}>Retry</button>
            </span>`}
          ${ready && html`
            <span class="title">
              ${doc.canvas.title}
              <small>${doc.nodes.length} ${doc.nodes.length === 1 ? 'node' : 'nodes'}${doc.files.length > 0 ? ` · ${doc.files.length} ${doc.files.length === 1 ? 'file' : 'files'}, ${formatBytes(storedBytes)}` : ''}</small>
            </span>`}
          ${ready && storedBytes > STORAGE_WARN_BYTES && html`
            <span class="inline-status bad" role="alert" title="Files are stored in the database. Delete files you no longer need to keep it small.">
              <span class="clip">Files on this canvas use ${formatBytes(storedBytes)} (over 200 MB)</span>
            </span>`}
          <span class="spacer"></span>
          <button
            class="icon-only"
            onClick=${toggleTheme}
            title=${theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'}
            aria-label=${theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'}
          >
            ${theme === 'dark'
              ? html`<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                  <circle cx="8" cy="8" r="3" />
                  <path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" />
                </svg>`
              : html`<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
                  <path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z" />
                </svg>`}
          </button>
          <span class="zoom" title="Zoom level">${Math.round(view.k * 100)}%</span>
          <button onClick=${fit} disabled=${!ready || (doc.nodes.length === 0 && doc.stickies.length === 0 && doc.files.length === 0)}>Fit to screen</button>
        </div>

        <div
          class=${'viewport' + (panning ? ' panning' : '') + (readerNode || contextOpen || readerFile ? ' reader-open' : '') + (dropping ? ' dropping' : '')}
          ref=${viewportRef}
          style=${viewportStyle}
          onDragOver=${onFileDragOver}
          onDragLeave=${onFileDragLeave}
          onDrop=${onFileDrop}
          onPointerDownCapture=${onPickDown}
          onClickCapture=${onPickClick}
          onPointerDown=${onPointerDown}
          onPointerMove=${onPointerMove}
          onPointerUp=${onPointerUp}
          onPointerCancel=${onPointerUp}
        >
          <div class=${'world' + (activePath.size > 0 ? ' has-path' : '') + (attachPick ? ' picking' : '')} style=${{ transform: `translate(${view.x}px, ${view.y}px) scale(${view.k})` }}>
            <svg class="edges" width="1" height="1">${edges}</svg>
            ${visibleNodes.map((n) => html`
              <${Card}
                key=${n.id}
                node=${n}
                descendants=${tree.descendants.get(n.id) || 0}
                isCollapsed=${collapsed.has(n.id)}
                onToggleCollapse=${toggleCollapse}
                colour=${colours.get(n.id)}
                isActive=${activePath.has(n.id)}
                liveText=${liveText[n.id]}
                isReading=${readerId === n.id}
                onExpand=${onExpand}
                onAddSticky=${addSticky}
                isTarget=${!!composer && composer.parentId === n.id}
                isDrop=${(!!dropping && dropping.nodeId === n.id) || (!!linking && linking.nodeId === n.id)}
                chips=${chipsFor(n)}
                onChip=${showBubble}
                pendingSince=${n.status === 'pending' ? (pendingSince.current[n.id] || Date.parse(n.updated_at)) : null}
                pollError=${pollErrors[n.id]}
                retry=${retries[n.id]}
                move=${moves[n.id]}
                isDragging=${draggingId === n.id}
                onDragStart=${onDragStart}
                onDragMove=${onDragMove}
                onDragEnd=${onDragEnd}
                onSaveRetry=${onSaveRetry}
                onHeight=${onHeight}
                onContinue=${onContinue}
                onBranch=${onBranch}
                onRetry=${onRetry}
              />`)}
            ${placedStickies.map(({ st, x, y }) => html`
              <${Sticky}
                key=${st.id}
                sticky=${st}
                x=${x}
                y=${y}
                isEditing=${editingSticky === st.id}
                isDragging=${draggingSticky === st.id}
                onPath=${!!st.node_id && activePath.has(st.node_id)}
                save=${stickySaves[st.id]}
                removal=${removals[st.id]}
                onHeight=${onStickyHeight}
                onDragStart=${onStickyDragStart}
                onDragMove=${onStickyDragMove}
                onDragEnd=${onStickyDragEnd}
                onEdit=${setEditingSticky}
                onEndEdit=${endStickyEdit}
                onInput=${onStickyInput}
                onColor=${onStickyColor}
                onAskDelete=${askDeleteSticky}
                onCancelDelete=${cancelDeleteSticky}
                onDelete=${deleteSticky}
                onRetrySave=${retryStickySave}
                ctx=${bubbleCtx(st)}
              />`)}
            ${placedFiles.map(({ f, x, y }) => html`
              <${FileBubble}
                key=${f.id}
                file=${f}
                x=${x}
                y=${y}
                isDragging=${draggingFile === f.id}
                isReading=${fileReaderId === f.id}
                onPath=${!!f.node_id && activePath.has(f.node_id)}
                save=${stickySaves[f.id]}
                removal=${removals[f.id]}
                onHeight=${onStickyHeight}
                onDragStart=${onFileDragStart}
                onDragMove=${onFileDragMove}
                onDragEnd=${onFileDragEnd}
                onAskDelete=${askDeleteSticky}
                onCancelDelete=${cancelDeleteSticky}
                onDelete=${deleteFile}
                onRetrySave=${retryStickySave}
                ctx=${bubbleCtx(f)}
              />`)}
            ${placedUploads.map(({ u, x, y }) => html`
              <${UploadBubble} key=${'upload-' + u.key} upload=${u} x=${x} y=${y} onRetry=${retryUpload} onDismiss=${dismissUpload} />`)}
            ${showGhost && html`<div class="ghost" style=${{ left: composer.x + 'px', top: composer.y + 'px' }}>New node</div>`}
          </div>
          ${overlay && html`<div class="overlay">${overlay}</div>`}
          ${ready && (attachPick
            ? html`<div class="toast"><span class="msg">Click a card to attach “${pickName}” to it</span><button onClick=${() => setAttachPick(null)}>Cancel</button></div>`
            : toast)}
          ${ready && dropping && html`
            <div class="drop-hint">${dropNode ? `Drop to attach to “${snippet(dropNode.prompt, 40)}”` : 'Drop to add files here'}</div>`}
          ${ready && miniBlocks.length > 0 && vpSize.w > 0 && html`
            <${Minimap} blocks=${miniBlocks} view=${view} size=${vpSize} onMove=${centreOn} />`}
          ${ready && composer && html`
            <${Composer}
              composer=${composer}
              label=${composerLabel}
              centred=${isEmpty}
              canCancel=${!isEmpty}
              onChange=${(text) => setComposer((c) => (c ? { ...c, text } : c))}
              onSend=${sendComposer}
              onCancel=${() => setComposer(null)}
            />`}
          ${ready && contextOpen && html`
            <${ContextPanel}
              key=${doc.canvas.id}
              canvas=${doc.canvas}
              stickies=${doc.stickies}
              files=${doc.files}
              nodes=${doc.nodes}
              colours=${colours}
              onSaveInstructions=${saveInstructions}
              onSetMode=${setContextMode}
              onShowBubble=${showBubble}
              onShowNode=${showNode}
              onClose=${() => setContextOpen(false)}
            />`}
          ${ready && readerFile && html`
            <${FileViewer} key=${readerFile.id} file=${readerFile} onClose=${() => setFileReaderId(null)} />`}
          ${ready && readerNode && html`
            <${Reader}
              node=${readerNode}
              liveText=${liveText[readerNode.id]}
              pendingSince=${readerNode.status === 'pending' ? (pendingSince.current[readerNode.id] || Date.parse(readerNode.updated_at)) : null}
              retry=${retries[readerNode.id]}
              onClose=${() => setReaderId(null)}
              onContinue=${fromReader('continue')}
              onBranch=${fromReader('branch')}
              onRetry=${onRetry}
            />`}
        </div>`;
    }

    const root = document.getElementById('app');
    root.textContent = '';
    render(html`<${App} />`, root);
  </script>
</body>
</html>
