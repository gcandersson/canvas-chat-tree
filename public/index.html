            <div class="reader-label">Reply ${node.model && html`<small>${node.model}</small>`}</div>
            ${reply}
          </div>
        </aside>`;
    }

    // Side panel: what the AI gets with every prompt on this canvas.
    // Mounted once per canvas (it is keyed by canvas id).
    function ContextPanel({ canvas, stickies, files, nodes, colours, onSaveInstructions, onSetMode, onShowBubble, onShowNode, onClose }) {
      const [draft, setDraft] = useState(canvas.instructions || '');
      const [save, setSave] = useState({ state: 'idle', error: null }); // idle | saving | saved | failed
      const draftRef = useRef(draft);
      const dirty = useRef(false);
      const timer = useRef(null);
      const seq = useRef(0);

      const saveNow = async () => {
        clearTimeout(timer.current);
        if (!dirty.current) return;
        dirty.current = false;
        const mine = ++seq.current;
        setSave({ state: 'saving', error: null });
        try {
          await onSaveInstructions(canvas.id, draftRef.current);
          if (mine === seq.current) setSave({ state: 'saved', error: null });
        } catch (err) {
          dirty.current = true; // so Retry (or the next edit) sends it again
          if (mine === seq.current) setSave({ state: 'failed', error: err.message });
        }
      };
      const onInput = (e) => {
        draftRef.current = e.target.value;
        setDraft(e.target.value);
        dirty.current = true;
        clearTimeout(timer.current);
        timer.current = setTimeout(saveNow, 800);
      };
      // Closing the panel or switching canvas with unsaved text still saves it.
      useEffect(() => () => {
        clearTimeout(timer.current);
        if (dirty.current) onSaveInstructions(canvas.id, draftRef.current).catch(() => {});
      }, []);

      const { pinned, included, leftOut, used } = selectPinnedNotes(stickies);
      const canvasFiles = files.filter((f) => modeOf(f) === 'canvas');
      const canvasCount = pinned.length + canvasFiles.length;

      // Branch context, grouped by the node each item is attached to (nodes in creation order).
      const groups = [];
      for (const node of nodes) {
        const items = [
          ...stickies.filter((st) => st.node_id === node.id && modeOf(st) === 'branch').map((st) => ({ kind: 'sticky', item: st })),
          ...files.filter((f) => f.node_id === node.id && modeOf(f) === 'branch').map((f) => ({ kind: 'file', item: f })),
        ];
        if (items.length > 0) groups.push({ node, items });
      }
      const branchCount = groups.reduce((sum, g) => sum + g.items.length, 0);

      const row = (kind, item, tags) => {
        const empty = kind === 'sticky' && !(item.content || '').trim();
        return html`
          <div key=${kind + item.id} class=${'ctx-note' + (empty || (tags && tags.out) ? ' out' : '')}>
            ${kind === 'sticky'
              ? html`<span class="swatch" style=${{ '--dot': STICKY_LINE[item.color] || STICKY_LINE.yellow }}></span>`
              : html`<${FileIcon} name=${item.name} />`}
            <button class="line" onClick=${() => onShowBubble(kind, item.id)} title="Show it on the canvas">${kind === 'file' ? item.name : empty ? '(empty note)' : firstLine(item.content)}</button>
            ${empty && html`<span class="tag">empty, not sent</span>`}
            ${tags && tags.out && !empty && html`<span class="tag bad">left out</span>`}
            <button class="unpin" onClick=${() => onSetMode(kind, item.id, 'off')} title="Set its AI context to Off">Turn off</button>
          </div>`;
      };

      let state;
      if (save.state === 'saving') state = html`<div class="ctx-state"><${Spinner} label="Saving…" /></div>`;
      else if (save.state === 'saved') state = html`<div class="ctx-state">Saved</div>`;
      else if (save.state === 'failed') {
        state = html`<div class="ctx-state bad"><span class="clip" title=${save.error}>Not saved: ${save.error}</span><button onClick=${saveNow}>Retry</button></div>`;
      } else state = html`<div class="ctx-state">Saved automatically as you type.</div>`;

      return html`
        <aside class="reader context" aria-label="Context panel">
          <div class="reader-bar">
            <span class="name">Context</span>
            <span class="spacer"></span>
            <button class="close" onClick=${onClose} aria-label="Close context panel" title="Close (Esc)">×</button>
          </div>
          <div class="reader-scroll scroll">
            <p class="ctx-intro">What the AI is given on this canvas, besides the path to the node. Other canvases are not affected.</p>

            <div class="reader-label">Instructions</div>
            <textarea
              class="ctx-instructions scroll"
              placeholder="For example: Always answer in exactly three bullet points."
              value=${draft}
              onInput=${onInput}
              onBlur=${saveNow}
            ></textarea>
            ${state}

            <div class="reader-label">
              Whole canvas
              <small>${canvasCount === 0 ? 'nothing' : `${canvasCount} ${canvasCount === 1 ? 'item' : 'items'}${pinned.length > 0 ? ` · notes use ${used.toLocaleString('en-GB')} of ${PINNED_NOTES_CAP.toLocaleString('en-GB')} characters` : ''}`}</small>
            </div>
            ${leftOut.length > 0 && html`
              <div class="ctx-warning" role="alert">
                Pinned notes are limited to ${PINNED_NOTES_CAP.toLocaleString('en-GB')} characters in total. Newest notes go first, and
                ${leftOut.length === 1 ? ' this note does not fit, so it is not sent to the AI:' : ' these notes do not fit, so they are not sent to the AI:'}
                <ul>${leftOut.map((st) => html`<li key=${st.id}>${firstLine(st.content)}</li>`)}</ul>
              </div>`}
            ${canvasCount === 0 && html`
              <div class="ctx-empty">Nothing yet. Open the context control on a sticky or a file and choose “Whole canvas” to give it to every node on this canvas.</div>`}
            ${pinned.map((st) => row('sticky', st, { out: !!(st.content || '').trim() && !included.has(st.id) }))}
            ${canvasFiles.map((f) => row('file', f))}

            <div class="reader-label ctx-section">
              Attached to branches
              <small>${branchCount === 0 ? 'nothing' : `${branchCount} ${branchCount === 1 ? 'item' : 'items'}`}</small>
            </div>
            ${branchCount === 0 && html`
              <div class="ctx-empty">Nothing yet. Attach a sticky or a file to a card and choose “This branch”: that node and every node below it can then use it, and no other branch can.</div>`}
            ${groups.map((g) => html`
              <div key=${g.node.id}>
                <button class="ctx-group" onClick=${() => onShowNode(g.node.id)} title="Show this node on the canvas">
                  <span class="bar" style=${{ '--node': `var(--branch-${colours.get(g.node.id)})` }}></span>${snippet(g.node.prompt, 70)}
                </button>
                ${g.items.map(({ kind, item }) => row(kind, item))}
              </div>`)}
          </div>
        </aside>`;
    }

    function Composer({ composer, label, centred, canCancel, onChange, onSend, onCancel }) {
      const inputRef = useRef(null);

      // Focus the box whenever the composer opens or is pointed at another node.
      useEffect(() => {
        if (inputRef.current) inputRef.current.focus();
      }, [composer.key]);

      const onKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          onSend();
        } else if (e.key === 'Escape' && canCancel && !composer.busy) {
          e.preventDefault();
          onCancel();
        }
      };

      const empty = !composer.text.trim();
      return html`
        <div class=${'composer' + (centred ? ' centred' : '')}>
          <div class="composer-label" title=${label}>${label}</div>
          <textarea
            ref=${inputRef}
            class="scroll"
            placeholder="Write a prompt…"
            value=${composer.text}
            disabled=${composer.busy}
            onInput=${(e) => onChange(e.target.value)}
            onKeyDown=${onKeyDown}
          ></textarea>
          ${composer.error && html`<div class="composer-error">Could not send: ${composer.error}</div>`}
          <div class="composer-row">
            <button class="primary" disabled=${composer.busy || empty} onClick=${onSend}>
              ${composer.error ? 'Retry' : 'Send'}
            </button>
            ${canCancel && html`<button disabled=${composer.busy} onClick=${onCancel}>Cancel</button>`}
            ${composer.busy
              ? html`<${Spinner} label="Sending…" />`
              : html`<span class="hint">Enter to send · Shift+Enter for a new line${canCancel ? ' · Esc to cancel' : ''}</span>`}
          </div>
        </div>`;
    }

    // --- Branch colours -----------------------------------------------------

    const PALETTE_SIZE = 8;

    // Accent colour (palette index) for every node. Pure render logic; nothing is stored.
    // Going through the nodes in creation order: a root starts a new colour, the
    // first child of a node inherits its parent's colour, and every later child
    // (a branch) takes the next palette colour, skipping its parent's and its
    // siblings' colours where it can.
    function branchColours(nodes) {
      const sorted = [...nodes].sort((a, b) =>
        a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : a.id < b.id ? -1 : 1);
      const colour = new Map();   // node id -> palette index
      const taken = new Map();    // parent id -> colours its children already use
      let next = 0;
      for (const n of sorted) {
        if (!n.parent_id || !colour.has(n.parent_id)) {
          colour.set(n.id, next++ % PALETTE_SIZE);
          continue;
        }
        const parentColour = colour.get(n.parent_id);
        const siblings = taken.get(n.parent_id) || new Set();
        let c = parentColour;
        if (siblings.size > 0) {
          for (let tries = 0; tries < PALETTE_SIZE; tries++) {
            c = next++ % PALETTE_SIZE;
            if (c !== parentColour && !siblings.has(c)) break;
          }
        }
        siblings.add(c);
        taken.set(n.parent_id, siblings);
        colour.set(n.id, c);
      }
      return colour;
    }

    // --- Canvas context -----------------------------------------------------

    const PINNED_NOTES_CAP = 8000; // total characters of pinned-note text sent to the AI

    // Which pinned notes the AI gets. Same rule as selectPinnedNotes in
    // server.js: newest first; a note is included while it still fits in the
    // cap, otherwise it is left out; empty notes are skipped.
    function selectPinnedNotes(stickies) {
      const pinned = stickies
        .filter((st) => modeOf(st) === 'canvas')
        .sort((a, b) => (a.created_at > b.created_at ? -1 : a.created_at < b.created_at ? 1 : a.id > b.id ? -1 : 1));
      const included = new Set();
      const leftOut = [];
      let used = 0;
      for (const st of pinned) {
        const text = (st.content || '').trim();
        if (!text) continue;
        if (used + text.length <= PINNED_NOTES_CAP) {
          used += text.length;
          included.add(st.id);
        } else {
          leftOut.push(st);
        }
      }
      return { pinned, included, leftOut, used };
    }

    const firstLine = (text) => {
      const line = (text || '').trim().split('\n')[0];
      return line.length > 70 ? line.slice(0, 69) + '…' : line;
    };

    const PinIcon = ({ filled }) => html`
      <svg viewBox="0 0 16 16" width="12" height="12" fill=${filled ? 'currentColor' : 'none'} stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M9.6 1.8l4.6 4.6-1.9.5-2.4 2.4.2 2.9-1.1 1.1-2.9-2.9-3.6 3.6 M6.1 10.4 3.2 7.5l1.1-1.1 2.9.2 2.4-2.4z" />
      </svg>`;

    // --- Collapse -----------------------------------------------------------

    // For every node: its children and how many descendants it has in total.
    function treeInfo(nodes) {
      const childrenOf = new Map();
      for (const n of nodes) {
        if (!n.parent_id) continue;
        if (!childrenOf.has(n.parent_id)) childrenOf.set(n.parent_id, []);
        childrenOf.get(n.parent_id).push(n.id);
      }
      const descendants = new Map();
      const count = (id) => {
        if (descendants.has(id)) return descendants.get(id);
        descendants.set(id, 0); // guards against a cycle in bad data
        let total = 0;
        for (const child of childrenOf.get(id) || []) total += 1 + count(child);
        descendants.set(id, total);
        return total;
      };
      for (const n of nodes) count(n.id);
      return { childrenOf, descendants };
    }

    // Collapsing a node hides its descendants only: never the node itself,
    // its siblings, its ancestors or its parent's other children.
    function hiddenNodes(collapsed, childrenOf) {
      const hidden = new Set();
      for (const id of collapsed) {
        const stack = [...(childrenOf.get(id) || [])];
        while (stack.length) {
          const next = stack.pop();
          if (hidden.has(next)) continue;
          hidden.add(next);
          stack.push(...(childrenOf.get(next) || []));
        }
      }
      return hidden;
    }

    // Collapse state lives in this browser only, one entry per canvas.
    const collapseKey = (canvasId) => 'canvas-chat-tree:collapsed:' + canvasId;
    function loadCollapsed(canvasId) {
      try {
        const ids = JSON.parse(localStorage.getItem(collapseKey(canvasId)) || '[]');
        return new Set(Array.isArray(ids) ? ids : []);
      } catch {
        return new Set();
      }
    }
    function saveCollapsed(canvasId, collapsed) {
      try {
        if (collapsed.size === 0) localStorage.removeItem(collapseKey(canvasId));
        else localStorage.setItem(collapseKey(canvasId), JSON.stringify([...collapsed]));
      } catch { /* storage unavailable: collapse still works until reload */ }
    }

    // The active path: a node plus all its ancestors back to the root.
    function pathTo(id, byId) {
      const path = new Set();
      for (let n = byId.get(id); n && !path.has(n.id); n = n.parent_id ? byId.get(n.parent_id) : null) path.add(n.id);
      return path;
    }

    // --- Geometry -----------------------------------------------------------

    // Smooth curve from (x1, y1) at a parent's bottom-centre to (x2, y2) at a child's top-centre.
    function curve(x1, y1, x2, y2) {
      const bend = Math.max(40, Math.abs(y2 - y1) / 2);
      return `M ${x1} ${y1} C ${x1} ${y1 + bend}, ${x2} ${y2 - bend}, ${x2} ${y2}`;
    }

    // The point where the line from a rectangle's centre towards (tx, ty) crosses its border.
    function borderPoint(r, tx, ty) {
      const cx = r.x + r.w / 2;
      const cy = r.y + r.h / 2;
      const dx = tx - cx;
      const dy = ty - cy;
      if (dx === 0 && dy === 0) return { x: cx, y: cy };
      const scale = Math.min(dx === 0 ? Infinity : r.w / 2 / Math.abs(dx), dy === 0 ? Infinity : r.h / 2 / Math.abs(dy));
      return { x: cx + dx * scale, y: cy + dy * scale };
    }
    const rectsOverlap = (a, b, gap = 0) =>
      a.x < b.x + b.w + gap && a.x + a.w + gap > b.x && a.y < b.y + b.h + gap && a.y + a.h + gap > b.y;

    // Where a sticky is drawn. An attached sticky stores its offset from its card.
    function stickyPosition(sticky, byId) {
      const node = sticky.node_id ? byId.get(sticky.node_id) : null;
      return node ? { x: node.x + sticky.x, y: node.y + sticky.y } : { x: sticky.x, y: sticky.y };
    }

    function fitView(nodes, heights, width, height, extraRects = []) {
      if (nodes.length === 0 && extraRects.length === 0) return { x: width / 2, y: height / 2, k: 1 };
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const n of nodes) {
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + CARD_W);
        maxY = Math.max(maxY, n.y + (heights[n.id] || 200));
      }
      for (const r of extraRects) {
        minX = Math.min(minX, r.x);
        minY = Math.min(minY, r.y);
        maxX = Math.max(maxX, r.x + r.w);
        maxY = Math.max(maxY, r.y + r.h);
      }
      const boxW = maxX - minX;
      const boxH = maxY - minY;
      const availW = Math.max(50, width - FIT_PADDING * 2);
      const availH = Math.max(50, height - FIT_PADDING * 2);
      // Never zoom in past 100% just to fill the screen.
      const k = clamp(Math.min(availW / boxW, availH / boxH), MIN_ZOOM, 1);
      return {
        x: (width - boxW * k) / 2 - minX * k,
        y: (height - boxH * k) / 2 - minY * k,
        k,
      };
    }

    // Slide a new card to the right until it no longer overlaps an existing card.
    function avoidOverlap(x, y, nodes, heights) {
      const margin = 20;
      const overlaps = (cx) => nodes.some((n) => {
        const nh = heights[n.id] || 200;
        return cx < n.x + CARD_W + margin && cx + CARD_W + margin > n.x &&
               y < n.y + nh + margin && y + NEW_CARD_H + margin > n.y;
      });
      let cx = x;
      for (let i = 0; i < 100 && overlaps(cx); i++) cx += CARD_W + GAP_X;
      return { x: cx, y };
    }

    // Continue: directly below the parent. If the parent already has children,
    // the slot below is taken, so the new child goes beside them instead.
    // Branch: to the right of the existing children, so branches fan out side by side.
    function placeChild(mode, parent, nodes, heights) {
      const children = nodes.filter((n) => n.parent_id === parent.id);
      const belowY = parent.y + (heights[parent.id] || 200) + GAP_Y;
      if (children.length === 0) {
        const x = mode === 'branch' ? parent.x + CARD_W + GAP_X : parent.x;
        return avoidOverlap(x, belowY, nodes, heights);
      }
      const rightmost = children.reduce((a, b) => (b.x > a.x ? b : a));
      return avoidOverlap(rightmost.x + CARD_W + GAP_X, rightmost.y, nodes, heights);
    }

    // Tidy layout: a clean top-down tree for every root, trees side by side.
    // Returns Map(node id -> { x, y }). It only computes; the caller animates
    // and saves. Children keep their creation order, left to right. Each
    // subtree gets a column as wide as its children need, the parent is centred
    // over it, and each depth is one row, as tall as its tallest card.
    function tidyLayout(nodes, heights) {
      const sorted = [...nodes].sort((a, b) =>
        a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : a.id < b.id ? -1 : 1);
      const ids = new Set(sorted.map((n) => n.id));
      const childrenOf = new Map();
      const roots = [];
      for (const n of sorted) {
        if (n.parent_id && ids.has(n.parent_id)) {
          if (!childrenOf.has(n.parent_id)) childrenOf.set(n.parent_id, []);
          childrenOf.get(n.parent_id).push(n.id);
        } else {
          roots.push(n.id);
        }
      }
      const kids = (id) => childrenOf.get(id) || [];
      const heightOf = (id) => heights[id] || UNMEASURED_H;

      // Width of each subtree.
      const widthOf = new Map();
      const measure = (id) => {
        let total = 0;
        kids(id).forEach((child, i) => { total += measure(child) + (i ? GAP_X : 0); });
        const width = Math.max(CARD_W, total);
        widthOf.set(id, width);
        return width;
      };

      // The layout starts at the top-left corner of where the cards are now,
      // so the canvas does not jump somewhere else.
      const originX = Math.min(...sorted.map((n) => n.x));
      const originY = Math.min(...sorted.map((n) => n.y));

      const result = new Map();
      let treeLeft = originX;
      for (const root of roots) {
        measure(root);
        const placed = []; // { id, x, depth }
        const place = (id, left, depth) => {
          const width = widthOf.get(id);
          placed.push({ id, x: left + (width - CARD_W) / 2, depth });
          const children = kids(id);
          const childrenWidth = children.reduce((sum, c, i) => sum + widthOf.get(c) + (i ? GAP_X : 0), 0);
          let childLeft = left + (width - childrenWidth) / 2;
          for (const child of children) {
            place(child, childLeft, depth + 1);
            childLeft += widthOf.get(child) + GAP_X;
          }
        };
        place(root, treeLeft, 0);

        const rowHeight = [];
        for (const item of placed) rowHeight[item.depth] = Math.max(rowHeight[item.depth] || 0, heightOf(item.id));
        const rowTop = [originY];
        for (let d = 1; d < rowHeight.length; d++) rowTop[d] = rowTop[d - 1] + rowHeight[d - 1] + GAP_Y;
        for (const item of placed) result.set(item.id, { x: Math.round(item.x), y: Math.round(rowTop[item.depth]) });

        treeLeft += widthOf.get(root) + TREE_GAP;
      }
      return result;
    }

    // A wheel over a card section that really has overflow scrolls that section
    // instead of panning the canvas.
    function scrollableUnder(target, stopAt) {
      for (let el = target; el && el !== stopAt; el = el.parentElement) {
        if (el.classList && el.classList.contains('scroll') && el.scrollHeight > el.clientHeight + 1) return el;
      }
      return null;
    }

    // --- App ----------------------------------------------------------------

    function App() {
      const [list, setList] = useState({ status: 'loading', items: [], error: null });
      const [canvasId, setCanvasId] = useState(() => location.hash.slice(1) || null);
      const [doc, setDoc] = useState({ status: 'idle', canvas: null, nodes: [], stickies: [], files: [], error: null });
      const [view, setView] = useState({ x: 0, y: 0, k: 1 });
      const [heights, setHeights] = useState({});
      const [creating, setCreating] = useState({ busy: false, error: null, title: null });
      const [panning, setPanning] = useState(false);
      // composer: null, or { key, mode: 'continue'|'branch'|'root', parentId, x, y, text, busy, error }
      const [composer, setComposer] = useState(null);
      const [retries, setRetries] = useState({});       // node id -> { busy, error }
      const [pollErrors, setPollErrors] = useState({}); // node id -> message
      const [moves, setMoves] = useState({});           // node id -> { busy, error, x, y } while a position is being saved
      const [draggingId, setDraggingId] = useState(null);
      const [liveText, setLiveText] = useState({});     // node id -> reply text received over the stream so far
      const [readerId, setReaderId] = useState(null);   // node shown in the reader panel
      const [contextOpen, setContextOpen] = useState(false); // the Context panel (shares the reader's place)
      const [selectedId, setSelectedId] = useState(null); // node whose path to the root is highlighted
      const [theme, setTheme] = useState(() => chosenTheme() || systemTheme());
      // Tidy layout: phase is idle | animating | saving | done | restored | failed.
      const [tidy, setTidy] = useState({ phase: 'idle' });
      const [collapsed, setCollapsed] = useState(() => new Set()); // node ids whose descendants are hidden
      const [vpSize, setVpSize] = useState({ w: 0, h: 0 });        // viewport size, for the minimap
      const [stickyHeights, setStickyHeights] = useState({});
      const [editingSticky, setEditingSticky] = useState(null);   // sticky id being edited
      const [draggingSticky, setDraggingSticky] = useState(null);
      const [stickySaves, setStickySaves] = useState({});         // sticky id -> { state: saving|saved|failed, error }
      const [removals, setRemovals] = useState({});               // sticky id -> { busy, error } while its delete confirm is open
      const [stickyAdd, setStickyAdd] = useState({ busy: false, error: null, node: null });
      const [streamTick, setStreamTick] = useState(0);  // bumped when a node drops from streaming to polling
      const [fileReaderId, setFileReaderId] = useState(null);     // file shown in the reader panel
      const [uploads, setUploads] = useState([]);                 // files on their way to the server
      const [menuFor, setMenuFor] = useState(null);               // id of the bubble whose menu is open
      const [linking, setLinking] = useState(null);               // { kind, id, x, y, nodeId } while a connector is dragged from an attach handle
      const [attachPick, setAttachPick] = useState(null);         // { kind, id } while "Attach to…" waits for a click on a card
      const [draggingFile, setDraggingFile] = useState(null);
      const [dropping, setDropping] = useState(null);             // null, or { nodeId } while files are dragged over the canvas

      const viewportRef = useRef(null);
      const loadSeq = useRef(0);
      const fitWhenMeasured = useRef(false);
      const composerSeq = useRef(0);
      const pendingSince = useRef({}); // node id -> ms timestamp the wait started, as seen by this browser
      const polling = useRef(new Set());
      const sources = useRef(new Map());   // node id -> open EventSource
      const noStream = useRef(new Set());  // node ids whose stream failed; these are polled instead
      const liveBuffer = useRef({});       // node id -> text, flushed to state a few times a second
      const flushTimer = useRef(null);
      const viewRef = useRef(view);
      viewRef.current = view;
      const flushStickiesRef = useRef(null);
      const animFrame = useRef(null);
      const animTimer = useRef(null);
      const readerOpenRef = useRef(false);
      readerOpenRef.current = readerId !== null || contextOpen || fileReaderId !== null;
      const fileInputRef = useRef(null);
      const uploadSeq = useRef(0);
      const uploadRequests = useRef(new Map()); // upload key -> XMLHttpRequest in flight
      const nodesRef = useRef(doc.nodes);
      nodesRef.current = doc.nodes;

      // -- Theme -------------------------------------------------------------

      // The stylesheet switches on this attribute, so a change shows at once.
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      // Until a theme has been chosen with the toggle, follow the system setting live.
      useEffect(() => {
        if (!window.matchMedia) return;
        const query = window.matchMedia('(prefers-color-scheme: light)');
        const onChange = () => { if (!chosenTheme()) setTheme(systemTheme()); };
        query.addEventListener('change', onChange);
        return () => query.removeEventListener('change', onChange);
      }, []);

      const toggleTheme = () => {
        const next = theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem(THEME_KEY, next); } catch { /* still switches, just not remembered */ }
        setTheme(next);
      };

      // -- Loading -----------------------------------------------------------

      const loadList = useCallback(async () => {
        setList((l) => ({ ...l, status: 'loading', error: null }));
        try {
          const items = await api('/api/canvases');
          setList({ status: 'ready', items, error: null });
          // Keep the canvas from the URL if it exists; otherwise open the newest.
          setCanvasId((current) => (current && items.some((c) => c.id === current) ? current : (items[0] ? items[0].id : null)));
        } catch (err) {
          setList({ status: 'error', items: [], error: err.message });
        }
      }, []);

      const loadCanvas = useCallback(async (id) => {
        const seq = ++loadSeq.current;
        setDoc({ status: 'loading', canvas: null, nodes: [], stickies: [], files: [], error: null });
        setHeights({});
        setComposer(null);
        setRetries({});
        setPollErrors({});
        setMoves({});
        cancelAnimationFrame(animFrame.current);
        clearTimeout(animTimer.current);
        setTidy({ phase: 'idle' });
        // Send any sticky text still waiting for its autosave before leaving this canvas.
        if (flushStickiesRef.current) flushStickiesRef.current();
        setReaderId(null);
        setFileReaderId(null);
        setMenuFor(null);
        setLinking(null);
        setAttachPick(null);
        setDropping(null);
        // Uploads still running belong to the canvas being left: stop them.
        for (const request of uploadRequests.current.values()) request.abort();
        uploadRequests.current.clear();
        setUploads([]);
        setSelectedId(null);
        setStickyHeights({});
        setEditingSticky(null);
        setStickySaves({});
        setRemovals({});
        setStickyAdd({ busy: false, error: null, node: null });
        setLiveText({});
        liveBuffer.current = {};
        noStream.current = new Set();
        try {
          const data = await api('/api/canvases/' + id);
          if (seq !== loadSeq.current) return; // a newer load has started
          fitWhenMeasured.current = true;
          setCollapsed(loadCollapsed(id));
          setDoc({ status: 'ready', canvas: data.canvas, nodes: data.nodes, stickies: data.stickies || [], files: data.files || [], error: null });
        } catch (err) {
          if (seq !== loadSeq.current) return;
          setDoc({ status: 'error', canvas: null, nodes: [], stickies: [], files: [], error: err.message });
        }
      }, []);

      useEffect(() => { loadList(); }, [loadList]);

      useEffect(() => {
        if (list.status !== 'ready') return;
        if (!canvasId) {
          loadSeq.current++;
          setDoc({ status: 'idle', canvas: null, nodes: [], stickies: [], files: [], error: null });
          setComposer(null);
          return;
        }
        if (location.hash.slice(1) !== canvasId) history.replaceState(null, '', '#' + canvasId);
        loadCanvas(canvasId);
      }, [canvasId, list.status, loadCanvas]);

      useEffect(() => {
        const onHash = () => {
          const id = location.hash.slice(1);
          if (!id) return;
          setCanvasId(id);
          // A canvas the switcher does not know about yet (e.g. made in another
          // tab): refresh the list, which also falls back if the id is unknown.
          if (!list.items.some((c) => c.id === id)) loadList();
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, [list.items, loadList]);

      // -- Fit to screen -----------------------------------------------------

      const fit = useCallback(() => {
        const rect = viewportRef.current.getBoundingClientRect();
        const byId = new Map(doc.nodes.map((n) => [n.id, n]));
        // Only what is on show counts: collapsed-away nodes and their stickies are left out.
        const hidden = hiddenNodes(collapsed, treeInfo(doc.nodes).childrenOf);
        const shown = doc.nodes.filter((n) => !hidden.has(n.id));
        const stickyRects = doc.stickies
          .filter((st) => !(st.node_id && hidden.has(st.node_id)))
          .map((st) => ({ ...stickyPosition(st, byId), w: STICKY_W, h: stickyHeights[st.id] || 120 }));
        const fileRects = doc.files
          .filter((f) => !(f.node_id && hidden.has(f.node_id)))
          .map((f) => ({ ...stickyPosition(f, byId), w: FILE_W, h: stickyHeights[f.id] || FILE_H }));
        setView(fitView(shown, heights, rect.width, rect.height, [...stickyRects, ...fileRects]));
      }, [doc.nodes, doc.stickies, doc.files, heights, stickyHeights, collapsed]);

      // Fit once after a canvas loads, as soon as every card has been measured.
      useEffect(() => {
        if (!fitWhenMeasured.current || doc.status !== 'ready') return;
        const hidden = hiddenNodes(collapsed, treeInfo(doc.nodes).childrenOf);
        if (doc.nodes.every((n) => hidden.has(n.id) || heights[n.id] !== undefined)) {
          fitWhenMeasured.current = false;
          fit();
        }
      }, [doc, heights, fit, collapsed]);

      // Collapse or expand one node, and remember it for this canvas in this browser.
      const toggleCollapse = (id) => {
        setCollapsed((prev) => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          if (doc.canvas) saveCollapsed(doc.canvas.id, next);
          return next;
        });
      };

      // Track the viewport's size (the minimap needs it to draw what is on screen).
      useLayoutEffect(() => {
        const el = viewportRef.current;
        const measure = () => setVpSize((prev) => (prev.w === el.clientWidth && prev.h === el.clientHeight ? prev : { w: el.clientWidth, h: el.clientHeight }));
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      // Minimap: put the given canvas point at the centre of the screen.
      const centreOn = useCallback((point) => {
        const el = viewportRef.current;
        setView((v) => ({ ...v, x: el.clientWidth / 2 - point.x * v.k, y: el.clientHeight / 2 - point.y * v.k }));
      }, []);

      const onHeight = useCallback((id, value) => {
        setHeights((prev) => (prev[id] === value ? prev : { ...prev, [id]: value }));
      }, []);
      const onStickyHeight = useCallback((id, value) => {
        setStickyHeights((prev) => (prev[id] === value ? prev : { ...prev, [id]: value }));
      }, []);

      // Pan just enough to bring a canvas rectangle on screen. The bottom of the
      // screen is treated as taken by the composer.
      const reveal = useCallback((x, y, w, hgt) => {
        const rect = viewportRef.current.getBoundingClientRect();
        const pad = 24;
        const usableBottom = Math.max(rect.height * 0.4, rect.height - 240);
        // An open reader panel covers the right side of the screen.
        const usableRight = readerOpenRef.current && rect.width >= READER_WIDE ? rect.width - READER_W : rect.width;
        setView((v) => {
          const left = v.x + x * v.k;
          const top = v.y + y * v.k;
          const right = left + w * v.k;
          const bottom = top + hgt * v.k;
          let dx = 0;
          let dy = 0;
          if (right > usableRight - pad) dx = usableRight - pad - right;
          if (left + dx < pad) dx = pad - left;
          if (bottom > usableBottom - pad) dy = usableBottom - pad - bottom;
          if (top + dy < pad) dy = pad - top;
          return dx || dy ? { ...v, x: v.x + dx, y: v.y + dy } : v;
        });
      }, []);

      // -- Wheel and trackpad: scroll pans, pinch or Ctrl/Cmd + wheel zooms ---

      useEffect(() => {
        const vp = viewportRef.current;

        // Zoom by a factor, keeping the canvas point under (px, py) fixed.
        const zoomAt = (clientX, clientY, factor) => {
          const rect = vp.getBoundingClientRect();
          const px = clientX - rect.left;
          const py = clientY - rect.top;
          setView((v) => {
            const k = clamp(v.k * factor, MIN_ZOOM, MAX_ZOOM);
            const ratio = k / v.k;
            return { x: px - (px - v.x) * ratio, y: py - (py - v.y) * ratio, k };
          });
        };

        // One scroll gesture is a burst of wheel events. Whatever the first one
        // did (pan the canvas, or scroll some content) the rest of the burst
        // keeps doing, so panning across a card with a long reply does not
        // suddenly start scrolling that reply, and the other way round.
        let gesture = { mode: null, at: 0 };
        const GESTURE_GAP_MS = 180;

        const onWheel = (e) => {
          // Trackpad pinch arrives as a wheel event with ctrlKey set; Ctrl or
          // Cmd + wheel is the same thing done by hand.
          const zoom = e.ctrlKey || e.metaKey;
          const overPanel = e.target.closest('.composer, .reader, .minimap');

          // Wheel deltas in pixels, whatever unit the device reports.
          let dx = e.deltaX;
          let dy = e.deltaY;
          if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
          else if (e.deltaMode === 2) { dx *= vp.clientWidth; dy *= vp.clientHeight; }

          if (zoom) {
            e.preventDefault(); // never let the browser zoom the whole page
            if (overPanel) return;
            // A mouse wheel moves in big notches, a pinch in small steps.
            const coarse = e.deltaMode !== 0 || Math.abs(e.deltaY) >= 50;
            zoomAt(e.clientX, e.clientY, Math.exp(-dy * (coarse ? 0.0015 : 0.01)));
            return;
          }

          const now = performance.now();
          const continuing = now - gesture.at < GESTURE_GAP_MS;
          let mode;
          if (continuing && gesture.mode) mode = gesture.mode;
          else mode = overPanel || scrollableUnder(e.target, vp) ? 'scroll' : 'pan';
          // Panels always keep their own scrolling, even mid-gesture.
          if (overPanel) mode = 'scroll';
          gesture = { mode, at: now };

          if (mode === 'scroll') return; // the content under the cursor scrolls by itself

          // Pan. Two-finger scroll gives both axes; a plain wheel gives vertical
          // only, and Shift + wheel turns that into horizontal.
          e.preventDefault();
          if (e.shiftKey && dx === 0) { dx = dy; dy = 0; }
          setView((v) => ({ ...v, x: v.x - dx, y: v.y - dy }));
        };

        // Safari reports trackpad pinch as gesture events instead.
        let lastScale = 1;
        const onGestureStart = (e) => { e.preventDefault(); lastScale = e.scale; };
        const onGestureChange = (e) => {
          e.preventDefault();
          zoomAt(e.clientX, e.clientY, e.scale / lastScale);
          lastScale = e.scale;
        };

        vp.addEventListener('wheel', onWheel, { passive: false });
        vp.addEventListener('gesturestart', onGestureStart);
        vp.addEventListener('gesturechange', onGestureChange);
        return () => {
          vp.removeEventListener('wheel', onWheel);
          vp.removeEventListener('gesturestart', onGestureStart);
          vp.removeEventListener('gesturechange', onGestureChange);
        };
      }, []);

      // -- Pan (drag empty space) --------------------------------------------

      const drag = useRef(null);
      const onPointerDown = (e) => {
        if (e.button !== 0 && e.button !== 1) return;
        if (e.target.closest('.card, .sticky, .filebub, .notice, .composer, .reader, .minimap, .toast')) return;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
        drag.current = { id: e.pointerId, startX: e.clientX, startY: e.clientY, lastX: e.clientX, lastY: e.clientY, moved: false };
      };
      const onPointerMove = (e) => {
        const d = drag.current;
        if (!d || d.id !== e.pointerId) return;
        if (!d.moved) {
          // Only a press that travels counts as a pan; less than that is a click.
          if (Math.hypot(e.clientX - d.startX, e.clientY - d.startY) < DRAG_THRESHOLD) return;
          d.moved = true;
          d.lastX = e.clientX;
          d.lastY = e.clientY;
          setPanning(true);
          return;
        }
        const dx = e.clientX - d.lastX;
        const dy = e.clientY - d.lastY;
        d.lastX = e.clientX;
        d.lastY = e.clientY;
        setView((v) => ({ ...v, x: v.x + dx, y: v.y + dy }));
      };
      const onPointerUp = (e) => {
        const d = drag.current;
        if (!d || d.id !== e.pointerId) return;
        drag.current = null;
        setPanning(false);
        // A click on empty canvas clears the active path. (A cancelled press does not.)
        if (!d.moved && e.type === 'pointerup') setSelectedId(null);
      };

      // -- New canvas --------------------------------------------------------

      const createCanvas = async (title) => {
        setCreating({ busy: true, error: null, title });
        try {
          const canvas = await api('/api/canvases', { method: 'POST', body: JSON.stringify({ title }) });
          setList((l) => ({ ...l, items: [{ ...canvas, node_count: 0 }, ...l.items] }));
          setCanvasId(canvas.id);
          setCreating({ busy: false, error: null, title: null });
        } catch (err) {
          setCreating({ busy: false, error: err.message, title });
        }
      };
      const onNewCanvas = () => {
        const title = window.prompt('Name for the new canvas', 'Untitled canvas');
        if (title === null) return;
        createCanvas(title.trim() || 'Untitled canvas');
      };

      // -- Composer: Continue, Branch, New conversation ----------------------

      // Where a new root node goes: the centre of what is on screen right now.
      const rootPosition = () => {
        const rect = viewportRef.current.getBoundingClientRect();
        const v = viewRef.current;
        const x = (rect.width / 2 - v.x) / v.k - CARD_W / 2;
        const y = (rect.height / 2 - v.y) / v.k - GHOST_H;
        return avoidOverlap(Math.round(x), Math.round(y), doc.nodes, heights);
      };

      const openComposer = (mode, parent) => {
        const pos = parent ? placeChild(mode, parent, doc.nodes, heights) : rootPosition();
        setComposer((prev) => ({
          key: ++composerSeq.current,
          mode,
          parentId: parent ? parent.id : null,
          x: pos.x,
          y: pos.y,
          text: prev && !prev.busy ? prev.text : '', // keep a half-written prompt when re-targeting
          busy: false,
          error: null,
        }));
        reveal(pos.x, pos.y, CARD_W, GHOST_H);
      };
      const onContinue = (node) => openComposer('continue', node);
      const onBranch = (node) => openComposer('branch', node);
      const onNewConversation = () => openComposer('root', null);

      // -- Reader panel -------------------------------------------------------

      const onExpand = (node) => {
        setContextOpen(false);
        setFileReaderId(null);
        setReaderId((current) => (current === node.id ? null : node.id));
      };
      const toggleContext = () => {
        setReaderId(null);
        setFileReaderId(null);
        setContextOpen((open) => !open);
      };
      const openFile = (id) => {
        setReaderId(null);
        setContextOpen(false);
        setFileReaderId((current) => (current === id ? null : id));
      };
      // Continue and Branch from the reader do exactly what the card's buttons do.
      // On a narrow window the panel would cover the composer, so it closes first.
      const fromReader = (mode) => (node) => {
        if (viewportRef.current.getBoundingClientRect().width < READER_WIDE) {
          readerOpenRef.current = false;
          setReaderId(null);
        }
        openComposer(mode, node);
      };

      // Esc closes the reader, unless something else (the composer) already used the key.
      useEffect(() => {
        if (readerId === null && !contextOpen && fileReaderId === null) return;
        const onKey = (e) => {
          if (e.key === 'Escape' && !e.defaultPrevented) { setReaderId(null); setContextOpen(false); setFileReaderId(null); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [readerId, contextOpen, fileReaderId]);

      // An empty canvas always shows the composer, centred.
      useEffect(() => {
        if (doc.status === 'ready' && doc.nodes.length === 0 && !composer) {
          setComposer({ key: ++composerSeq.current, mode: 'root', parentId: null, x: null, y: null, text: '', busy: false, error: null });
        }
      }, [doc.status, doc.nodes.length, composer]);

      const sendComposer = async () => {
        if (!composer || composer.busy) return;
        const prompt = composer.text.trim();
        if (!prompt) return;
        const key = composer.key;
        const targetCanvas = doc.canvas.id;
        // On an empty canvas the position is only decided now.
        const pos = composer.x === null ? rootPosition() : { x: composer.x, y: composer.y };
        setComposer((c) => (c && c.key === key ? { ...c, busy: true, error: null } : c));
        try {
          const node = await api(`/api/canvases/${targetCanvas}/nodes`, {
            method: 'POST',
            body: JSON.stringify({ parent_id: composer.parentId, prompt, x: pos.x, y: pos.y }),
          });
          pendingSince.current[node.id] = Date.now();
          // A new child under a collapsed node would be created out of sight: open the node.
          if (node.parent_id && collapsed.has(node.parent_id)) toggleCollapse(node.parent_id);
          setDoc((d) => (d.canvas && d.canvas.id === targetCanvas ? { ...d, nodes: [...d.nodes, node] } : d));
          setList((l) => ({ ...l, items: l.items.map((c) => (c.id === targetCanvas ? { ...c, node_count: c.node_count + 1 } : c)) }));
          setComposer((c) => (c && c.key === key ? null : c));
        } catch (err) {
          setComposer((c) => (c && c.key === key ? { ...c, busy: false, error: err.message } : c));
        }
      };

      const replaceNode = useCallback((fresh) => {
        setDoc((d) => (d.canvas && d.canvas.id === fresh.canvas_id
          // Keep the position shown here: the node may have been dragged since.
          ? { ...d, nodes: d.nodes.map((n) => (n.id === fresh.id ? { ...fresh, x: n.x, y: n.y } : n)) }
          : d));
      }, []);

      // -- Pending nodes: stream the reply as it is written -------------------

      const dropLive = useCallback((id) => {
        delete liveBuffer.current[id];
        setLiveText((l) => { if (!(id in l)) return l; const { [id]: _, ...rest } = l; return rest; });
      }, []);

      const openStream = useCallback((id) => {
        const es = new EventSource('/api/nodes/' + id + '/stream');
        sources.current.set(id, es);

        // Deltas arrive many times a second; update the screen at most ~12 times a second.
        const scheduleFlush = () => {
          if (flushTimer.current) return;
          flushTimer.current = setTimeout(() => {
            flushTimer.current = null;
            setLiveText((l) => ({ ...l, ...liveBuffer.current }));
          }, 80);
        };
        const close = () => {
          es.close();
          if (sources.current.get(id) === es) sources.current.delete(id);
        };
        // Anything wrong with the stream: stop using it for this node and poll instead.
        const toPolling = () => {
          close();
          noStream.current.add(id);
          setStreamTick((t) => t + 1);
        };
        const finish = (e) => {
          close();
          let node;
          try { node = JSON.parse(e.data); } catch { return toPolling(); }
          delete pendingSince.current[id];
          replaceNode(node);
          dropLive(id);
        };

        es.addEventListener('snapshot', (e) => { liveBuffer.current[id] = JSON.parse(e.data).text; scheduleFlush(); });
        es.addEventListener('delta', (e) => { liveBuffer.current[id] = (liveBuffer.current[id] || '') + JSON.parse(e.data).text; scheduleFlush(); });
        es.addEventListener('done', finish);
        es.addEventListener('failed', finish);
        es.addEventListener('gone', toPolling);
        es.onerror = toPolling; // connection failed or dropped; EventSource would retry, polling is simpler
      }, [replaceNode, dropLive]);

      // Keep exactly one stream open per pending node (unless it fell back to polling).
      const pendingIds = doc.status === 'ready'
        ? doc.nodes.filter((n) => n.status === 'pending').map((n) => n.id).join(',')
        : '';
      useEffect(() => {
        const wanted = new Set(pendingIds ? pendingIds.split(',') : []);
        for (const [id, es] of sources.current) {
          if (!wanted.has(id)) { es.close(); sources.current.delete(id); }
        }
        for (const id of wanted) {
          if (!sources.current.has(id) && !noStream.current.has(id)) openStream(id);
        }
      }, [pendingIds, streamTick, openStream]);
      useEffect(() => () => {
        for (const es of sources.current.values()) es.close();
        sources.current.clear();
        clearTimeout(flushTimer.current);
      }, []);

      // -- Fallback: poll pending nodes that have no working stream ----------

      const hasPending = doc.status === 'ready' && doc.nodes.some((n) => n.status === 'pending');
      useEffect(() => {
        if (!hasPending) return;
        const tick = () => {
          for (const n of nodesRef.current) {
            if (n.status !== 'pending' || sources.current.has(n.id) || polling.current.has(n.id)) continue;
            polling.current.add(n.id);
            api('/api/nodes/' + n.id)
              .then((fresh) => {
                setPollErrors((p) => { if (!(n.id in p)) return p; const { [n.id]: _, ...rest } = p; return rest; });
                if (fresh.status !== 'pending') {
                  delete pendingSince.current[n.id];
                  replaceNode(fresh);
                  dropLive(n.id);
                } else if (fresh.reply !== n.reply) {
                  // Still writing: show the partial reply saved so far.
                  dropLive(n.id);
                  replaceNode(fresh);
                }
              })
              .catch((err) => setPollErrors((p) => ({ ...p, [n.id]: err.message })))
              .finally(() => polling.current.delete(n.id));
          }
        };
        const t = setInterval(tick, POLL_MS);
        return () => clearInterval(t);
      }, [hasPending, replaceNode, dropLive]);

      // -- Error nodes: retry -------------------------------------------------

      const onRetry = async (node) => {
        setRetries((r) => ({ ...r, [node.id]: { busy: true, error: null } }));
        try {
          const fresh = await api(`/api/nodes/${node.id}/retry`, { method: 'POST' });
          pendingSince.current[node.id] = Date.now();
          noStream.current.delete(node.id); // give streaming another try
          dropLive(node.id);
          replaceNode(fresh);
          setRetries((r) => { const { [node.id]: _, ...rest } = r; return rest; });
        } catch (err) {
          setRetries((r) => ({ ...r, [node.id]: { busy: false, error: err.message } }));
        }
      };

      // -- Drag a node by its header; save the position on release ------------

      const nodeDrag = useRef(null);
      const moveSeq = useRef({});

      const savePosition = async (id, x, y) => {
        const seq = (moveSeq.current[id] || 0) + 1;
        moveSeq.current[id] = seq;
        setMoves((m) => ({ ...m, [id]: { busy: true, error: null, x, y } }));
        try {
          await api('/api/nodes/' + id, { method: 'PATCH', body: JSON.stringify({ x, y }) });
          if (moveSeq.current[id] !== seq) return; // moved again since
          setMoves((m) => { const { [id]: _, ...rest } = m; return rest; });
        } catch (err) {
          if (moveSeq.current[id] !== seq) return;
          setMoves((m) => ({ ...m, [id]: { busy: false, error: err.message, x, y } }));
        }
      };
      const onSaveRetry = (id) => {
        const failed = moves[id];
        if (failed) savePosition(id, failed.x, failed.y);
      };

      const onDragStart = (e, node) => {
        if (e.button !== 0) return;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
        nodeDrag.current = {
          id: node.id, pointerId: e.pointerId,
          startX: e.clientX, startY: e.clientY,
          origX: node.x, origY: node.y, x: node.x, y: node.y,
          moved: false,
        };
      };
      const onDragMove = (e) => {
        const d = nodeDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        const dx = e.clientX - d.startX;
        const dy = e.clientY - d.startY;
        // A small threshold so a plain click on the header does not count as a move.
        if (!d.moved && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
        if (!d.moved) { d.moved = true; setDraggingId(d.id); }
        const k = viewRef.current.k;
        d.x = Math.round(d.origX + dx / k);
        d.y = Math.round(d.origY + dy / k);
        setDoc((prev) => ({ ...prev, nodes: prev.nodes.map((n) => (n.id === d.id ? { ...n, x: d.x, y: d.y } : n)) }));
      };
      const onDragEnd = (e) => {
        const d = nodeDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        nodeDrag.current = null;
        setDraggingId(null);
        if (d.moved) savePosition(d.id, d.x, d.y);
        // A press on the header that did not move is a click: select the node.
        else if (e.type === 'pointerup') setSelectedId(d.id);
      };

      // -- Canvas context: instructions and pinned notes -----------------------

      // Shown at once, then saved; the panel reports saving, saved or failed.
      const saveInstructions = async (canvasId, text) => {
        setDoc((d) => (d.canvas && d.canvas.id === canvasId ? { ...d, canvas: { ...d.canvas, instructions: text } } : d));
        await api('/api/canvases/' + canvasId, { method: 'PATCH', body: JSON.stringify({ instructions: text }) });
      };

      // -- Tidy layout --------------------------------------------------------
      // A one-off action: it works out new positions, animates the cards there
      // and saves every position in one request. Positions are always stored;
      // there is no live "auto layout" mode.

      // Move cards (and optionally the view) smoothly to new positions.
      const animateTo = (targets, targetView) => new Promise((resolve) => {
        cancelAnimationFrame(animFrame.current);
        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const duration = reduced ? 0 : TIDY_MS;
        const from = new Map(nodesRef.current.map((n) => [n.id, { x: n.x, y: n.y }]));
        const fromView = viewRef.current;
        const started = performance.now();
        const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
        const mix = (a, b, e) => a + (b - a) * e;
        let finished = false;
        const step = (now) => {
          if (finished) return;
          const t = duration === 0 ? 1 : Math.min(1, (now - started) / duration);
          const e = ease(t);
          setDoc((d) => ({
            ...d,
            nodes: d.nodes.map((n) => {
              const a = from.get(n.id);
              const b = targets.get(n.id);
              if (!a || !b) return n;
              return t === 1 ? { ...n, x: b.x, y: b.y } : { ...n, x: mix(a.x, b.x, e), y: mix(a.y, b.y, e) };
            }),
          }));
          if (targetView) {
            setView(t === 1 ? targetView : { x: mix(fromView.x, targetView.x, e), y: mix(fromView.y, targetView.y, e), k: mix(fromView.k, targetView.k, e) });
          }
          if (t < 1) {
            animFrame.current = requestAnimationFrame(step);
          } else {
            finished = true;
            clearTimeout(animTimer.current);
            resolve();
          }
        };
        animFrame.current = requestAnimationFrame(step);
        // Browsers pause animation frames in a background tab. This timer makes
        // sure the cards still arrive and the layout still gets saved.
        clearTimeout(animTimer.current);
        animTimer.current = setTimeout(() => step(started + duration), duration + 300);
      });

      // The view that fits the canvas once its cards are at the given positions.
      const viewFitting = (positions) => {
        const rect = viewportRef.current.getBoundingClientRect();
        const moved = doc.nodes.map((n) => ({ ...n, ...(positions.get(n.id) || {}) }));
        const movedById = new Map(moved.map((n) => [n.id, n]));
        const hidden = hiddenNodes(collapsed, treeInfo(doc.nodes).childrenOf);
        const stickyRects = doc.stickies
          .filter((st) => !(st.node_id && hidden.has(st.node_id)))
          .map((st) => ({ ...stickyPosition(st, movedById), w: STICKY_W, h: stickyHeights[st.id] || 120 }));
        const fileRects = doc.files
          .filter((f) => !(f.node_id && hidden.has(f.node_id)))
          .map((f) => ({ ...stickyPosition(f, movedById), w: FILE_W, h: stickyHeights[f.id] || FILE_H }));
        return fitView(moved.filter((n) => !hidden.has(n.id)), heights, rect.width, rect.height, [...stickyRects, ...fileRects]);
      };

      // Save a whole layout in one request. job = { kind: 'tidy' | 'undo', canvasId, positions, prev, prevView }.
      const saveLayout = async (job) => {
        setTidy({ ...job, phase: 'saving' });
        try {
          await api(`/api/canvases/${job.canvasId}/positions`, {
            method: 'PATCH',
            body: JSON.stringify({ positions: [...job.positions].map(([id, pos]) => ({ id, x: pos.x, y: pos.y })) }),
          });
          setTidy(job.kind === 'tidy' ? { ...job, phase: 'done', until: Date.now() + UNDO_MS } : { ...job, phase: 'restored' });
        } catch (err) {
          setTidy({ ...job, phase: 'failed', error: err.message });
        }
      };

      const tidyBusy = tidy.phase === 'animating' || tidy.phase === 'saving';
      const runTidy = async () => {
        if (tidyBusy || !doc.canvas || doc.nodes.length === 0) return;
        const job = {
          kind: 'tidy',
          canvasId: doc.canvas.id,
          positions: tidyLayout(doc.nodes, heights),
          prev: new Map(doc.nodes.map((n) => [n.id, { x: n.x, y: n.y }])),
          prevView: viewRef.current,
        };
        setTidy({ ...job, phase: 'animating' });
        await animateTo(job.positions, viewFitting(job.positions));
        await saveLayout(job);
      };
      // Undo: animate back to where everything was, and save that.
      const undoTidy = async () => {
        if (tidyBusy || !tidy.prev) return;
        const job = { kind: 'undo', canvasId: tidy.canvasId, positions: tidy.prev, prev: null, prevView: null };
        const backTo = tidy.prevView;
        setTidy({ ...job, phase: 'animating' });
        await animateTo(job.positions, backTo);
        await saveLayout(job);
      };
      const retryTidySave = () => saveLayout({ kind: tidy.kind, canvasId: tidy.canvasId, positions: tidy.positions, prev: tidy.prev, prevView: tidy.prevView });

      // The "Undo tidy" offer lasts 10 seconds; "Layout restored" a moment.
      useEffect(() => {
        if (tidy.phase !== 'done' && tidy.phase !== 'restored') return;
        const wait = tidy.phase === 'done' ? Math.max(0, tidy.until - Date.now()) : 2500;
        const t = setTimeout(() => setTidy({ phase: 'idle' }), wait);
        return () => clearTimeout(t);
      }, [tidy.phase, tidy.until]);

      let toast = null;
      if (tidy.phase === 'saving') {
        toast = html`<div class="toast"><${Spinner} label=${tidy.kind === 'undo' ? 'Restoring the old layout…' : 'Saving the tidy layout…'} /></div>`;
      } else if (tidy.phase === 'done') {
        toast = html`
          <div class="toast">
            <span class="msg">Layout tidied and saved.</span>
            <button onClick=${undoTidy}>Undo tidy</button>
            <${Countdown} until=${tidy.until} />
          </div>`;
      } else if (tidy.phase === 'restored') {
        toast = html`<div class="toast"><span class="msg">Old layout restored.</span></div>`;
      } else if (tidy.phase === 'failed') {
        toast = html`
          <div class="toast bad">
            <span class="msg bad" title=${tidy.error}>${tidy.kind === 'undo' ? 'Could not save the restored layout' : 'Could not save the tidy layout'}: ${tidy.error}</span>
            <button class="primary" onClick=${retryTidySave}>Retry</button>
            ${tidy.kind === 'tidy' && html`<button onClick=${undoTidy}>Undo tidy</button>`}
          </div>`;
      }

      // -- Sticky notes -------------------------------------------------------

      const updateSticky = (id, patch) => {
        setDoc((d) => ({ ...d, stickies: d.stickies.map((st) => (st.id === id ? { ...st, ...patch } : st)) }));
      };

      // Saving. One request at a time per sticky: changes made while a save is
      // running are merged and sent next, and a failed save keeps its changes
      // so Retry sends everything that is still unsaved.
      const saveQueue = useRef({});   // sticky id -> { inFlight, queued, failed }
      const savedTimers = useRef({});
      const setSaveState = (id, value) => {
        setStickySaves((m) => {
          if (value) return { ...m, [id]: value };
          const { [id]: _, ...rest } = m;
          return rest;
        });
      };
      // The same queue saves file bubbles: kind 'file' sends to the files API.
      const saveSticky = async (id, patch, kind) => {
        const q = saveQueue.current[id] || (saveQueue.current[id] = { inFlight: false, queued: null, failed: null, kind: 'sticky' });
        if (kind) q.kind = kind;
        let body = { ...(q.failed || {}), ...patch };
        q.failed = null;
        if (q.inFlight) { q.queued = { ...(q.queued || {}), ...body }; return; }
        if (Object.keys(body).length === 0) return;
        q.inFlight = true;
        clearTimeout(savedTimers.current[id]);
        setSaveState(id, { state: 'saving', error: null });
        try {
          await api((q.kind === 'file' ? '/api/files/' : '/api/stickies/') + id, { method: 'PATCH', body: JSON.stringify(body) });
          q.inFlight = false;
          if (q.queued) { const next = q.queued; q.queued = null; return saveSticky(id, next); }
          setSaveState(id, { state: 'saved', error: null });
          savedTimers.current[id] = setTimeout(() => setSaveState(id, null), 2000);
        } catch (err) {
          q.inFlight = false;
          q.failed = { ...body, ...(q.queued || {}) };
          q.queued = null;
          setSaveState(id, { state: 'failed', error: err.message });
        }
      };
      const retryStickySave = (id) => saveSticky(id, {});

      // Text: autosave shortly after typing stops, and at once when editing ends.
      const unsavedText = useRef({});
      const textTimers = useRef({});
      const flushStickyText = (id) => {
        clearTimeout(textTimers.current[id]);
        if (!(id in unsavedText.current)) return;
        const content = unsavedText.current[id];
        delete unsavedText.current[id];
        saveSticky(id, { content });
      };
      flushStickiesRef.current = () => { for (const id of Object.keys(unsavedText.current)) flushStickyText(id); };
      const onStickyInput = (id, content) => {
        updateSticky(id, { content });
        unsavedText.current[id] = content;
        clearTimeout(textTimers.current[id]);
        textTimers.current[id] = setTimeout(() => flushStickyText(id), 700);
      };
      const endStickyEdit = (id) => {
        flushStickyText(id);
        setEditingSticky((current) => (current === id ? null : current));
      };
      const onStickyColor = (id, color) => {
        updateSticky(id, { color });
        saveSticky(id, { color });
      };

      // Creating. A free sticky goes to the centre of the viewport. An attached
      // one goes beside its card: to the right, or to the left when the right
      // side is taken by another card and the left side is not.
      const addSticky = async (node) => {
        const canvasId = doc.canvas.id;
        let pos;
        if (node) {
          const count = doc.stickies.filter((st) => st.node_id === node.id).length;
          const y = 8 + count * 36;
          const right = { x: CARD_W + 24, y };
          const left = { x: -STICKY_W - 24, y };
          const blocked = (o) => doc.nodes.some((n) => n.id !== node.id && rectsOverlap(
            { x: node.x + o.x, y: node.y + o.y, w: STICKY_W, h: 130 },
            { x: n.x, y: n.y, w: CARD_W, h: heights[n.id] || 200 }));
          pos = blocked(right) && !blocked(left) ? left : right;
        } else {
          const rect = viewportRef.current.getBoundingClientRect();
          const v = viewRef.current;
          pos = {
            x: Math.round((rect.width / 2 - v.x) / v.k - STICKY_W / 2),
            y: Math.round((rect.height / 2 - v.y) / v.k - 60),
          };
          // Do not drop a new sticky exactly on top of another free one.
          while (doc.stickies.some((st) => !st.node_id && Math.abs(st.x - pos.x) < 12 && Math.abs(st.y - pos.y) < 12)) {
            pos = { x: pos.x + 24, y: pos.y + 24 };
          }
        }
        setStickyAdd({ busy: true, error: null, node });
        try {
          const sticky = await api(`/api/canvases/${canvasId}/stickies`, {
            method: 'POST',
            body: JSON.stringify({ node_id: node ? node.id : null, x: pos.x, y: pos.y }),
          });
          setDoc((d) => (d.canvas && d.canvas.id === canvasId ? { ...d, stickies: [...d.stickies, sticky] } : d));
          setEditingSticky(sticky.id); // ready to type straight away
          setStickyAdd({ busy: false, error: null, node: null });
        } catch (err) {
          setStickyAdd({ busy: false, error: err.message, node });
        }
      };

      // Deleting, with a small confirm inside the sticky.
      const askDeleteSticky = (id) => setRemovals((m) => ({ ...m, [id]: { busy: false, error: null } }));
      const cancelDeleteSticky = (id) => setRemovals((m) => { const { [id]: _, ...rest } = m; return rest; });
      const deleteSticky = async (id) => {
        setRemovals((m) => ({ ...m, [id]: { busy: true, error: null } }));
        clearTimeout(textTimers.current[id]);
        delete unsavedText.current[id];
        try {
          await api('/api/stickies/' + id, { method: 'DELETE' });
          setDoc((d) => ({ ...d, stickies: d.stickies.filter((st) => st.id !== id) }));
          cancelDeleteSticky(id);
          setSaveState(id, null);
          delete saveQueue.current[id];
        } catch (err) {
          setRemovals((m) => ({ ...m, [id]: { busy: false, error: err.message } }));
        }
      };

      // Dragging. The stored x and y are moved by the drag distance, which works
      // the same for free stickies (canvas position) and attached ones (offset).
      const stickyDrag = useRef(null);
      const onStickyDragStart = (e, sticky) => {
        if (e.button !== 0) return;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
        stickyDrag.current = {
          id: sticky.id, pointerId: e.pointerId,
          startX: e.clientX, startY: e.clientY,
          origX: sticky.x, origY: sticky.y, x: sticky.x, y: sticky.y,
          moved: false,
        };
      };
      const onStickyDragMove = (e) => {
        const d = stickyDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        const dx = e.clientX - d.startX;
        const dy = e.clientY - d.startY;
        if (!d.moved && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
        if (!d.moved) { d.moved = true; setDraggingSticky(d.id); }
        const k = viewRef.current.k;
        d.x = Math.round(d.origX + dx / k);
        d.y = Math.round(d.origY + dy / k);
        updateSticky(d.id, { x: d.x, y: d.y });
      };
      const onStickyDragEnd = (e) => {
        const d = stickyDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        stickyDrag.current = null;
        setDraggingSticky(null);
        if (d.moved) saveSticky(d.id, { x: d.x, y: d.y });
      };

      // -- File bubbles -------------------------------------------------------

      const updateFile = (id, patch) => {
        setDoc((d) => ({ ...d, files: d.files.map((f) => (f.id === id ? { ...f, ...patch } : f)) }));
      };
      // The switcher shows each canvas's stored size; keep it in step.
      const bumpStoredBytes = (canvasId, delta) => {
        setList((l) => ({ ...l, items: l.items.map((c) => (c.id === canvasId ? { ...c, file_bytes: Math.max(0, (c.file_bytes || 0) + delta) } : c)) }));
      };

      // Files are saved through the same queue as stickies.
      const saveFile = (id, patch) => saveSticky(id, patch, 'file');

      // -- Attach and scope: one context model for stickies and files -----------

      const findBubble = (kind, id) => (kind === 'file' ? doc.files : doc.stickies).find((item) => item.id === id);
      const changeBubble = (kind, id, patch) => {
        if (kind === 'file') { updateFile(id, patch); saveFile(id, patch); }
        else { updateSticky(id, patch); saveSticky(id, patch); }
      };

      // Off, This branch or Whole canvas. in_context is kept in step for stickies.
      const setContextMode = (kind, id, mode) => {
        const item = findBubble(kind, id);
        if (!item || (mode === 'branch' && !item.node_id)) return;
        if (kind === 'file') { updateFile(id, { context_mode: mode }); saveFile(id, { context_mode: mode }); }
        else { updateSticky(id, { context_mode: mode, in_context: mode === 'canvas' }); saveSticky(id, { context_mode: mode }); }
      };

      // Attaching and detaching change what x and y mean (offset from the card,
      // or canvas position), so both are converted and nothing moves on screen.
      const attachBubble = (kind, id, nodeId) => {
        const item = findBubble(kind, id);
        const node = doc.nodes.find((n) => n.id === nodeId);
        if (!item || !node || item.node_id === nodeId) return;
        const pos = stickyPosition(item, new Map(doc.nodes.map((n) => [n.id, n])));
        changeBubble(kind, id, { node_id: nodeId, x: Math.round(pos.x - node.x), y: Math.round(pos.y - node.y) });
      };
      const detachBubble = (kind, id) => {
        const item = findBubble(kind, id);
        if (!item || !item.node_id) return;
        const pos = stickyPosition(item, new Map(doc.nodes.map((n) => [n.id, n])));
        const patch = { node_id: null, x: Math.round(pos.x), y: Math.round(pos.y) };
        // Without a card there is no branch to scope to.
        if (item.context_mode === 'branch') {
          patch.context_mode = 'off';
          if (kind === 'sticky') updateSticky(id, { in_context: false });
        }
        changeBubble(kind, id, patch);
        setMenuFor(null);
      };

      // The bubble menu: one open at a time; a press anywhere else or Esc closes it.
      const toggleMenu = (id) => setMenuFor((current) => (current === id ? null : id));
      useEffect(() => {
        if (!menuFor) return undefined;
        const onDown = (e) => { if (!e.target.closest || !e.target.closest('.bubble-menu, .ctx-btn')) setMenuFor(null); };
        const onKey = (e) => { if (e.key === 'Escape' && !e.defaultPrevented) { e.preventDefault(); setMenuFor(null); } };
        window.addEventListener('pointerdown', onDown, true);
        window.addEventListener('keydown', onKey, true);
        return () => {
          window.removeEventListener('pointerdown', onDown, true);
          window.removeEventListener('keydown', onKey, true);
        };
      }, [menuFor]);

      // "Attach to…": the next click on a card attaches the bubble; a click
      // anywhere else, or Esc, cancels. Nothing under the click reacts to it.
      const startAttachPick = (kind, id) => { setMenuFor(null); setAttachPick({ kind, id }); };
      const pickHandled = useRef(false);
      const onPickDown = (e) => {
        if (!attachPick || e.target.closest('.toast')) return;
        e.stopPropagation();
        pickHandled.current = true;
        setTimeout(() => { pickHandled.current = false; }, 500);
        const card = e.target.closest('.card');
        if (card && card.dataset.id) attachBubble(attachPick.kind, attachPick.id, card.dataset.id);
        setAttachPick(null);
      };
      const onPickClick = (e) => {
        if (!pickHandled.current) return;
        pickHandled.current = false;
        e.stopPropagation();
        e.preventDefault();
      };
      useEffect(() => {
        if (!attachPick) return undefined;
        const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); setAttachPick(null); } };
        window.addEventListener('keydown', onKey, true);
        return () => window.removeEventListener('keydown', onKey, true);
      }, [attachPick]);

      // Dragging a connector from a bubble's attach handle. The card under the
      // pointer lights up; releasing on it attaches. Neither card nor bubble moves.
      const linkDrag = useRef(null);
      const cardUnder = (e) => {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const card = el && el.closest ? el.closest('.card') : null;
        return card && card.dataset.id ? card.dataset.id : null;
      };
      const canvasPoint = (e) => {
        const rect = viewportRef.current.getBoundingClientRect();
        const v = viewRef.current;
        return { x: (e.clientX - rect.left - v.x) / v.k, y: (e.clientY - rect.top - v.y) / v.k };
      };
      const onLinkStart = (e, kind, item) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        e.preventDefault();
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
        linkDrag.current = { pointerId: e.pointerId, kind, id: item.id };
        setMenuFor(null);
        setLinking({ kind, id: item.id, ...canvasPoint(e), nodeId: null });
      };
      const onLinkMove = (e) => {
        const d = linkDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        setLinking({ kind: d.kind, id: d.id, ...canvasPoint(e), nodeId: cardUnder(e) });
      };
      const onLinkEnd = (e) => {
        const d = linkDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        linkDrag.current = null;
        setLinking(null);
        const nodeId = e.type === 'pointerup' ? cardUnder(e) : null;
        if (nodeId) attachBubble(d.kind, d.id, nodeId);
      };

      // Uploading. Each file is its own request, so each has its own progress.
      const patchUpload = (key, patch) => setUploads((list) => list.map((u) => (u.key === key ? { ...u, ...patch } : u)));
      const sendUpload = (upload) => {
        const form = new FormData();
        form.append('name', upload.name);
        form.append('x', String(upload.x));
        form.append('y', String(upload.y));
        if (upload.nodeId) form.append('node_id', upload.nodeId);
        form.append('file', upload.file, upload.name);

        const request = new XMLHttpRequest();
        uploadRequests.current.set(upload.key, request);
        const mine = () => uploadRequests.current.get(upload.key) === request;
        const fail = (message, canRetry) => {
          if (!mine()) return;
          uploadRequests.current.delete(upload.key);
          patchUpload(upload.key, { state: 'failed', error: message, canRetry });
        };
        request.upload.onprogress = (e) => { if (e.lengthComputable && mine()) patchUpload(upload.key, { progress: e.loaded / e.total }); };
        request.upload.onload = () => { if (mine()) patchUpload(upload.key, { state: 'processing', progress: 1, since: Date.now() }); };
        request.onload = () => {
          let data = null;
          try { data = JSON.parse(request.responseText); } catch { /* not JSON */ }
          if (request.status >= 200 && request.status < 300 && data && data.id) {
            if (!mine()) return;
            uploadRequests.current.delete(upload.key);
            setUploads((list) => list.filter((u) => u.key !== upload.key));
            setDoc((d) => (d.canvas && d.canvas.id === upload.canvasId ? { ...d, files: [...d.files, data] } : d));
            bumpStoredBytes(upload.canvasId, data.size);
          } else {
            // A refused file (too large, wrong type) will be refused again; anything else can be retried.
            const refused = request.status === 413 || request.status === 415;
            fail((data && data.error) || (request.status === 413 ? 'File too large (max 10 MB).' : `Upload failed (${request.status}).`), !refused);
          }
        };
        request.onerror = () => fail('Network error. Check your connection and try again.', true);
        request.open('POST', `/api/canvases/${upload.canvasId}/files`);
        request.send(form);
      };
      const retryUpload = (key) => {
        const upload = uploads.find((u) => u.key === key);
        if (!upload) return;
        patchUpload(key, { state: 'uploading', progress: 0, error: null });
        sendUpload(upload);
      };
      const dismissUpload = (key) => {
        const request = uploadRequests.current.get(key);
        uploadRequests.current.delete(key);
        if (request) request.abort();
        setUploads((list) => list.filter((u) => u.key !== key));
      };

      // Add files to the canvas. place = { nodeId } attaches them to that card
      // and puts them beside it; { x, y } is a canvas point (a drop); nothing
      // means the centre of the screen (the "+ File" button).
      const addFiles = (files, place) => {
        if (!doc.canvas || files.length === 0) return;
        const canvasId = doc.canvas.id;
        const node = place && place.nodeId ? doc.nodes.find((n) => n.id === place.nodeId) : null;
        let base;
        if (node) {
          // Beside the card, past any stickies attached there, below files already attached.
          const taken = doc.files.filter((f) => f.node_id === node.id).length + uploads.filter((u) => u.nodeId === node.id).length;
          const hasStickies = doc.stickies.some((st) => st.node_id === node.id);
          const y = 8 + taken * (FILE_H + 12);
          const right = { x: CARD_W + 24 + (hasStickies ? STICKY_W + 16 : 0), y };
          const left = { x: -FILE_W - 24 - (hasStickies ? STICKY_W + 16 : 0), y };
          const blocked = (o) => doc.nodes.some((n) => n.id !== node.id && rectsOverlap(
            { x: node.x + o.x, y: node.y + o.y, w: FILE_W, h: FILE_H },
            { x: n.x, y: n.y, w: CARD_W, h: heights[n.id] || 200 }));
          base = blocked(right) && !blocked(left) ? left : right;
        } else if (place && place.x !== undefined) {
          base = { x: Math.round(place.x - FILE_W / 2), y: Math.round(place.y - 24) };
        } else {
          const rect = viewportRef.current.getBoundingClientRect();
          const v = viewRef.current;
          base = { x: Math.round((rect.width / 2 - v.x) / v.k - FILE_W / 2), y: Math.round((rect.height / 2 - v.y) / v.k - FILE_H / 2) };
          // Do not land exactly on top of a free file that is already there.
          while (doc.files.some((f) => !f.node_id && Math.abs(f.x - base.x) < 12 && Math.abs(f.y - base.y) < 12)) {
            base = { x: base.x + 24, y: base.y + 24 };
          }
        }
        const fresh = files.map((file, i) => {
          const pos = node
            ? { x: base.x, y: base.y + i * (FILE_H + 12) }
            : { x: base.x + (i % 3) * (FILE_W + 16), y: base.y + Math.floor(i / 3) * (FILE_H + 16) };
          const upload = {
            key: ++uploadSeq.current, file, name: file.name, size: file.size, canvasId,
            nodeId: node ? node.id : null, x: pos.x, y: pos.y,
            progress: 0, state: 'uploading', error: null, canRetry: true,
          };
          // Refuse at once what the server would refuse anyway.
          const ext = fileExt(file.name);
          let refusal = null;
          if (fileKind(file.name) === 'other') refusal = `This file type is not supported${ext ? ` (.${ext})` : ''}. Accepted: ${ACCEPTED_LABEL}.`;
          else if (file.size > MAX_FILE_BYTES) refusal = `File too large (max 10 MB). This one is ${formatBytes(file.size)}.`;
          else if (file.size === 0) refusal = 'The file is empty.';
          return refusal ? { ...upload, state: 'failed', error: refusal, canRetry: false } : upload;
        });
        setUploads((list) => [...list, ...fresh]);
