      }, []);

      // Pan just enough to bring a canvas rectangle on screen. The bottom of the
      // screen is treated as taken by the composer.
      const reveal = useCallback((x, y, w, hgt) => {
        const rect = viewportRef.current.getBoundingClientRect();
        const pad = 24;
        const usableBottom = Math.max(rect.height * 0.4, rect.height - 240);
        // An open reader panel covers the right side of the screen.
        const usableRight = readerOpenRef.current && rect.width >= READER_WIDE ? rect.width - READER_W : rect.width;
        setView((v) => {
          const left = v.x + x * v.k;
          const top = v.y + y * v.k;
          const right = left + w * v.k;
          const bottom = top + hgt * v.k;
          let dx = 0;
          let dy = 0;
          if (right > usableRight - pad) dx = usableRight - pad - right;
          if (left + dx < pad) dx = pad - left;
          if (bottom > usableBottom - pad) dy = usableBottom - pad - bottom;
          if (top + dy < pad) dy = pad - top;
          return dx || dy ? { ...v, x: v.x + dx, y: v.y + dy } : v;
        });
      }, []);

      // -- Wheel and trackpad: scroll pans, pinch or Ctrl/Cmd + wheel zooms ---

      useEffect(() => {
        const vp = viewportRef.current;

        // Zoom by a factor, keeping the canvas point under (px, py) fixed.
        const zoomAt = (clientX, clientY, factor) => {
          const rect = vp.getBoundingClientRect();
          const px = clientX - rect.left;
          const py = clientY - rect.top;
          setView((v) => {
            const k = clamp(v.k * factor, MIN_ZOOM, MAX_ZOOM);
            const ratio = k / v.k;
            return { x: px - (px - v.x) * ratio, y: py - (py - v.y) * ratio, k };
          });
        };

        // One scroll gesture is a burst of wheel events. Whatever the first one
        // did (pan the canvas, or scroll some content) the rest of the burst
        // keeps doing, so panning across a card with a long reply does not
        // suddenly start scrolling that reply, and the other way round.
        let gesture = { mode: null, at: 0 };
        const GESTURE_GAP_MS = 180;

        const onWheel = (e) => {
          // Trackpad pinch arrives as a wheel event with ctrlKey set; Ctrl or
          // Cmd + wheel is the same thing done by hand.
          const zoom = e.ctrlKey || e.metaKey;
          const overPanel = e.target.closest('.composer, .reader, .minimap');

          // Wheel deltas in pixels, whatever unit the device reports.
          let dx = e.deltaX;
          let dy = e.deltaY;
          if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
          else if (e.deltaMode === 2) { dx *= vp.clientWidth; dy *= vp.clientHeight; }

          if (zoom) {
            e.preventDefault(); // never let the browser zoom the whole page
            if (overPanel) return;
            // A mouse wheel moves in big notches, a pinch in small steps.
            const coarse = e.deltaMode !== 0 || Math.abs(e.deltaY) >= 50;
            zoomAt(e.clientX, e.clientY, Math.exp(-dy * (coarse ? 0.0015 : 0.01)));
            return;
          }

          const now = performance.now();
          const continuing = now - gesture.at < GESTURE_GAP_MS;
          let mode;
          if (continuing && gesture.mode) mode = gesture.mode;
          else mode = overPanel || scrollableUnder(e.target, vp) ? 'scroll' : 'pan';
          // Panels always keep their own scrolling, even mid-gesture.
          if (overPanel) mode = 'scroll';
          gesture = { mode, at: now };

          if (mode === 'scroll') return; // the content under the cursor scrolls by itself

          // Pan. Two-finger scroll gives both axes; a plain wheel gives vertical
          // only, and Shift + wheel turns that into horizontal.
          e.preventDefault();
          if (e.shiftKey && dx === 0) { dx = dy; dy = 0; }
          setView((v) => ({ ...v, x: v.x - dx, y: v.y - dy }));
        };

        // Safari reports trackpad pinch as gesture events instead.
        let lastScale = 1;
        const onGestureStart = (e) => { e.preventDefault(); lastScale = e.scale; };
        const onGestureChange = (e) => {
          e.preventDefault();
          zoomAt(e.clientX, e.clientY, e.scale / lastScale);
          lastScale = e.scale;
        };

        vp.addEventListener('wheel', onWheel, { passive: false });
        vp.addEventListener('gesturestart', onGestureStart);
        vp.addEventListener('gesturechange', onGestureChange);
        return () => {
          vp.removeEventListener('wheel', onWheel);
          vp.removeEventListener('gesturestart', onGestureStart);
          vp.removeEventListener('gesturechange', onGestureChange);
        };
      }, []);

      // -- Pan (drag empty space) --------------------------------------------

      const drag = useRef(null);
      const onPointerDown = (e) => {
        if (e.button !== 0 && e.button !== 1) return;
        if (e.target.closest('.card, .sticky, .notice, .composer, .reader, .minimap, .toast')) return;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
        drag.current = { id: e.pointerId, startX: e.clientX, startY: e.clientY, lastX: e.clientX, lastY: e.clientY, moved: false };
      };
      const onPointerMove = (e) => {
        const d = drag.current;
        if (!d || d.id !== e.pointerId) return;
        if (!d.moved) {
          // Only a press that travels counts as a pan; less than that is a click.
          if (Math.hypot(e.clientX - d.startX, e.clientY - d.startY) < DRAG_THRESHOLD) return;
          d.moved = true;
          d.lastX = e.clientX;
          d.lastY = e.clientY;
          setPanning(true);
          return;
        }
        const dx = e.clientX - d.lastX;
        const dy = e.clientY - d.lastY;
        d.lastX = e.clientX;
        d.lastY = e.clientY;
        setView((v) => ({ ...v, x: v.x + dx, y: v.y + dy }));
      };
      const onPointerUp = (e) => {
        const d = drag.current;
        if (!d || d.id !== e.pointerId) return;
        drag.current = null;
        setPanning(false);
        // A click on empty canvas clears the active path. (A cancelled press does not.)
        if (!d.moved && e.type === 'pointerup') setSelectedId(null);
      };

      // -- New canvas --------------------------------------------------------

      const createCanvas = async (title) => {
        setCreating({ busy: true, error: null, title });
        try {
          const canvas = await api('/api/canvases', { method: 'POST', body: JSON.stringify({ title }) });
          setList((l) => ({ ...l, items: [{ ...canvas, node_count: 0 }, ...l.items] }));
          setCanvasId(canvas.id);
          setCreating({ busy: false, error: null, title: null });
        } catch (err) {
          setCreating({ busy: false, error: err.message, title });
        }
      };
      const onNewCanvas = () => {
        const title = window.prompt('Name for the new canvas', 'Untitled canvas');
        if (title === null) return;
        createCanvas(title.trim() || 'Untitled canvas');
      };

      // -- Composer: Continue, Branch, New conversation ----------------------

      // Where a new root node goes: the centre of what is on screen right now.
      const rootPosition = () => {
        const rect = viewportRef.current.getBoundingClientRect();
        const v = viewRef.current;
        const x = (rect.width / 2 - v.x) / v.k - CARD_W / 2;
        const y = (rect.height / 2 - v.y) / v.k - GHOST_H;
        return avoidOverlap(Math.round(x), Math.round(y), doc.nodes, heights);
      };

      const openComposer = (mode, parent) => {
        const pos = parent ? placeChild(mode, parent, doc.nodes, heights) : rootPosition();
        setComposer((prev) => ({
          key: ++composerSeq.current,
          mode,
          parentId: parent ? parent.id : null,
          x: pos.x,
          y: pos.y,
          text: prev && !prev.busy ? prev.text : '', // keep a half-written prompt when re-targeting
          busy: false,
          error: null,
        }));
        reveal(pos.x, pos.y, CARD_W, GHOST_H);
      };
      const onContinue = (node) => openComposer('continue', node);
      const onBranch = (node) => openComposer('branch', node);
      const onNewConversation = () => openComposer('root', null);

      // -- Reader panel -------------------------------------------------------

      const onExpand = (node) => {
        setContextOpen(false);
        setReaderId((current) => (current === node.id ? null : node.id));
      };
      const toggleContext = () => {
        setReaderId(null);
        setContextOpen((open) => !open);
      };
      // Continue and Branch from the reader do exactly what the card's buttons do.
      // On a narrow window the panel would cover the composer, so it closes first.
      const fromReader = (mode) => (node) => {
        if (viewportRef.current.getBoundingClientRect().width < READER_WIDE) {
          readerOpenRef.current = false;
          setReaderId(null);
        }
        openComposer(mode, node);
      };

      // Esc closes the reader, unless something else (the composer) already used the key.
      useEffect(() => {
        if (readerId === null && !contextOpen) return;
        const onKey = (e) => {
          if (e.key === 'Escape' && !e.defaultPrevented) { setReaderId(null); setContextOpen(false); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [readerId, contextOpen]);

      // An empty canvas always shows the composer, centred.
      useEffect(() => {
        if (doc.status === 'ready' && doc.nodes.length === 0 && !composer) {
          setComposer({ key: ++composerSeq.current, mode: 'root', parentId: null, x: null, y: null, text: '', busy: false, error: null });
        }
      }, [doc.status, doc.nodes.length, composer]);

      const sendComposer = async () => {
        if (!composer || composer.busy) return;
        const prompt = composer.text.trim();
        if (!prompt) return;
        const key = composer.key;
        const targetCanvas = doc.canvas.id;
        // On an empty canvas the position is only decided now.
        const pos = composer.x === null ? rootPosition() : { x: composer.x, y: composer.y };
        setComposer((c) => (c && c.key === key ? { ...c, busy: true, error: null } : c));
        try {
          const node = await api(`/api/canvases/${targetCanvas}/nodes`, {
            method: 'POST',
            body: JSON.stringify({ parent_id: composer.parentId, prompt, x: pos.x, y: pos.y }),
          });
          pendingSince.current[node.id] = Date.now();
          // A new child under a collapsed node would be created out of sight: open the node.
          if (node.parent_id && collapsed.has(node.parent_id)) toggleCollapse(node.parent_id);
          setDoc((d) => (d.canvas && d.canvas.id === targetCanvas ? { ...d, nodes: [...d.nodes, node] } : d));
          setList((l) => ({ ...l, items: l.items.map((c) => (c.id === targetCanvas ? { ...c, node_count: c.node_count + 1 } : c)) }));
          setComposer((c) => (c && c.key === key ? null : c));
        } catch (err) {
          setComposer((c) => (c && c.key === key ? { ...c, busy: false, error: err.message } : c));
        }
      };

      const replaceNode = useCallback((fresh) => {
        setDoc((d) => (d.canvas && d.canvas.id === fresh.canvas_id
          // Keep the position shown here: the node may have been dragged since.
          ? { ...d, nodes: d.nodes.map((n) => (n.id === fresh.id ? { ...fresh, x: n.x, y: n.y } : n)) }
          : d));
      }, []);

      // -- Pending nodes: stream the reply as it is written -------------------

      const dropLive = useCallback((id) => {
        delete liveBuffer.current[id];
        setLiveText((l) => { if (!(id in l)) return l; const { [id]: _, ...rest } = l; return rest; });
      }, []);

      const openStream = useCallback((id) => {
        const es = new EventSource('/api/nodes/' + id + '/stream');
        sources.current.set(id, es);

        // Deltas arrive many times a second; update the screen at most ~12 times a second.
        const scheduleFlush = () => {
          if (flushTimer.current) return;
          flushTimer.current = setTimeout(() => {
            flushTimer.current = null;
            setLiveText((l) => ({ ...l, ...liveBuffer.current }));
          }, 80);
        };
        const close = () => {
          es.close();
          if (sources.current.get(id) === es) sources.current.delete(id);
        };
        // Anything wrong with the stream: stop using it for this node and poll instead.
        const toPolling = () => {
          close();
          noStream.current.add(id);
          setStreamTick((t) => t + 1);
        };
        const finish = (e) => {
          close();
          let node;
          try { node = JSON.parse(e.data); } catch { return toPolling(); }
          delete pendingSince.current[id];
          replaceNode(node);
          dropLive(id);
        };

        es.addEventListener('snapshot', (e) => { liveBuffer.current[id] = JSON.parse(e.data).text; scheduleFlush(); });
        es.addEventListener('delta', (e) => { liveBuffer.current[id] = (liveBuffer.current[id] || '') + JSON.parse(e.data).text; scheduleFlush(); });
        es.addEventListener('done', finish);
        es.addEventListener('failed', finish);
        es.addEventListener('gone', toPolling);
        es.onerror = toPolling; // connection failed or dropped; EventSource would retry, polling is simpler
      }, [replaceNode, dropLive]);

      // Keep exactly one stream open per pending node (unless it fell back to polling).
      const pendingIds = doc.status === 'ready'
        ? doc.nodes.filter((n) => n.status === 'pending').map((n) => n.id).join(',')
        : '';
      useEffect(() => {
        const wanted = new Set(pendingIds ? pendingIds.split(',') : []);
        for (const [id, es] of sources.current) {
          if (!wanted.has(id)) { es.close(); sources.current.delete(id); }
        }
        for (const id of wanted) {
          if (!sources.current.has(id) && !noStream.current.has(id)) openStream(id);
        }
      }, [pendingIds, streamTick, openStream]);
      useEffect(() => () => {
        for (const es of sources.current.values()) es.close();
        sources.current.clear();
        clearTimeout(flushTimer.current);
      }, []);

      // -- Fallback: poll pending nodes that have no working stream ----------

      const hasPending = doc.status === 'ready' && doc.nodes.some((n) => n.status === 'pending');
      useEffect(() => {
        if (!hasPending) return;
        const tick = () => {
          for (const n of nodesRef.current) {
            if (n.status !== 'pending' || sources.current.has(n.id) || polling.current.has(n.id)) continue;
            polling.current.add(n.id);
            api('/api/nodes/' + n.id)
              .then((fresh) => {
                setPollErrors((p) => { if (!(n.id in p)) return p; const { [n.id]: _, ...rest } = p; return rest; });
                if (fresh.status !== 'pending') {
                  delete pendingSince.current[n.id];
                  replaceNode(fresh);
                  dropLive(n.id);
                } else if (fresh.reply !== n.reply) {
                  // Still writing: show the partial reply saved so far.
                  dropLive(n.id);
                  replaceNode(fresh);
                }
              })
              .catch((err) => setPollErrors((p) => ({ ...p, [n.id]: err.message })))
              .finally(() => polling.current.delete(n.id));
          }
        };
        const t = setInterval(tick, POLL_MS);
        return () => clearInterval(t);
      }, [hasPending, replaceNode, dropLive]);

      // -- Error nodes: retry -------------------------------------------------

      const onRetry = async (node) => {
        setRetries((r) => ({ ...r, [node.id]: { busy: true, error: null } }));
        try {
          const fresh = await api(`/api/nodes/${node.id}/retry`, { method: 'POST' });
          pendingSince.current[node.id] = Date.now();
          noStream.current.delete(node.id); // give streaming another try
          dropLive(node.id);
          replaceNode(fresh);
          setRetries((r) => { const { [node.id]: _, ...rest } = r; return rest; });
        } catch (err) {
          setRetries((r) => ({ ...r, [node.id]: { busy: false, error: err.message } }));
        }
      };

      // -- Drag a node by its header; save the position on release ------------

      const nodeDrag = useRef(null);
      const moveSeq = useRef({});

      const savePosition = async (id, x, y) => {
        const seq = (moveSeq.current[id] || 0) + 1;
        moveSeq.current[id] = seq;
        setMoves((m) => ({ ...m, [id]: { busy: true, error: null, x, y } }));
        try {
          await api('/api/nodes/' + id, { method: 'PATCH', body: JSON.stringify({ x, y }) });
          if (moveSeq.current[id] !== seq) return; // moved again since
          setMoves((m) => { const { [id]: _, ...rest } = m; return rest; });
        } catch (err) {
          if (moveSeq.current[id] !== seq) return;
          setMoves((m) => ({ ...m, [id]: { busy: false, error: err.message, x, y } }));
        }
      };
      const onSaveRetry = (id) => {
        const failed = moves[id];
        if (failed) savePosition(id, failed.x, failed.y);
      };

      const onDragStart = (e, node) => {
        if (e.button !== 0) return;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
        nodeDrag.current = {
          id: node.id, pointerId: e.pointerId,
          startX: e.clientX, startY: e.clientY,
          origX: node.x, origY: node.y, x: node.x, y: node.y,
          moved: false,
        };
      };
      const onDragMove = (e) => {
        const d = nodeDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        const dx = e.clientX - d.startX;
        const dy = e.clientY - d.startY;
        // A small threshold so a plain click on the header does not count as a move.
        if (!d.moved && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
        if (!d.moved) { d.moved = true; setDraggingId(d.id); }
        const k = viewRef.current.k;
        d.x = Math.round(d.origX + dx / k);
        d.y = Math.round(d.origY + dy / k);
        setDoc((prev) => ({ ...prev, nodes: prev.nodes.map((n) => (n.id === d.id ? { ...n, x: d.x, y: d.y } : n)) }));
      };
      const onDragEnd = (e) => {
        const d = nodeDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        nodeDrag.current = null;
        setDraggingId(null);
        if (d.moved) savePosition(d.id, d.x, d.y);
        // A press on the header that did not move is a click: select the node.
        else if (e.type === 'pointerup') setSelectedId(d.id);
      };

      // -- Canvas context: instructions and pinned notes -----------------------

      // Shown at once, then saved; the panel reports saving, saved or failed.
      const saveInstructions = async (canvasId, text) => {
        setDoc((d) => (d.canvas && d.canvas.id === canvasId ? { ...d, canvas: { ...d.canvas, instructions: text } } : d));
        await api('/api/canvases/' + canvasId, { method: 'PATCH', body: JSON.stringify({ instructions: text }) });
      };

      // -- Tidy layout --------------------------------------------------------
      // A one-off action: it works out new positions, animates the cards there
      // and saves every position in one request. Positions are always stored;
      // there is no live "auto layout" mode.

      // Move cards (and optionally the view) smoothly to new positions.
      const animateTo = (targets, targetView) => new Promise((resolve) => {
        cancelAnimationFrame(animFrame.current);
        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const duration = reduced ? 0 : TIDY_MS;
        const from = new Map(nodesRef.current.map((n) => [n.id, { x: n.x, y: n.y }]));
        const fromView = viewRef.current;
        const started = performance.now();
        const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
        const mix = (a, b, e) => a + (b - a) * e;
        let finished = false;
        const step = (now) => {
          if (finished) return;
          const t = duration === 0 ? 1 : Math.min(1, (now - started) / duration);
          const e = ease(t);
          setDoc((d) => ({
            ...d,
            nodes: d.nodes.map((n) => {
              const a = from.get(n.id);
              const b = targets.get(n.id);
              if (!a || !b) return n;
              return t === 1 ? { ...n, x: b.x, y: b.y } : { ...n, x: mix(a.x, b.x, e), y: mix(a.y, b.y, e) };
            }),
          }));
          if (targetView) {
            setView(t === 1 ? targetView : { x: mix(fromView.x, targetView.x, e), y: mix(fromView.y, targetView.y, e), k: mix(fromView.k, targetView.k, e) });
          }
          if (t < 1) {
            animFrame.current = requestAnimationFrame(step);
          } else {
            finished = true;
            clearTimeout(animTimer.current);
            resolve();
          }
        };
        animFrame.current = requestAnimationFrame(step);
        // Browsers pause animation frames in a background tab. This timer makes
        // sure the cards still arrive and the layout still gets saved.
        clearTimeout(animTimer.current);
        animTimer.current = setTimeout(() => step(started + duration), duration + 300);
      });

      // The view that fits the canvas once its cards are at the given positions.
      const viewFitting = (positions) => {
        const rect = viewportRef.current.getBoundingClientRect();
        const moved = doc.nodes.map((n) => ({ ...n, ...(positions.get(n.id) || {}) }));
        const movedById = new Map(moved.map((n) => [n.id, n]));
        const hidden = hiddenNodes(collapsed, treeInfo(doc.nodes).childrenOf);
        const stickyRects = doc.stickies
          .filter((st) => !(st.node_id && hidden.has(st.node_id)))
          .map((st) => ({ ...stickyPosition(st, movedById), w: STICKY_W, h: stickyHeights[st.id] || 120 }));
        return fitView(moved.filter((n) => !hidden.has(n.id)), heights, rect.width, rect.height, stickyRects);
      };

      // Save a whole layout in one request. job = { kind: 'tidy' | 'undo', canvasId, positions, prev, prevView }.
      const saveLayout = async (job) => {
        setTidy({ ...job, phase: 'saving' });
        try {
          await api(`/api/canvases/${job.canvasId}/positions`, {
            method: 'PATCH',
            body: JSON.stringify({ positions: [...job.positions].map(([id, pos]) => ({ id, x: pos.x, y: pos.y })) }),
          });
          setTidy(job.kind === 'tidy' ? { ...job, phase: 'done', until: Date.now() + UNDO_MS } : { ...job, phase: 'restored' });
        } catch (err) {
          setTidy({ ...job, phase: 'failed', error: err.message });
        }
      };

      const tidyBusy = tidy.phase === 'animating' || tidy.phase === 'saving';
      const runTidy = async () => {
        if (tidyBusy || !doc.canvas || doc.nodes.length === 0) return;
        const job = {
          kind: 'tidy',
          canvasId: doc.canvas.id,
          positions: tidyLayout(doc.nodes, heights),
          prev: new Map(doc.nodes.map((n) => [n.id, { x: n.x, y: n.y }])),
          prevView: viewRef.current,
        };
        setTidy({ ...job, phase: 'animating' });
        await animateTo(job.positions, viewFitting(job.positions));
        await saveLayout(job);
      };
      // Undo: animate back to where everything was, and save that.
      const undoTidy = async () => {
        if (tidyBusy || !tidy.prev) return;
        const job = { kind: 'undo', canvasId: tidy.canvasId, positions: tidy.prev, prev: null, prevView: null };
        const backTo = tidy.prevView;
        setTidy({ ...job, phase: 'animating' });
        await animateTo(job.positions, backTo);
        await saveLayout(job);
      };
      const retryTidySave = () => saveLayout({ kind: tidy.kind, canvasId: tidy.canvasId, positions: tidy.positions, prev: tidy.prev, prevView: tidy.prevView });

      // The "Undo tidy" offer lasts 10 seconds; "Layout restored" a moment.
      useEffect(() => {
        if (tidy.phase !== 'done' && tidy.phase !== 'restored') return;
        const wait = tidy.phase === 'done' ? Math.max(0, tidy.until - Date.now()) : 2500;
        const t = setTimeout(() => setTidy({ phase: 'idle' }), wait);
        return () => clearTimeout(t);
      }, [tidy.phase, tidy.until]);

      let toast = null;
      if (tidy.phase === 'saving') {
        toast = html`<div class="toast"><${Spinner} label=${tidy.kind === 'undo' ? 'Restoring the old layout…' : 'Saving the tidy layout…'} /></div>`;
      } else if (tidy.phase === 'done') {
        toast = html`
          <div class="toast">
            <span class="msg">Layout tidied and saved.</span>
            <button onClick=${undoTidy}>Undo tidy</button>
            <${Countdown} until=${tidy.until} />
          </div>`;
      } else if (tidy.phase === 'restored') {
        toast = html`<div class="toast"><span class="msg">Old layout restored.</span></div>`;
      } else if (tidy.phase === 'failed') {
        toast = html`
          <div class="toast bad">
            <span class="msg bad" title=${tidy.error}>${tidy.kind === 'undo' ? 'Could not save the restored layout' : 'Could not save the tidy layout'}: ${tidy.error}</span>
            <button class="primary" onClick=${retryTidySave}>Retry</button>
            ${tidy.kind === 'tidy' && html`<button onClick=${undoTidy}>Undo tidy</button>`}
          </div>`;
      }

      // -- Sticky notes -------------------------------------------------------

      const updateSticky = (id, patch) => {
        setDoc((d) => ({ ...d, stickies: d.stickies.map((st) => (st.id === id ? { ...st, ...patch } : st)) }));
      };

      // Saving. One request at a time per sticky: changes made while a save is
      // running are merged and sent next, and a failed save keeps its changes
      // so Retry sends everything that is still unsaved.
      const saveQueue = useRef({});   // sticky id -> { inFlight, queued, failed }
      const savedTimers = useRef({});
      const setSaveState = (id, value) => {
        setStickySaves((m) => {
          if (value) return { ...m, [id]: value };
          const { [id]: _, ...rest } = m;
          return rest;
        });
      };
      const saveSticky = async (id, patch) => {
        const q = saveQueue.current[id] || (saveQueue.current[id] = { inFlight: false, queued: null, failed: null });
        let body = { ...(q.failed || {}), ...patch };
        q.failed = null;
        if (q.inFlight) { q.queued = { ...(q.queued || {}), ...body }; return; }
        if (Object.keys(body).length === 0) return;
        q.inFlight = true;
        clearTimeout(savedTimers.current[id]);
        setSaveState(id, { state: 'saving', error: null });
        try {
          await api('/api/stickies/' + id, { method: 'PATCH', body: JSON.stringify(body) });
          q.inFlight = false;
          if (q.queued) { const next = q.queued; q.queued = null; return saveSticky(id, next); }
          setSaveState(id, { state: 'saved', error: null });
          savedTimers.current[id] = setTimeout(() => setSaveState(id, null), 2000);
        } catch (err) {
          q.inFlight = false;
          q.failed = { ...body, ...(q.queued || {}) };
          q.queued = null;
          setSaveState(id, { state: 'failed', error: err.message });
        }
      };
      const retryStickySave = (id) => saveSticky(id, {});

      // Text: autosave shortly after typing stops, and at once when editing ends.
      const unsavedText = useRef({});
      const textTimers = useRef({});
      const flushStickyText = (id) => {
        clearTimeout(textTimers.current[id]);
        if (!(id in unsavedText.current)) return;
        const content = unsavedText.current[id];
        delete unsavedText.current[id];
        saveSticky(id, { content });
      };
      flushStickiesRef.current = () => { for (const id of Object.keys(unsavedText.current)) flushStickyText(id); };
      const onStickyInput = (id, content) => {
        updateSticky(id, { content });
        unsavedText.current[id] = content;
        clearTimeout(textTimers.current[id]);
        textTimers.current[id] = setTimeout(() => flushStickyText(id), 700);
      };
      const endStickyEdit = (id) => {
        flushStickyText(id);
        setEditingSticky((current) => (current === id ? null : current));
      };
      const onStickyColor = (id, color) => {
        updateSticky(id, { color });
        saveSticky(id, { color });
      };
      // Pin or unpin: a pinned sticky is sent to the AI with every prompt on this canvas.
      const onStickyPin = (id, pinned) => {
        updateSticky(id, { in_context: pinned });
        saveSticky(id, { in_context: pinned });
      };

      // Creating. A free sticky goes to the centre of the viewport. An attached
      // one goes beside its card: to the right, or to the left when the right
      // side is taken by another card and the left side is not.
      const addSticky = async (node) => {
        const canvasId = doc.canvas.id;
        let pos;
        if (node) {
          const count = doc.stickies.filter((st) => st.node_id === node.id).length;
          const y = 8 + count * 36;
          const right = { x: CARD_W + 24, y };
          const left = { x: -STICKY_W - 24, y };
          const blocked = (o) => doc.nodes.some((n) => n.id !== node.id && rectsOverlap(
            { x: node.x + o.x, y: node.y + o.y, w: STICKY_W, h: 130 },
            { x: n.x, y: n.y, w: CARD_W, h: heights[n.id] || 200 }));
          pos = blocked(right) && !blocked(left) ? left : right;
        } else {
          const rect = viewportRef.current.getBoundingClientRect();
          const v = viewRef.current;
          pos = {
            x: Math.round((rect.width / 2 - v.x) / v.k - STICKY_W / 2),
            y: Math.round((rect.height / 2 - v.y) / v.k - 60),
          };
          // Do not drop a new sticky exactly on top of another free one.
          while (doc.stickies.some((st) => !st.node_id && Math.abs(st.x - pos.x) < 12 && Math.abs(st.y - pos.y) < 12)) {
            pos = { x: pos.x + 24, y: pos.y + 24 };
          }
        }
        setStickyAdd({ busy: true, error: null, node });
        try {
          const sticky = await api(`/api/canvases/${canvasId}/stickies`, {
            method: 'POST',
            body: JSON.stringify({ node_id: node ? node.id : null, x: pos.x, y: pos.y }),
          });
          setDoc((d) => (d.canvas && d.canvas.id === canvasId ? { ...d, stickies: [...d.stickies, sticky] } : d));
          setEditingSticky(sticky.id); // ready to type straight away
          setStickyAdd({ busy: false, error: null, node: null });
        } catch (err) {
          setStickyAdd({ busy: false, error: err.message, node });
        }
      };

      // Deleting, with a small confirm inside the sticky.
      const askDeleteSticky = (id) => setRemovals((m) => ({ ...m, [id]: { busy: false, error: null } }));
      const cancelDeleteSticky = (id) => setRemovals((m) => { const { [id]: _, ...rest } = m; return rest; });
      const deleteSticky = async (id) => {
        setRemovals((m) => ({ ...m, [id]: { busy: true, error: null } }));
        clearTimeout(textTimers.current[id]);
        delete unsavedText.current[id];
        try {
          await api('/api/stickies/' + id, { method: 'DELETE' });
          setDoc((d) => ({ ...d, stickies: d.stickies.filter((st) => st.id !== id) }));
          cancelDeleteSticky(id);
          setSaveState(id, null);
          delete saveQueue.current[id];
        } catch (err) {
          setRemovals((m) => ({ ...m, [id]: { busy: false, error: err.message } }));
        }
      };

      // Dragging. The stored x and y are moved by the drag distance, which works
      // the same for free stickies (canvas position) and attached ones (offset).
      const stickyDrag = useRef(null);
      const onStickyDragStart = (e, sticky) => {
        if (e.button !== 0) return;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
        stickyDrag.current = {
          id: sticky.id, pointerId: e.pointerId,
          startX: e.clientX, startY: e.clientY,
          origX: sticky.x, origY: sticky.y, x: sticky.x, y: sticky.y,
          moved: false,
        };
      };
      const onStickyDragMove = (e) => {
        const d = stickyDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        const dx = e.clientX - d.startX;
        const dy = e.clientY - d.startY;
        if (!d.moved && Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
        if (!d.moved) { d.moved = true; setDraggingSticky(d.id); }
        const k = viewRef.current.k;
        d.x = Math.round(d.origX + dx / k);
        d.y = Math.round(d.origY + dy / k);
        updateSticky(d.id, { x: d.x, y: d.y });
      };
      const onStickyDragEnd = (e) => {
        const d = stickyDrag.current;
        if (!d || d.pointerId !== e.pointerId) return;
        stickyDrag.current = null;
        setDraggingSticky(null);
        if (d.moved) saveSticky(d.id, { x: d.x, y: d.y });
      };

      // -- Render ------------------------------------------------------------

      const byId = new Map(doc.nodes.map((n) => [n.id, n]));
      const colours = branchColours(doc.nodes);
      const tree = treeInfo(doc.nodes);
      const hidden = hiddenNodes(collapsed, tree.childrenOf);
      const visibleNodes = doc.nodes.filter((n) => !hidden.has(n.id));
      const activePath = selectedId && byId.has(selectedId) ? pathTo(selectedId, byId) : new Set();

      // An edge takes the accent colour of the card it leads into. Edges on the
      // active path are drawn last so they sit on top.
      const edges = [];
      const activeEdges = [];
      for (const child of visibleNodes) {
        const parent = child.parent_id && byId.get(child.parent_id);
        if (parent && heights[parent.id] !== undefined) {
          const active = activePath.has(child.id);
          (active ? activeEdges : edges).push(html`
            <path
              key=${child.id}
              class=${active ? 'active' : ''}
              style=${{ stroke: `var(--branch-${colours.get(child.id)})` }}
              d=${curve(parent.x + CARD_W / 2, parent.y + heights[parent.id], child.x + CARD_W / 2, child.y)}
            />`);
        }
      }
      edges.push(...activeEdges);

      // Attached stickies: a short dashed connector from the card's edge to the sticky's edge.
      // A sticky attached to a hidden node is hidden with it.
      const placedStickies = doc.stickies
        .filter((st) => !(st.node_id && hidden.has(st.node_id)))
        .map((st) => ({ st, ...stickyPosition(st, byId) }));

      // Minimap blocks: every card on show in its branch colour, plus stickies.
      const miniBlocks = [
        ...visibleNodes.map((n) => ({ key: n.id, x: n.x, y: n.y, w: CARD_W, h: heights[n.id] || 200, fill: `var(--branch-${colours.get(n.id)})`, opacity: 0.9 })),
        ...placedStickies.map(({ st, x, y }) => ({ key: st.id, x, y, w: STICKY_W, h: stickyHeights[st.id] || 120, fill: STICKY_LINE[st.color] || STICKY_LINE.yellow, opacity: 0.75 })),
      ];
      for (const { st, x, y } of placedStickies) {
        const node = st.node_id ? byId.get(st.node_id) : null;
        if (!node || heights[node.id] === undefined) continue;
        const cardRect = { x: node.x, y: node.y, w: CARD_W, h: heights[node.id] };
        const noteRect = { x, y, w: STICKY_W, h: stickyHeights[st.id] || 120 };
        if (rectsOverlap(cardRect, noteRect)) continue;
        const a = borderPoint(cardRect, noteRect.x + noteRect.w / 2, noteRect.y + noteRect.h / 2);
        const b = borderPoint(noteRect, cardRect.x + cardRect.w / 2, cardRect.y + cardRect.h / 2);
        edges.push(html`<line key=${'tether-' + st.id} class=${'tether' + (activePath.has(node.id) ? ' onpath' : '')} style=${{ stroke: STICKY_LINE[st.color] || STICKY_LINE.yellow }} x1=${a.x} y1=${a.y} x2=${b.x} y2=${b.y} />`);
      }

      // The node being written: a dashed outline where it will land, joined to its parent.
      const ready = doc.status === 'ready';
      const isEmpty = ready && doc.nodes.length === 0;
      const composerParent = composer && composer.parentId ? byId.get(composer.parentId) : null;
      const readerNode = readerId ? byId.get(readerId) : null;
      const pinnedCount = doc.stickies.filter((st) => st.in_context).length;
      const showGhost = composer && composer.x !== null && !isEmpty;
      if (showGhost && composerParent && heights[composerParent.id] !== undefined) {
        edges.push(html`<path key="draft" class="draft" d=${curve(composerParent.x + CARD_W / 2, composerParent.y + heights[composerParent.id], composer.x + CARD_W / 2, composer.y)} />`);
      }

      let composerLabel = '';
      if (composer) {
        if (isEmpty) composerLabel = 'Start a conversation';
        else if (composer.mode === 'root') composerLabel = 'New conversation';
        else if (composerParent) composerLabel = `${composer.mode === 'branch' ? 'Branch from' : 'Continue from'} “${snippet(composerParent.prompt)}”`;
      }

      // Dot grid follows pan and zoom; spacing widens when zoomed far out.
      const gridStep = GRID * view.k * (view.k < 0.4 ? 4 : 1);
      const viewportStyle = {
        backgroundSize: `${gridStep}px ${gridStep}px`,
        backgroundPosition: `${view.x}px ${view.y}px`,
      };

      let overlay = null;
      if (list.status === 'loading') {
        overlay = html`<div class="notice"><div class="row"><${Spinner} label="Loading canvases…" /></div></div>`;
      } else if (list.status === 'error') {
        overlay = html`<div class="notice bad"><strong>Could not load your canvases</strong>${list.error}<br /><button onClick=${loadList}>Retry</button></div>`;
      } else if (!canvasId) {
        overlay = html`<div class="notice"><strong>No canvases yet</strong>Create one to get started.<br /><button onClick=${onNewCanvas} disabled=${creating.busy}>New canvas</button></div>`;
      } else if (doc.status === 'loading') {
        overlay = html`<div class="notice"><div class="row"><${Spinner} label="Loading canvas…" /></div></div>`;
      } else if (doc.status === 'error') {
        overlay = html`<div class="notice bad"><strong>Could not load this canvas</strong>${doc.error}<br /><button onClick=${() => loadCanvas(canvasId)}>Retry</button></div>`;
      }

      return html`
        <div class="topbar">
          <span class="brand">canvas-chat-tree</span>
          <select
            aria-label="Switch canvas"
            value=${canvasId || ''}
            disabled=${list.status !== 'ready' || list.items.length === 0}
            onChange=${(e) => setCanvasId(e.target.value)}
          >
            ${list.items.length === 0 && html`<option value="">No canvases</option>`}
            ${list.items.map((c) => html`<option key=${c.id} value=${c.id}>${c.title}</option>`)}
          </select>
          <button onClick=${onNewCanvas} disabled=${creating.busy || list.status !== 'ready'}>New canvas</button>
          <button onClick=${onNewConversation} disabled=${!ready || isEmpty || (composer && composer.busy)}>New conversation</button>
          <button onClick=${() => addSticky(null)} disabled=${!ready || stickyAdd.busy} title="Add a free sticky note at the centre of the screen">+ Sticky</button>
          <button onClick=${runTidy} disabled=${!ready || doc.nodes.length === 0 || tidyBusy} title="Rearrange every card into a clean tree and save the positions">Tidy</button>
          <button
            class=${contextOpen ? 'on' : ''}
            onClick=${toggleContext}
            disabled=${!ready}
            title="Instructions and pinned notes the AI gets with every prompt on this canvas"
          >Context${pinnedCount > 0 ? ` · ${pinnedCount}` : ''}</button>
          ${stickyAdd.busy && html`<${Spinner} label="Adding sticky…" />`}
          ${stickyAdd.error && html`
            <span class="inline-status bad">
              <span class="clip" title=${stickyAdd.error}>Could not add the sticky: ${stickyAdd.error}</span>
              <button onClick=${() => addSticky(stickyAdd.node)}>Retry</button>
            </span>`}
          ${creating.busy && html`<${Spinner} label="Creating canvas…" />`}
          ${creating.error && html`
            <span class="inline-status bad">
              <span class="clip" title=${creating.error}>Could not create the canvas: ${creating.error}</span>
              <button onClick=${() => createCanvas(creating.title)}>Retry</button>
            </span>`}
          ${ready && html`
            <span class="title">
              ${doc.canvas.title}
              <small>${doc.nodes.length} ${doc.nodes.length === 1 ? 'node' : 'nodes'}</small>
            </span>`}
          <span class="spacer"></span>
          <button
            class="icon-only"
            onClick=${toggleTheme}
            title=${theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'}
            aria-label=${theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'}
          >
            ${theme === 'dark'
              ? html`<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                  <circle cx="8" cy="8" r="3" />
                  <path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" />
                </svg>`
              : html`<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
                  <path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z" />
                </svg>`}
          </button>
          <span class="zoom" title="Zoom level">${Math.round(view.k * 100)}%</span>
          <button onClick=${fit} disabled=${!ready || doc.nodes.length === 0}>Fit to screen</button>
        </div>

        <div
          class=${'viewport' + (panning ? ' panning' : '') + (readerNode || contextOpen ? ' reader-open' : '')}
          ref=${viewportRef}
          style=${viewportStyle}
          onPointerDown=${onPointerDown}
          onPointerMove=${onPointerMove}
          onPointerUp=${onPointerUp}
          onPointerCancel=${onPointerUp}
        >
          <div class=${'world' + (activePath.size > 0 ? ' has-path' : '')} style=${{ transform: `translate(${view.x}px, ${view.y}px) scale(${view.k})` }}>
            <svg class="edges" width="1" height="1">${edges}</svg>
            ${visibleNodes.map((n) => html`
              <${Card}
                key=${n.id}
                node=${n}
                descendants=${tree.descendants.get(n.id) || 0}
                isCollapsed=${collapsed.has(n.id)}
                onToggleCollapse=${toggleCollapse}
                colour=${colours.get(n.id)}
                isActive=${activePath.has(n.id)}
                liveText=${liveText[n.id]}
                isReading=${readerId === n.id}
                onExpand=${onExpand}
                onAddSticky=${addSticky}
                isTarget=${!!composer && composer.parentId === n.id}
                pendingSince=${n.status === 'pending' ? (pendingSince.current[n.id] || Date.parse(n.updated_at)) : null}
                pollError=${pollErrors[n.id]}
                retry=${retries[n.id]}
                move=${moves[n.id]}
                isDragging=${draggingId === n.id}
                onDragStart=${onDragStart}
                onDragMove=${onDragMove}
                onDragEnd=${onDragEnd}
                onSaveRetry=${onSaveRetry}
                onHeight=${onHeight}
                onContinue=${onContinue}
                onBranch=${onBranch}
                onRetry=${onRetry}
              />`)}
            ${placedStickies.map(({ st, x, y }) => html`
              <${Sticky}
                key=${st.id}
                sticky=${st}
                x=${x}
                y=${y}
                isEditing=${editingSticky === st.id}
                isDragging=${draggingSticky === st.id}
                onPath=${!!st.node_id && activePath.has(st.node_id)}
                save=${stickySaves[st.id]}
                removal=${removals[st.id]}
                onHeight=${onStickyHeight}
                onDragStart=${onStickyDragStart}
                onDragMove=${onStickyDragMove}
                onDragEnd=${onStickyDragEnd}
                onEdit=${setEditingSticky}
                onEndEdit=${endStickyEdit}
                onInput=${onStickyInput}
                onColor=${onStickyColor}
                onAskDelete=${askDeleteSticky}
                onCancelDelete=${cancelDeleteSticky}
                onDelete=${deleteSticky}
                onRetrySave=${retryStickySave}
                onPin=${onStickyPin}
              />`)}
            ${showGhost && html`<div class="ghost" style=${{ left: composer.x + 'px', top: composer.y + 'px' }}>New node</div>`}
          </div>
          ${overlay && html`<div class="overlay">${overlay}</div>`}
          ${ready && toast}
          ${ready && miniBlocks.length > 0 && vpSize.w > 0 && html`
            <${Minimap} blocks=${miniBlocks} view=${view} size=${vpSize} onMove=${centreOn} />`}
          ${ready && composer && html`
            <${Composer}
              composer=${composer}
              label=${composerLabel}
              centred=${isEmpty}
              canCancel=${!isEmpty}
              onChange=${(text) => setComposer((c) => (c ? { ...c, text } : c))}
              onSend=${sendComposer}
              onCancel=${() => setComposer(null)}
            />`}
          ${ready && contextOpen && html`
            <${ContextPanel}
              key=${doc.canvas.id}
              canvas=${doc.canvas}
              stickies=${doc.stickies}
              onSaveInstructions=${saveInstructions}
              onUnpin=${onStickyPin}
              onShowSticky=${(st) => {
                const pos = stickyPosition(st, byId);
                centreOn({ x: pos.x + STICKY_W / 2, y: pos.y + (stickyHeights[st.id] || 120) / 2 });
              }}
              onClose=${() => setContextOpen(false)}
            />`}
          ${ready && readerNode && html`
            <${Reader}
              node=${readerNode}
              liveText=${liveText[readerNode.id]}
              pendingSince=${readerNode.status === 'pending' ? (pendingSince.current[readerNode.id] || Date.parse(readerNode.updated_at)) : null}
              retry=${retries[readerNode.id]}
              onClose=${() => setReaderId(null)}
              onContinue=${fromReader('continue')}
              onBranch=${fromReader('branch')}
              onRetry=${onRetry}
            />`}
        </div>`;
    }

    const root = document.getElementById('app');
    root.textContent = '';
    render(html`<${App} />`, root);
  </script>
</body>
</html>
