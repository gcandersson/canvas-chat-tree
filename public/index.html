<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>canvas-chat-tree</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #e6e8ec;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { text-align: center; padding: 16px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0; color: #9aa3b2; font-size: 14px; }
    .ok { color: #6fd08c; }
    .bad { color: #f0787a; }
  </style>
</head>
<body>
  <main>
    <h1>canvas-chat-tree is running</h1>
    <p id="status">Checking health…</p>
  </main>
  <script>
    (async () => {
      const el = document.getElementById('status');
      try {
        const res = await fetch('/api/health');
        const h = await res.json();
        el.textContent = 'Database: ' + (h.db ? 'connected' : 'not connected') + ' · Model: ' + h.model;
        el.className = h.db ? 'ok' : 'bad';
      } catch (err) {
        el.textContent = 'Health check failed: ' + err.message + '. Reload to retry.';
        el.className = 'bad';
      }
    })();
  </script>
</body>
</html>
