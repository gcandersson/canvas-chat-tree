<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>canvas-chat-tree</title>
  <script>
    // Pick the theme before anything is drawn, so the page never flashes the
    // wrong one: the saved choice if there is one, otherwise the system setting.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('canvas-chat-tree:theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    /* Every colour on the page is a variable with a dark and a light value.
       Dark is the default; the light values override it when <html> has
       data-theme="light". Nothing below this block names a colour directly. */
    :root {
      color-scheme: dark;
      --card-w: 360px;

      /* Surfaces and text */
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1d212a;
      --panel-3: #232833;
      --border: #2a2f3a;
      --border-strong: #3b4252;
      --text: #e6e8ec;
      --text-soft: #d3d7de;
      --muted: #9aa3b2;
      --accent: #7aa2f7;
      --on-accent: #0f1115;
      --error: #f0787a;
      --ok: #6fd08c;
      --highlight: #6680ff; /* active path: the highlight blue, lifted a little for the dark background */
      --highlight-glow: rgba(102, 128, 255, 0.55);
      --grid: #252a35;
      --grid-image: radial-gradient(circle, var(--grid) 1px, transparent 1.2px); /* dots */
      --edge: #4a5366;

      /* Primary button */
      --primary-bg: #2b3a5c;
      --primary-border: #3d5080;
      --primary-bg-hover: #344670;
      --primary-border-hover: #4a6199;

      /* Rings and shadows */
      --error-ring: rgba(240, 120, 122, 0.35);
      --reading-ring: rgba(122, 162, 247, 0.55);
      --shadow-1: rgba(0, 0, 0, 0.35);
      --shadow-2: rgba(0, 0, 0, 0.45);
      --shadow-3: rgba(0, 0, 0, 0.55);

      /* Minimap */
      --minimap-bg: rgba(23, 26, 33, 0.94);
      --frame-fill: rgba(255, 255, 255, 0.07);
      --frame-line: #e6e8ec;

      /* Accent colours for branch families: 8 muted tones */
      --branch-0: #6d8fd1;
      --branch-1: #5fae9b;
      --branch-2: #c9a45c;
      --branch-3: #b07fc7;
      --branch-4: #7fb069;
      --branch-5: #d08a6e;
      --branch-6: #5aa9c7;
      --branch-7: #c77f9c;

      /* Sticky notes: 5 colours, each a fill and a line */
      --sticky-yellow-bg: #453f22;
      --sticky-yellow-line: #9a8840;
      --sticky-green-bg: #24402f;
      --sticky-green-line: #4f8f68;
      --sticky-blue-bg: #23364f;
      --sticky-blue-line: #5380b5;
      --sticky-pink-bg: #4a2a3c;
      --sticky-pink-line: #a8648a;
      --sticky-purple-bg: #38294f;
      --sticky-purple-line: #8263b8;
      --sticky-text: #eceef2;
      --sticky-faint: rgba(236, 238, 242, 0.5);
      --sticky-muted: rgba(236, 238, 242, 0.75);
      --sticky-well: rgba(0, 0, 0, 0.2);
      --sticky-btn: rgba(0, 0, 0, 0.28);
      --sticky-btn-hover: rgba(0, 0, 0, 0.45);
      --sticky-btn-border: rgba(255, 255, 255, 0.22);
      --sticky-btn-border-hover: rgba(255, 255, 255, 0.4);
      --sticky-dot-border: rgba(255, 255, 255, 0.25);
      --sticky-error: #ffb4b5;
    }

    /* Light theme: neutral greys and white, no warm tones. */
    :root[data-theme="light"] {
      color-scheme: light;

      --bg: #f2f2f2;          /* canvas: very light neutral grey */
      --panel: #ffffff;       /* top bar, cards, panels */
      --panel-2: #ffffff;     /* buttons */
      --panel-3: #f0f0f0;     /* button hover, inline code */
      --border: #e0e0e0;
      --border-strong: #c9c9c9;
      --text: #1a1a1a;
      --text-soft: #2b2b2b;
      --muted: #6b6b6b;
      --accent: #4262ff;      /* primary highlight: focus, selection, active path */
      --on-accent: #ffffff;
      --error: #d92d2d;
      --ok: #1f9d55;
      --highlight: #4262ff;
      --highlight-glow: rgba(66, 98, 255, 0.4);
      --grid: #e4e4e4;
      --grid-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px); /* square grid */
      --edge: #b5b5b5;

      --primary-bg: #e9edff;
      --primary-border: #b7c2ff;
      --primary-bg-hover: #d9e0ff;
      --primary-border-hover: #94a5ff;

      --error-ring: rgba(217, 45, 45, 0.22);
      --reading-ring: rgba(66, 98, 255, 0.4);
      --shadow-1: rgba(0, 0, 0, 0.08);
      --shadow-2: rgba(0, 0, 0, 0.12);
      --shadow-3: rgba(0, 0, 0, 0.18);

      --minimap-bg: rgba(255, 255, 255, 0.95);
      --frame-fill: rgba(66, 98, 255, 0.08);
      --frame-line: #4262ff;

      /* The same 8 branch families: cool, clean tones for grey and white */
      --branch-0: #5b6b8c;
      --branch-1: #12a594;
      --branch-2: #e0a100;
      --branch-3: #8e5ad6;
      --branch-4: #3fa34d;
      --branch-5: #e8743b;
      --branch-6: #1ba3c6;
      --branch-7: #d6569a;

      /* Bright pastels with dark text */
      --sticky-yellow-bg: #fff9b1;
      --sticky-yellow-line: #e3c930;
      --sticky-green-bg: #d5f692;
      --sticky-green-line: #94c93a;
      --sticky-blue-bg: #a6ccf5;
      --sticky-blue-line: #4f95e0;
      --sticky-pink-bg: #ffcee0;
      --sticky-pink-line: #ee7fae;
      --sticky-purple-bg: #dedaff;
      --sticky-purple-line: #9485ee;
      --sticky-text: #1a1a1a;
      --sticky-faint: rgba(0, 0, 0, 0.42);
      --sticky-muted: rgba(0, 0, 0, 0.62);
      --sticky-well: rgba(255, 255, 255, 0.55);
      --sticky-btn: rgba(255, 255, 255, 0.6);
      --sticky-btn-hover: rgba(255, 255, 255, 0.92);
      --sticky-btn-border: rgba(0, 0, 0, 0.18);
      --sticky-btn-border-hover: rgba(0, 0, 0, 0.35);
      --sticky-dot-border: rgba(0, 0, 0, 0.2);
      --sticky-error: #b3261e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #app { height: 100%; display: flex; flex-direction: column; }

    /* Shown before the app scripts have loaded */
    .boot { margin: auto; text-align: center; color: var(--muted); padding: 16px; }

    button, select {
      font: inherit;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      height: 32px;
    }
    button { cursor: pointer; white-space: nowrap; }
    button:hover:not(:disabled) { border-color: var(--border-strong); background: var(--panel-3); }
    button:disabled, select:disabled { opacity: 0.55; cursor: default; }
    button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button.primary { background: var(--primary-bg); border-color: var(--primary-border); }
    button.primary:hover:not(:disabled) { background: var(--primary-bg-hover); border-color: var(--primary-border-hover); }
    select { max-width: 240px; }

    /* Top bar */
    .topbar {
      flex: none;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      z-index: 2;
    }
    .brand { font-weight: 600; color: var(--muted); white-space: nowrap; }
    .title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .title small { font-weight: 400; color: var(--muted); margin-left: 6px; }
    .spacer { flex: 1; min-width: 0; }
    .zoom { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
    .inline-status { color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
    .inline-status.bad { color: var(--error); min-width: 0; }
    .clip { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .zoom, .topbar button, .topbar select { flex: none; }
    .topbar .icon-only { width: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    @media (max-width: 1280px) { .brand, .title { display: none; } }

    /* Viewport and world */
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background-color: var(--bg);
      background-image: var(--grid-image);
    }
    .viewport.panning { cursor: grabbing; user-select: none; }
    .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
    .edges path { fill: none; stroke: var(--edge); stroke-width: 2.5; stroke-linecap: round; }
    .edges path.active { stroke: var(--highlight) !important; stroke-width: 5; }
    .edges path.draft { stroke: var(--accent); stroke-dasharray: 6 6; opacity: 0.8; }

    /* Node cards */
    .card {
      position: absolute;
      width: var(--card-w);
      background: var(--panel);
      /* --node is the card's accent colour (its branch family), set per card */
      border: 2px solid var(--node, var(--border));
      border-radius: 10px;
      box-shadow: 0 4px 16px var(--shadow-1);
      cursor: default;
    }
    /* Rings are drawn with box-shadow so they never change the card's size. */
    .card.error { border-color: var(--error); box-shadow: 0 0 0 2px var(--error-ring), 0 4px 16px var(--shadow-1); }
    .card.reading { box-shadow: 0 0 0 2px var(--reading-ring), 0 4px 16px var(--shadow-1); }
    .card.active { border-color: var(--highlight); box-shadow: 0 0 0 1px var(--highlight), 0 0 20px 3px var(--highlight-glow), 0 4px 16px var(--shadow-1); }

    /* While a path is selected, everything that is not on it steps back. */
    .card, .sticky, .edges path, .edges line { transition: opacity 0.15s ease; }
    .world.has-path .card:not(.active),
    .world.has-path .sticky:not(.onpath),
    .world.has-path .edges path:not(.active):not(.draft),
    .world.has-path .edges line.tether:not(.onpath) { opacity: 0.45; }
    .card.target { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 4px 16px var(--shadow-1); }
    .card.dragging { z-index: 1; box-shadow: 0 10px 28px var(--shadow-3); }
    .card.dragging .card-head { cursor: grabbing; }
    .card-badge {
      position: absolute;
      left: 0;
      bottom: 100%;
      margin-bottom: 6px;
      max-width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      font-size: 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      white-space: nowrap;
    }
    .card-badge.bad { color: var(--error); border-color: var(--error); }
    .card-badge button { height: 22px; padding: 0 8px; font-size: 12px; }
    .card-badge .inline-status { font-size: 12px; }
    .card-head {
      padding: 10px 12px;
      font-weight: 600;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 96px;
      overflow-y: auto;
      border-bottom: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      /* a wash of the accent colour, so a branch family reads at a glance */
      background: color-mix(in srgb, var(--node, transparent) 26%, var(--panel));
      border-bottom-color: color-mix(in srgb, var(--node, var(--border)) 45%, var(--border));
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .card-body {
      padding: 10px 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 220px;
      overflow-y: auto;
      color: var(--text-soft);
    }
    .card-body.muted { color: var(--muted); }

    /* Markdown in replies */
    .md { white-space: normal; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p { margin: 0 0 8px; }
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 12px 0 6px; line-height: 1.3; color: var(--text); }
    .md h1 { font-size: 16px; }
    .md h2 { font-size: 15px; }
    .md h3, .md h4, .md h5, .md h6 { font-size: 14px; }
    .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
    .md li { margin: 2px 0; }
    .md li > p { margin: 0; }
    .md strong { color: var(--text); }
    .md a { color: var(--accent); }
    .md code {
      font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--panel-3);
      border-radius: 4px;
      padding: 1px 4px;
    }
    .md pre {
      margin: 0 0 8px;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow-x: auto;
    }
    .md pre code { background: none; padding: 0; white-space: pre; }
    .md blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--border); color: var(--muted); }
    .md hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }
    .card-body.err { color: var(--error); }
    .card-note { padding: 0 12px 10px; color: var(--error); font-size: 13px; overflow-wrap: anywhere; }
    .card-note.soft { color: var(--muted); }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
    }
    .card-actions button { height: 28px; padding: 2px 10px; font-size: 13px; }
    .card-actions .push { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
    .card-actions .icon { width: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .scroll { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

    /* Collapse toggle: a pill on the card's bottom edge, where its children hang from */
    .fold {
      position: absolute;
      left: 50%;
      bottom: -12px;
      transform: translateX(-50%);
      z-index: 1;
      height: 22px;
      padding: 0 9px;
      font-size: 11px;
      line-height: 1;
      border-radius: 11px;
      background: var(--panel-2);
      border: 1px solid var(--node, var(--border));
      color: var(--muted);
    }
    .fold:hover:not(:disabled) { color: var(--text); border-color: var(--node, var(--border-strong)); }
    .fold.closed { background: var(--node, var(--accent)); border-color: var(--node, var(--accent)); color: var(--on-accent); font-weight: 700; }
    .fold.closed:hover:not(:disabled) { background: var(--node, var(--accent)); color: var(--on-accent); filter: brightness(1.12); }

    /* Minimap */
    .minimap {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 200px;
      height: 140px;
      z-index: 1;
      overflow: hidden;
      background: var(--minimap-bg);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      box-shadow: 0 6px 18px var(--shadow-2);
      cursor: crosshair;
      touch-action: none;
    }
    .minimap svg { display: block; width: 100%; height: 100%; }
    .minimap .frame { fill: var(--frame-fill); stroke: var(--frame-line); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    @media (max-width: 700px) { .minimap { display: none; } }

    /* Sticky notes */
    .sticky {
      --s-bg: var(--sticky-yellow-bg);
      --s-line: var(--sticky-yellow-line);
      position: absolute;
      width: 200px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      color: var(--sticky-text);
      background: var(--s-bg);
      border: 1px solid var(--s-line);
      border-radius: 6px;
      box-shadow: 0 6px 18px var(--shadow-2);
      cursor: grab;
      touch-action: none;
    }
    .sticky.c-green { --s-bg: var(--sticky-green-bg); --s-line: var(--sticky-green-line); }
    .sticky.c-blue { --s-bg: var(--sticky-blue-bg); --s-line: var(--sticky-blue-line); }
    .sticky.c-pink { --s-bg: var(--sticky-pink-bg); --s-line: var(--sticky-pink-line); }
    .sticky.c-purple { --s-bg: var(--sticky-purple-bg); --s-line: var(--sticky-purple-line); }
    .sticky.dragging { cursor: grabbing; z-index: 3; box-shadow: 0 12px 28px var(--shadow-3); }
    .sticky-text {
      min-height: 72px;
      max-height: 240px;
      overflow-y: auto;
      padding: 10px 10px 6px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: none;
      -webkit-user-select: none;
    }
    .sticky-text.empty { color: var(--sticky-faint); font-style: italic; }
    textarea.sticky-text {
      display: block;
      width: 100%;
      height: 130px;
      resize: none;
      border: 0;
      outline: 0;
      border-radius: 5px 5px 0 0;
      background: var(--sticky-well);
      color: inherit;
      font-family: inherit;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }
    .sticky-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 4px 8px 6px;
      font-size: 11px;
      color: var(--sticky-muted);
      cursor: default;
    }
    .sticky-bar .dot {
      flex: none;
      width: 13px;
      height: 13px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--sticky-dot-border);
      background: var(--dot);
    }
    .sticky-bar .dot:hover:not(:disabled) { background: var(--dot); border-color: var(--sticky-text); }
    .sticky-bar .dot.on { outline: 2px solid var(--sticky-text); outline-offset: 1px; }
    .sticky-bar .mini {
      flex: none;
      height: 20px;
      padding: 0 6px;
      font-size: 11px;
      background: var(--sticky-btn);
      border-color: var(--sticky-btn-border);
    }
    .sticky-bar .mini:hover:not(:disabled) { background: var(--sticky-btn-hover); border-color: var(--sticky-btn-border-hover); }
    .sticky-bar .mini.x { width: 20px; padding: 0; }
    .sticky-bar .state { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sticky-bar .state.bad { color: var(--sticky-error); }
    .sticky-bar .inline-status { font-size: 11px; color: inherit; }
    .sticky-bar .spin { width: 10px; height: 10px; }
    .edges line.tether { stroke-width: 1.5; stroke-dasharray: 4 5; stroke-linecap: round; }

    /* Where the node being written will land */
    .ghost {
      position: absolute;
      width: var(--card-w);
      height: 120px;
      border: 2px dashed var(--accent);
      border-radius: 10px;
      opacity: 0.6;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    /* Composer */
    .composer {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(560px, calc(100% - 32px));
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      box-shadow: 0 10px 32px var(--shadow-3);
      padding: 12px;
      cursor: default;
      z-index: 2;
    }
    .composer.centred { bottom: auto; top: 50%; transform: translate(-50%, -50%); }
    .composer-label {
      color: var(--muted);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .composer.centred .composer-label { color: var(--text); font-weight: 600; font-size: 16px; }
    .composer textarea {
      display: block;
      width: 100%;
      min-height: 76px;
      max-height: 240px;
      resize: vertical;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .composer textarea:disabled { opacity: 0.6; }
    .composer-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .composer-row .hint { color: var(--muted); font-size: 12px; }
    .composer-error { color: var(--error); margin-top: 8px; overflow-wrap: anywhere; }

    /* Reader panel: one node's full prompt and reply, beside the canvas */
    .reader {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(480px, 100%);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--border-strong);
      box-shadow: -10px 0 32px var(--shadow-2);
      cursor: default;
      z-index: 3;
    }
    .reader-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .reader-bar .name { font-weight: 600; color: var(--muted); }
    .reader-bar button { height: 28px; padding: 2px 10px; font-size: 13px; flex: none; }
    .reader-bar .close { width: 28px; padding: 0; font-size: 16px; line-height: 1; }
    .reader-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 28px; }
    .reader-label {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .reader-label small { text-transform: none; letter-spacing: 0; }
    .reader-prompt {
      margin: 0 0 20px;
      padding: 10px 12px;
      font-weight: 600;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .reader-reply { font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; color: var(--text-soft); }
    .reader-reply.md h1 { font-size: 20px; }
    .reader-reply.md h2 { font-size: 17px; }
    .reader-reply.md h3, .reader-reply.md h4, .reader-reply.md h5, .reader-reply.md h6 { font-size: 15px; }
    .reader-reply.md p, .reader-reply.md ul, .reader-reply.md ol, .reader-reply.md pre, .reader-reply.md blockquote { margin-bottom: 12px; }
    .reader-reply.md code { font-size: 13.5px; }
    .reader-error { color: var(--error); white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 12px; }
    .reader-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); }
    /* With the reader open on a wide screen, the composer centres in the space that is left. */
    @media (min-width: 1000px) {
      .viewport.reader-open .composer:not(.centred) { left: calc((100% - 480px) / 2); }
    }

    /* Context panel (shares the reader panel's frame) */
    .ctx-intro { margin: 0 0 18px; color: var(--muted); }
    .ctx-instructions {
      display: block;
      width: 100%;
      min-height: 140px;
      max-height: 320px;
      resize: vertical;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .ctx-state { display: flex; align-items: center; gap: 8px; min-height: 28px; margin: 6px 0 22px; font-size: 12px; color: var(--muted); }
    .ctx-state.bad { color: var(--error); }
    .ctx-state button { height: 24px; padding: 0 8px; font-size: 12px; }
    .ctx-warning {
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--error);
      border-radius: 8px;
      color: var(--error);
      background: color-mix(in srgb, var(--error) 9%, var(--panel));
      overflow-wrap: anywhere;
    }
    .ctx-warning ul { margin: 6px 0 0; padding-left: 20px; }
    .ctx-empty { color: var(--muted); }
    .ctx-note {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .ctx-note.out { border-style: dashed; }
    .ctx-note .swatch { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--dot); }
    .ctx-note .line {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      height: auto;
      padding: 0;
      border: 0;
      background: none;
    }
    .ctx-note .line:hover:not(:disabled) { background: none; text-decoration: underline; }
    .ctx-note .tag { flex: none; font-size: 11px; color: var(--muted); white-space: nowrap; }
    .ctx-note .tag.bad { color: var(--error); }
    .ctx-note .unpin { flex: none; height: 24px; padding: 0 8px; font-size: 12px; }
    .topbar button.on { border-color: var(--accent); color: var(--accent); }

    /* Pin on stickies */
    .sticky-bar .mini.pin { width: 20px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .sticky-bar .mini.pin.on, .sticky-bar .mini.pin.on:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .pin-mark {
      position: absolute;
      top: -9px;
      right: -9px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      box-shadow: 0 2px 6px var(--shadow-2);
      pointer-events: none;
    }

    /* Toast: short messages about a whole-canvas action (Tidy and its undo) */
    .toast {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 32px);
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: 0 6px 18px var(--shadow-2);
      cursor: default;
      white-space: nowrap;
    }
    .toast.bad { border-color: var(--error); }
    .toast .msg { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .toast .msg.bad { color: var(--error); }
    .toast .count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .toast button { height: 28px; padding: 2px 10px; font-size: 13px; flex: none; }

    /* Centre overlay: loading, error and empty states */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 16px;
    }
    .notice {
      pointer-events: auto;
      cursor: default;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      text-align: center;
      max-width: 420px;
      color: var(--muted);
    }
    .notice.bad { border-color: var(--error); }
    .notice strong { display: block; color: var(--text); margin-bottom: 4px; }
    .notice .row { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .notice button { margin-top: 12px; }

    .spin {
      flex: none;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot" id="boot">Loading canvas-chat-tree…</div>
  </div>

  <script>
    // If the app scripts (loaded from esm.sh) never arrive, say so instead of
    // leaving "Loading…" on screen forever.
    setTimeout(function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.innerHTML = 'Could not load the app scripts (from esm.sh). Check your connection.<br><br>';
      var b = document.createElement('button');
      b.textContent = 'Reload';
      b.onclick = function () { location.reload(); };
      boot.appendChild(b);
    }, 10000);
  </script>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.25.4';
    import { useState, useEffect, useLayoutEffect, useRef, useCallback, useMemo } from 'https://esm.sh/preact@10.25.4/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    // micromark is safe by default: raw HTML in the text is escaped and
    // dangerous link protocols (javascript:, data:, ...) are dropped.
    import { micromark } from 'https://esm.sh/micromark@4.0.0';

    const html = htm.bind(h);

    const CARD_W = 360;
    const MIN_ZOOM = 0.1;
    const MAX_ZOOM = 2;
    const FIT_PADDING = 60;
    const GRID = 24;
    const GAP_X = 60;          // horizontal gap between sibling cards
    const GAP_Y = 80;          // vertical gap between a parent and its children
    const GHOST_H = 120;       // height of the "new node lands here" outline
    const NEW_CARD_H = 260;    // assumed height of a not-yet-created card, for overlap checks
    const POLL_MS = 1500;
    const TREE_GAP = 140;        // gap between separate trees after Tidy
    const UNMEASURED_H = 370;    // tallest a card can be; used when a card's height is not known
    const TIDY_MS = 450;         // length of the Tidy animation
    const UNDO_MS = 10000;       // how long "Undo tidy" stays available
    const READER_W = 480;      // width of the reader panel
    const READER_WIDE = 1000;  // from this window width, reader and composer fit side by side
    const STICKY_W = 200;
    const STICKY_COLORS = ['yellow', 'green', 'blue', 'pink', 'purple'];
    // Dot, connector and minimap colour for each sticky colour: the theme's line colour.
    const STICKY_LINE = Object.fromEntries(STICKY_COLORS.map((c) => [c, `var(--sticky-${c}-line)`]));
    const DRAG_THRESHOLD = 5;  // a press that moves less than this many pixels is a click, not a drag

    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const snippet = (text, max = 60) => {
      const one = text.replace(/\s+/g, ' ').trim();
      return one.length > max ? one.slice(0, max - 1) + '…' : one;
    };

    // --- Theme --------------------------------------------------------------

    const THEME_KEY = 'canvas-chat-tree:theme';
    const systemTheme = () =>
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    // The theme the user picked with the toggle, or null if they never picked one.
    function chosenTheme() {
      try {
        const theme = localStorage.getItem(THEME_KEY);
        return theme === 'light' || theme === 'dark' ? theme : null;
      } catch {
        return null;
      }
    }

    // --- Markdown -----------------------------------------------------------

    const escapeHtml = (text) => text.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // Reply text -> sanitised HTML. Images are dropped so a reply can never
    // make the page fetch something from another site.
    function renderMarkdown(text) {
      try {
        return micromark(text).replace(/<img\b[^>]*>/g, '');
      } catch {
        return `<p>${escapeHtml(text)}</p>`;
      }
    }

    // Links in replies open in a new tab instead of replacing the canvas.
    function onMarkdownClick(e) {
      const link = e.target.closest('a');
      if (!link) return;
      e.preventDefault();
      if (/^https?:/i.test(link.href)) window.open(link.href, '_blank', 'noopener,noreferrer');
    }

    // --- Network ------------------------------------------------------------

    async function api(path, options = {}) {
      let res;
      try {
        res = await fetch(path, { headers: { 'content-type': 'application/json' }, ...options });
      } catch {
        throw new Error('Network error. Check your connection and try again.');
      }
      let data = null;
      try { data = await res.json(); } catch { /* not JSON */ }
      if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status}).`);
      return data;
    }

    // --- Small pieces -------------------------------------------------------

    // Spinner with a label and seconds counting up, so nothing waits silently.
    // Counts from `since` (a timestamp in ms) when given, otherwise from when it appeared.
    function Spinner({ label, since }) {
      const [now, setNow] = useState(Date.now());
      const mounted = useRef(Date.now());
      useEffect(() => {
        const t = setInterval(() => setNow(Date.now()), 250);
        return () => clearInterval(t);
      }, []);
      const seconds = Math.max(0, Math.floor((now - (since || mounted.current)) / 1000));
      return html`<span class="inline-status"><span class="spin"></span>${label} ${seconds}s</span>`;
    }

    // Seconds left until a moment in time, counting down.
    function Countdown({ until }) {
      const [now, setNow] = useState(Date.now());
      useEffect(() => {
        const t = setInterval(() => setNow(Date.now()), 250);
        return () => clearInterval(t);
      }, []);
      return html`<span class="count">${Math.max(0, Math.ceil((until - now) / 1000))}s</span>`;
    }

    function Card({ node, colour, isActive, liveText, isTarget, isDragging, isReading, pendingSince, pollError, retry, move, onHeight, onContinue, onBranch, onRetry, onExpand, onAddSticky, descendants, isCollapsed, onToggleCollapse, onDragStart, onDragMove, onDragEnd, onSaveRetry }) {
      const ref = useRef(null);
      const bodyRef = useRef(null);
      const stickToBottom = useRef(true);

      // While the AI is writing, show the text so far: live from the stream,
      // or the partial reply saved in the database when polling instead.
      const text = node.status === 'done' ? node.reply
        : node.status === 'pending' ? (liveText || node.reply || '')
        : '';
      const replyHtml = useMemo(() => (text ? renderMarkdown(text) : ''), [text]);

      // Follow the text as it arrives, unless the reader has scrolled up.
      useLayoutEffect(() => {
        const el = bodyRef.current;
        if (el && node.status === 'pending' && stickToBottom.current) el.scrollTop = el.scrollHeight;
      }, [replyHtml, node.status]);
      const onBodyScroll = (e) => {
        const el = e.currentTarget;
        stickToBottom.current = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
      };

      // Report the card's real height so edges can start at its bottom-centre.
      useLayoutEffect(() => {
        const el = ref.current;
        const report = () => onHeight(node.id, el.offsetHeight);
        report();
        const ro = new ResizeObserver(report);
        ro.observe(el);
        return () => ro.disconnect();
      }, [node.id, onHeight]);

      let body;
      let note = null;
      let actions = null;
      const expand = html`
        <span class="push">
          <button class="icon" onClick=${() => onAddSticky(node)} title="Add a sticky note to this card" aria-label="Add a sticky note to this card">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
              <path d="M2.5 2.5h11v7l-4 4h-7z" /><path d="M13.5 9.5h-4v4" />
            </svg>
          </button>
          <button onClick=${() => onExpand(node)} title="Read the full prompt and reply in a side panel">Expand</button>
        </span>`;

      if (node.status === 'pending') {
        if (text) {
          body = html`<div class="card-body md scroll" ref=${bodyRef} onScroll=${onBodyScroll} onClick=${onMarkdownClick} dangerouslySetInnerHTML=${{ __html: replyHtml }}></div>`;
          actions = html`<div class="card-actions"><${Spinner} label="Writing…" since=${pendingSince} />${expand}</div>`;
        } else {
          body = html`<div class="card-body muted"><${Spinner} label="Thinking…" since=${pendingSince} /></div>`;
        }
        if (pollError) {
          note = html`<div class="card-note soft">Could not check for the reply (${pollError}) Trying again every few seconds.</div>`;
        }
      } else if (node.status === 'error') {
        body = html`<div class="card-body err scroll">${node.error || 'The AI call failed.'}</div>`;
        if (retry && retry.error) note = html`<div class="card-note">Retry failed: ${retry.error}</div>`;
        actions = html`
          <div class="card-actions">
            <button class="primary" disabled=${retry && retry.busy} onClick=${() => onRetry(node)}>Retry</button>
            ${retry && retry.busy && html`<${Spinner} label="Retrying…" />`}
            ${expand}
          </div>`;
      } else {
        body = html`<div class="card-body md scroll" onClick=${onMarkdownClick} dangerouslySetInnerHTML=${{ __html: replyHtml }}></div>`;
        actions = html`
          <div class="card-actions">
            <button onClick=${() => onContinue(node)} title="Add a follow-up directly below">Continue</button>
            <button onClick=${() => onBranch(node)} title="Start a second direction from this node">Branch</button>
            ${expand}
          </div>`;
      }

      return html`
        <div
          class=${'card ' + node.status + (isTarget ? ' target' : '') + (isDragging ? ' dragging' : '') + (isReading ? ' reading' : '') + (isActive ? ' active' : '')}
          ref=${ref}
          style=${{ left: node.x + 'px', top: node.y + 'px', '--node': `var(--branch-${colour})` }}
        >
          ${move && html`
            <div class=${'card-badge' + (move.error ? ' bad' : '')}>
              ${move.busy
                ? html`<${Spinner} label="Saving position…" />`
                : html`<span class="clip" title=${move.error}>Position not saved: ${move.error}</span>
                       <button onClick=${() => onSaveRetry(node.id)}>Retry</button>`}
            </div>`}
          <div
            class="card-head scroll"
            title="Click to highlight the path to this node · drag to move"
            onPointerDown=${(e) => onDragStart(e, node)}
            onPointerMove=${onDragMove}
            onPointerUp=${onDragEnd}
            onPointerCancel=${onDragEnd}
          >${node.prompt}</div>
          ${body}
          ${note}
          ${actions}
          ${descendants > 0 && html`
            <button
              class=${'fold' + (isCollapsed ? ' closed' : '')}
              onClick=${() => onToggleCollapse(node.id)}
              title=${isCollapsed
                ? `Show the ${descendants} hidden ${descendants === 1 ? 'node' : 'nodes'} below`
                : `Hide the ${descendants} ${descendants === 1 ? 'node' : 'nodes'} below`}
              aria-expanded=${!isCollapsed}
            >${isCollapsed ? '+' + descendants : '▾ ' + descendants}</button>`}
        </div>`;
    }

    // Overview of the whole canvas. Cards are blocks in their branch colours,
    // the frame is what is on screen. Click or drag to move the view there.
    function Minimap({ blocks, view, size, onMove }) {
      const ref = useRef(null);
      const frozenRef = useRef(null);
      const [frozen, setFrozen] = useState(null);

      // What is on screen, in canvas coordinates.
      const frame = { x: -view.x / view.k, y: -view.y / view.k, w: size.w / view.k, h: size.h / view.k };

      // The map always covers every block and the frame, with a little margin.
      let minX = frame.x, minY = frame.y, maxX = frame.x + frame.w, maxY = frame.y + frame.h;
      for (const b of blocks) {
        minX = Math.min(minX, b.x);
        minY = Math.min(minY, b.y);
        maxX = Math.max(maxX, b.x + b.w);
        maxY = Math.max(maxY, b.y + b.h);
      }
      const margin = Math.max(maxX - minX, maxY - minY) * 0.04;
      const live = { x: minX - margin, y: minY - margin, w: Math.max(1, maxX - minX + margin * 2), h: Math.max(1, maxY - minY + margin * 2) };
      // While dragging, the map's extent is frozen. Otherwise it would rescale
      // under the pointer as the frame moves, and the view would run away.
      const bounds = frozen || live;

      const toCanvas = (e, bb) => {
        const r = ref.current.getBoundingClientRect();
        const scale = Math.min(r.width / bb.w, r.height / bb.h);
        const offsetX = (r.width - bb.w * scale) / 2;
        const offsetY = (r.height - bb.h * scale) / 2;
        return { x: bb.x + (e.clientX - r.left - offsetX) / scale, y: bb.y + (e.clientY - r.top - offsetY) / scale };
      };
      const onDown = (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
        frozenRef.current = live;
        setFrozen(live);
        onMove(toCanvas(e, live));
      };
      const onDrag = (e) => {
        if (frozenRef.current) onMove(toCanvas(e, frozenRef.current));
      };
      const onUp = () => {
        frozenRef.current = null;
        setFrozen(null);
      };

      return html`
        <div
          class="minimap"
          ref=${ref}
          title="Click or drag to move the view"
          onPointerDown=${onDown}
          onPointerMove=${onDrag}
          onPointerUp=${onUp}
          onPointerCancel=${onUp}
        >
          <svg viewBox=${`${bounds.x} ${bounds.y} ${bounds.w} ${bounds.h}`} preserveAspectRatio="xMidYMid meet">
            ${blocks.map((b) => html`<rect key=${b.key} x=${b.x} y=${b.y} width=${b.w} height=${b.h} rx=${b.w * 0.04} fill=${b.fill} opacity=${b.opacity} />`)}
            <rect class="frame" x=${frame.x} y=${frame.y} width=${frame.w} height=${frame.h} />
          </svg>
        </div>`;
    }

    // A sticky note. Plain text only. Double-click to edit, drag to move.
    // Everything in the bottom bar is a normal button and never starts a drag.
    function Sticky({ sticky, x, y, isEditing, isDragging, onPath, save, removal, onHeight, onDragStart, onDragMove, onDragEnd, onEdit, onEndEdit, onInput, onColor, onAskDelete, onCancelDelete, onDelete, onRetrySave, onPin }) {
      const ref = useRef(null);
      const inputRef = useRef(null);

      useLayoutEffect(() => {
        const el = ref.current;
        const report = () => onHeight(sticky.id, el.offsetHeight);
        report();
        const ro = new ResizeObserver(report);
        ro.observe(el);
        return () => ro.disconnect();
      }, [sticky.id, onHeight]);

      // Entering edit mode puts the cursor at the end of the text.
      useEffect(() => {
        const el = inputRef.current;
        if (!isEditing || !el) return;
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }, [isEditing]);

      const stop = (e) => e.stopPropagation();
      const inBar = (e) => e.target.closest('.sticky-bar');

      let bar;
      if (removal) {
        bar = removal.busy
          ? html`<${Spinner} label="Deleting…" />`
          : html`
              <span class=${removal.error ? 'bad' : ''} title=${removal.error || ''}>${removal.error ? 'Could not delete.' : 'Delete this note?'}</span>
              <button class="mini" onClick=${() => onDelete(sticky.id)}>${removal.error ? 'Retry' : 'Delete'}</button>
              <button class="mini" onClick=${() => onCancelDelete(sticky.id)}>Cancel</button>`;
      } else {
        let state = null;
        if (save && save.state === 'saving') state = html`<span class="state">Saving…</span>`;
        else if (save && save.state === 'saved') state = html`<span class="state">Saved</span>`;
        else if (save && save.state === 'failed') {
          state = html`
            <span class="state bad" title=${save.error}>Not saved</span>
            <button class="mini" onClick=${() => onRetrySave(sticky.id)}>Retry</button>`;
        } else state = html`<span class="state"></span>`;
        const failed = save && save.state === 'failed';
        bar = html`
          ${!failed && STICKY_COLORS.map((c) => html`
            <button
              key=${c}
              class=${'dot' + (sticky.color === c ? ' on' : '')}
              style=${{ '--dot': STICKY_LINE[c] }}
              title=${c[0].toUpperCase() + c.slice(1)}
              aria-label=${'Colour: ' + c}
              onClick=${() => onColor(sticky.id, c)}
            ></button>`)}
          ${state}
          <button
            class=${'mini pin' + (sticky.in_context ? ' on' : '')}
            title=${sticky.in_context ? 'Used as AI context on this canvas. Click to stop.' : 'Use as AI context'}
            aria-label="Use as AI context"
            aria-pressed=${!!sticky.in_context}
            onClick=${() => onPin(sticky.id, !sticky.in_context)}
          ><${PinIcon} filled=${!!sticky.in_context} /></button>
          <button class="mini x" title="Delete this note" aria-label="Delete this note" onClick=${() => onAskDelete(sticky.id)}>×</button>`;
      }

      return html`
        <div
          class=${'sticky c-' + sticky.color + (isDragging ? ' dragging' : '') + (onPath ? ' onpath' : '')}
          ref=${ref}
          style=${{ left: x + 'px', top: y + 'px' }}
          onPointerDown=${(e) => { if (!isEditing && !inBar(e)) onDragStart(e, sticky); }}
          onPointerMove=${onDragMove}
          onPointerUp=${onDragEnd}
          onPointerCancel=${onDragEnd}
          onDblClick=${(e) => { if (!inBar(e)) onEdit(sticky.id); }}
        >
          ${sticky.in_context && html`<span class="pin-mark" title="Pinned: sent to the AI as context on this canvas"><${PinIcon} filled=${true} /></span>`}
          ${isEditing
            ? html`<textarea
                ref=${inputRef}
                class="sticky-text scroll"
                placeholder="Write a note…"
                value=${sticky.content}
                onInput=${(e) => onInput(sticky.id, e.target.value)}
                onBlur=${() => onEndEdit(sticky.id)}
                onKeyDown=${(e) => { if (e.key === 'Escape') { e.preventDefault(); e.currentTarget.blur(); } }}
                onPointerDown=${stop}
              ></textarea>`
            : html`<div class=${'sticky-text scroll' + (sticky.content ? '' : ' empty')} title="Double-click to edit · drag to move">${sticky.content || 'Double-click to write'}</div>`}
          <div class="sticky-bar" onPointerDown=${stop}>${bar}</div>
        </div>`;
    }

    // Copy text to the clipboard; falls back to the old selection trick where
    // the Clipboard API is not available.
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch { /* try the fallback */ }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (!ok) throw new Error('The browser blocked copying.');
    }

    function Reader({ node, liveText, pendingSince, retry, onClose, onContinue, onBranch, onRetry }) {
      const [copy, setCopy] = useState({ state: 'idle', error: null }); // idle | busy | done | failed
      const copyTimer = useRef(null);
      useEffect(() => () => clearTimeout(copyTimer.current), []);
      // A different node in the panel starts with a fresh Copy button.
      useEffect(() => { clearTimeout(copyTimer.current); setCopy({ state: 'idle', error: null }); }, [node.id]);

      const text = node.status === 'done' ? node.reply
        : node.status === 'pending' ? (liveText || node.reply || '')
        : '';
      const replyHtml = useMemo(() => (text ? renderMarkdown(text) : ''), [text]);

      const onCopy = async () => {
        clearTimeout(copyTimer.current);
        setCopy({ state: 'busy', error: null });
        try {
          await copyText(node.reply);
          setCopy({ state: 'done', error: null });
          copyTimer.current = setTimeout(() => setCopy({ state: 'idle', error: null }), 2000);
        } catch (err) {
          setCopy({ state: 'failed', error: err.message });
        }
      };
      const copyLabel = copy.state === 'busy' ? 'Copying…' : copy.state === 'done' ? 'Copied' : copy.state === 'failed' ? 'Copy failed · Retry' : 'Copy';

      const done = node.status === 'done';
      let reply;
      if (node.status === 'error') {
        reply = html`
          <div class="reader-error">${node.error || 'The AI call failed.'}</div>
          ${retry && retry.error && html`<div class="reader-error">Retry failed: ${retry.error}</div>`}
          <div class="reader-foot">
            <button class="primary" disabled=${retry && retry.busy} onClick=${() => onRetry(node)}>Retry</button>
            ${retry && retry.busy && html`<${Spinner} label="Retrying…" />`}
          </div>`;
      } else if (!text) {
        reply = html`<div class="reader-foot"><${Spinner} label="Thinking…" since=${pendingSince} /></div>`;
      } else {
        reply = html`
          <div class="reader-reply md" onClick=${onMarkdownClick} dangerouslySetInnerHTML=${{ __html: replyHtml }}></div>
          ${!done && html`<div class="reader-foot"><${Spinner} label="Writing…" since=${pendingSince} /></div>`}`;
      }

      return html`
        <aside class="reader" aria-label="Reader panel">
          <div class="reader-bar">
            <span class="name">Reader</span>
            <span class="spacer"></span>
            <button disabled=${!done || copy.state === 'busy'} onClick=${onCopy} title=${copy.error || 'Copy the reply as Markdown'}>${copyLabel}</button>
            <button disabled=${!done} onClick=${() => onContinue(node)} title="Add a follow-up directly below">Continue</button>
            <button disabled=${!done} onClick=${() => onBranch(node)} title="Start a second direction from this node">Branch</button>
            <button class="close" onClick=${onClose} aria-label="Close reader" title="Close (Esc)">×</button>
          </div>
          <div class="reader-scroll scroll">
            <div class="reader-label">Prompt</div>
            <div class="reader-prompt">${node.prompt}</div>
            <div class="reader-label">Reply ${node.model && html`<small>${node.model}</small>`}</div>
            ${reply}
          </div>
        </aside>`;
    }

    // Side panel: what the AI gets with every prompt on this canvas.
    // Mounted once per canvas (it is keyed by canvas id).
    function ContextPanel({ canvas, stickies, onSaveInstructions, onUnpin, onShowSticky, onClose }) {
      const [draft, setDraft] = useState(canvas.instructions || '');
      const [save, setSave] = useState({ state: 'idle', error: null }); // idle | saving | saved | failed
      const draftRef = useRef(draft);
      const dirty = useRef(false);
      const timer = useRef(null);
      const seq = useRef(0);

      const saveNow = async () => {
        clearTimeout(timer.current);
        if (!dirty.current) return;
        dirty.current = false;
        const mine = ++seq.current;
        setSave({ state: 'saving', error: null });
        try {
          await onSaveInstructions(canvas.id, draftRef.current);
          if (mine === seq.current) setSave({ state: 'saved', error: null });
        } catch (err) {
          dirty.current = true; // so Retry (or the next edit) sends it again
          if (mine === seq.current) setSave({ state: 'failed', error: err.message });
        }
      };
      const onInput = (e) => {
        draftRef.current = e.target.value;
        setDraft(e.target.value);
        dirty.current = true;
        clearTimeout(timer.current);
        timer.current = setTimeout(saveNow, 800);
      };
      // Closing the panel or switching canvas with unsaved text still saves it.
      useEffect(() => () => {
        clearTimeout(timer.current);
        if (dirty.current) onSaveInstructions(canvas.id, draftRef.current).catch(() => {});
      }, []);

      const { pinned, included, leftOut, used } = selectPinnedNotes(stickies);

      let state;
      if (save.state === 'saving') state = html`<div class="ctx-state"><${Spinner} label="Saving…" /></div>`;
      else if (save.state === 'saved') state = html`<div class="ctx-state">Saved</div>`;
      else if (save.state === 'failed') {
        state = html`<div class="ctx-state bad"><span class="clip" title=${save.error}>Not saved: ${save.error}</span><button onClick=${saveNow}>Retry</button></div>`;
      } else state = html`<div class="ctx-state">Saved automatically as you type.</div>`;

      return html`
        <aside class="reader context" aria-label="Context panel">
          <div class="reader-bar">
            <span class="name">Context</span>
            <span class="spacer"></span>
            <button class="close" onClick=${onClose} aria-label="Close context panel" title="Close (Esc)">×</button>
          </div>
          <div class="reader-scroll scroll">
            <p class="ctx-intro">The AI gets this with every prompt on this canvas, before the path to the node. Other canvases are not affected.</p>

            <div class="reader-label">Instructions</div>
            <textarea
              class="ctx-instructions scroll"
              placeholder="For example: Always answer in exactly three bullet points."
              value=${draft}
              onInput=${onInput}
              onBlur=${saveNow}
            ></textarea>
            ${state}

            <div class="reader-label">
              Pinned notes
              <small>${pinned.length === 0 ? 'none' : `${pinned.length} · ${used.toLocaleString('en-GB')} of ${PINNED_NOTES_CAP.toLocaleString('en-GB')} characters`}</small>
            </div>
            ${leftOut.length > 0 && html`
              <div class="ctx-warning" role="alert">
                Pinned notes are limited to ${PINNED_NOTES_CAP.toLocaleString('en-GB')} characters in total. Newest notes go first, and
                ${leftOut.length === 1 ? ' this note does not fit, so it is not sent to the AI:' : ' these notes do not fit, so they are not sent to the AI:'}
                <ul>${leftOut.map((st) => html`<li key=${st.id}>${firstLine(st.content)}</li>`)}</ul>
              </div>`}
            ${pinned.length === 0 && html`
              <div class="ctx-empty">No pinned notes. Click the pin on a sticky to send it to the AI with every prompt on this canvas.</div>`}
            ${pinned.map((st) => {
              const empty = !(st.content || '').trim();
              const out = !empty && !included.has(st.id);
              return html`
                <div key=${st.id} class=${'ctx-note' + (out || empty ? ' out' : '')}>
                  <span class="swatch" style=${{ '--dot': STICKY_LINE[st.color] || STICKY_LINE.yellow }}></span>
                  <button class="line" onClick=${() => onShowSticky(st)} title="Show this sticky on the canvas">${empty ? '(empty note)' : firstLine(st.content)}</button>
                  ${empty && html`<span class="tag">empty, not sent</span>`}
                  ${out && html`<span class="tag bad">left out</span>`}
                  <button class="unpin" onClick=${() => onUnpin(st.id, false)}>Unpin</button>
                </div>`;
            })}
          </div>
        </aside>`;
    }

    function Composer({ composer, label, centred, canCancel, onChange, onSend, onCancel }) {
      const inputRef = useRef(null);

      // Focus the box whenever the composer opens or is pointed at another node.
      useEffect(() => {
        if (inputRef.current) inputRef.current.focus();
      }, [composer.key]);

      const onKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          onSend();
        } else if (e.key === 'Escape' && canCancel && !composer.busy) {
          e.preventDefault();
          onCancel();
        }
      };

      const empty = !composer.text.trim();
      return html`
        <div class=${'composer' + (centred ? ' centred' : '')}>
          <div class="composer-label" title=${label}>${label}</div>
          <textarea
            ref=${inputRef}
            class="scroll"
            placeholder="Write a prompt…"
            value=${composer.text}
            disabled=${composer.busy}
            onInput=${(e) => onChange(e.target.value)}
            onKeyDown=${onKeyDown}
          ></textarea>
          ${composer.error && html`<div class="composer-error">Could not send: ${composer.error}</div>`}
          <div class="composer-row">
            <button class="primary" disabled=${composer.busy || empty} onClick=${onSend}>
              ${composer.error ? 'Retry' : 'Send'}
            </button>
            ${canCancel && html`<button disabled=${composer.busy} onClick=${onCancel}>Cancel</button>`}
            ${composer.busy
              ? html`<${Spinner} label="Sending…" />`
              : html`<span class="hint">Enter to send · Shift+Enter for a new line${canCancel ? ' · Esc to cancel' : ''}</span>`}
          </div>
        </div>`;
    }

    // --- Branch colours -----------------------------------------------------

    const PALETTE_SIZE = 8;

    // Accent colour (palette index) for every node. Pure render logic; nothing is stored.
    // Going through the nodes in creation order: a root starts a new colour, the
    // first child of a node inherits its parent's colour, and every later child
    // (a branch) takes the next palette colour, skipping its parent's and its
    // siblings' colours where it can.
    function branchColours(nodes) {
      const sorted = [...nodes].sort((a, b) =>
        a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : a.id < b.id ? -1 : 1);
      const colour = new Map();   // node id -> palette index
      const taken = new Map();    // parent id -> colours its children already use
      let next = 0;
      for (const n of sorted) {
        if (!n.parent_id || !colour.has(n.parent_id)) {
          colour.set(n.id, next++ % PALETTE_SIZE);
          continue;
        }
        const parentColour = colour.get(n.parent_id);
        const siblings = taken.get(n.parent_id) || new Set();
        let c = parentColour;
        if (siblings.size > 0) {
          for (let tries = 0; tries < PALETTE_SIZE; tries++) {
            c = next++ % PALETTE_SIZE;
            if (c !== parentColour && !siblings.has(c)) break;
          }
        }
        siblings.add(c);
        taken.set(n.parent_id, siblings);
        colour.set(n.id, c);
      }
      return colour;
    }

    // --- Canvas context -----------------------------------------------------

    const PINNED_NOTES_CAP = 8000; // total characters of pinned-note text sent to the AI

    // Which pinned notes the AI gets. Same rule as selectPinnedNotes in
    // server.js: newest first; a note is included while it still fits in the
    // cap, otherwise it is left out; empty notes are skipped.
    function selectPinnedNotes(stickies) {
      const pinned = stickies
        .filter((st) => st.in_context)
        .sort((a, b) => (a.created_at > b.created_at ? -1 : a.created_at < b.created_at ? 1 : a.id > b.id ? -1 : 1));
      const included = new Set();
      const leftOut = [];
      let used = 0;
      for (const st of pinned) {
        const text = (st.content || '').trim();
        if (!text) continue;
        if (used + text.length <= PINNED_NOTES_CAP) {
          used += text.length;
          included.add(st.id);
        } else {
          leftOut.push(st);
        }
      }
      return { pinned, included, leftOut, used };
    }

    const firstLine = (text) => {
      const line = (text || '').trim().split('\n')[0];
      return line.length > 70 ? line.slice(0, 69) + '…' : line;
    };

    const PinIcon = ({ filled }) => html`
      <svg viewBox="0 0 16 16" width="12" height="12" fill=${filled ? 'currentColor' : 'none'} stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M9.6 1.8l4.6 4.6-1.9.5-2.4 2.4.2 2.9-1.1 1.1-2.9-2.9-3.6 3.6 M6.1 10.4 3.2 7.5l1.1-1.1 2.9.2 2.4-2.4z" />
      </svg>`;

    // --- Collapse -----------------------------------------------------------

    // For every node: its children and how many descendants it has in total.
    function treeInfo(nodes) {
      const childrenOf = new Map();
      for (const n of nodes) {
        if (!n.parent_id) continue;
        if (!childrenOf.has(n.parent_id)) childrenOf.set(n.parent_id, []);
        childrenOf.get(n.parent_id).push(n.id);
      }
      const descendants = new Map();
      const count = (id) => {
        if (descendants.has(id)) return descendants.get(id);
        descendants.set(id, 0); // guards against a cycle in bad data
        let total = 0;
        for (const child of childrenOf.get(id) || []) total += 1 + count(child);
        descendants.set(id, total);
        return total;
      };
      for (const n of nodes) count(n.id);
      return { childrenOf, descendants };
    }

    // Collapsing a node hides its descendants only: never the node itself,
    // its siblings, its ancestors or its parent's other children.
    function hiddenNodes(collapsed, childrenOf) {
      const hidden = new Set();
      for (const id of collapsed) {
        const stack = [...(childrenOf.get(id) || [])];
        while (stack.length) {
          const next = stack.pop();
          if (hidden.has(next)) continue;
          hidden.add(next);
          stack.push(...(childrenOf.get(next) || []));
        }
      }
      return hidden;
    }

    // Collapse state lives in this browser only, one entry per canvas.
    const collapseKey = (canvasId) => 'canvas-chat-tree:collapsed:' + canvasId;
    function loadCollapsed(canvasId) {
      try {
        const ids = JSON.parse(localStorage.getItem(collapseKey(canvasId)) || '[]');
        return new Set(Array.isArray(ids) ? ids : []);
      } catch {
        return new Set();
      }
    }
    function saveCollapsed(canvasId, collapsed) {
      try {
        if (collapsed.size === 0) localStorage.removeItem(collapseKey(canvasId));
        else localStorage.setItem(collapseKey(canvasId), JSON.stringify([...collapsed]));
      } catch { /* storage unavailable: collapse still works until reload */ }
    }

    // The active path: a node plus all its ancestors back to the root.
    function pathTo(id, byId) {
      const path = new Set();
      for (let n = byId.get(id); n && !path.has(n.id); n = n.parent_id ? byId.get(n.parent_id) : null) path.add(n.id);
      return path;
    }

    // --- Geometry -----------------------------------------------------------

    // Smooth curve from (x1, y1) at a parent's bottom-centre to (x2, y2) at a child's top-centre.
    function curve(x1, y1, x2, y2) {
      const bend = Math.max(40, Math.abs(y2 - y1) / 2);
      return `M ${x1} ${y1} C ${x1} ${y1 + bend}, ${x2} ${y2 - bend}, ${x2} ${y2}`;
    }

    // The point where the line from a rectangle's centre towards (tx, ty) crosses its border.
    function borderPoint(r, tx, ty) {
      const cx = r.x + r.w / 2;
      const cy = r.y + r.h / 2;
      const dx = tx - cx;
      const dy = ty - cy;
      if (dx === 0 && dy === 0) return { x: cx, y: cy };
      const scale = Math.min(dx === 0 ? Infinity : r.w / 2 / Math.abs(dx), dy === 0 ? Infinity : r.h / 2 / Math.abs(dy));
      return { x: cx + dx * scale, y: cy + dy * scale };
    }
    const rectsOverlap = (a, b, gap = 0) =>
      a.x < b.x + b.w + gap && a.x + a.w + gap > b.x && a.y < b.y + b.h + gap && a.y + a.h + gap > b.y;

    // Where a sticky is drawn. An attached sticky stores its offset from its card.
    function stickyPosition(sticky, byId) {
      const node = sticky.node_id ? byId.get(sticky.node_id) : null;
      return node ? { x: node.x + sticky.x, y: node.y + sticky.y } : { x: sticky.x, y: sticky.y };
    }

    function fitView(nodes, heights, width, height, extraRects = []) {
      if (nodes.length === 0 && extraRects.length === 0) return { x: width / 2, y: height / 2, k: 1 };
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const n of nodes) {
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + CARD_W);
        maxY = Math.max(maxY, n.y + (heights[n.id] || 200));
      }
      for (const r of extraRects) {
        minX = Math.min(minX, r.x);
        minY = Math.min(minY, r.y);
        maxX = Math.max(maxX, r.x + r.w);
        maxY = Math.max(maxY, r.y + r.h);
      }
      const boxW = maxX - minX;
      const boxH = maxY - minY;
      const availW = Math.max(50, width - FIT_PADDING * 2);
      const availH = Math.max(50, height - FIT_PADDING * 2);
      // Never zoom in past 100% just to fill the screen.
      const k = clamp(Math.min(availW / boxW, availH / boxH), MIN_ZOOM, 1);
      return {
        x: (width - boxW * k) / 2 - minX * k,
        y: (height - boxH * k) / 2 - minY * k,
        k,
      };
    }

    // Slide a new card to the right until it no longer overlaps an existing card.
    function avoidOverlap(x, y, nodes, heights) {
      const margin = 20;
      const overlaps = (cx) => nodes.some((n) => {
        const nh = heights[n.id] || 200;
        return cx < n.x + CARD_W + margin && cx + CARD_W + margin > n.x &&
               y < n.y + nh + margin && y + NEW_CARD_H + margin > n.y;
      });
      let cx = x;
      for (let i = 0; i < 100 && overlaps(cx); i++) cx += CARD_W + GAP_X;
      return { x: cx, y };
    }

    // Continue: directly below the parent. If the parent already has children,
    // the slot below is taken, so the new child goes beside them instead.
    // Branch: to the right of the existing children, so branches fan out side by side.
    function placeChild(mode, parent, nodes, heights) {
      const children = nodes.filter((n) => n.parent_id === parent.id);
      const belowY = parent.y + (heights[parent.id] || 200) + GAP_Y;
      if (children.length === 0) {
        const x = mode === 'branch' ? parent.x + CARD_W + GAP_X : parent.x;
        return avoidOverlap(x, belowY, nodes, heights);
      }
      const rightmost = children.reduce((a, b) => (b.x > a.x ? b : a));
      return avoidOverlap(rightmost.x + CARD_W + GAP_X, rightmost.y, nodes, heights);
    }

    // Tidy layout: a clean top-down tree for every root, trees side by side.
    // Returns Map(node id -> { x, y }). It only computes; the caller animates
    // and saves. Children keep their creation order, left to right. Each
    // subtree gets a column as wide as its children need, the parent is centred
    // over it, and each depth is one row, as tall as its tallest card.
    function tidyLayout(nodes, heights) {
      const sorted = [...nodes].sort((a, b) =>
        a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : a.id < b.id ? -1 : 1);
      const ids = new Set(sorted.map((n) => n.id));
      const childrenOf = new Map();
      const roots = [];
      for (const n of sorted) {
        if (n.parent_id && ids.has(n.parent_id)) {
          if (!childrenOf.has(n.parent_id)) childrenOf.set(n.parent_id, []);
          childrenOf.get(n.parent_id).push(n.id);
        } else {
          roots.push(n.id);
        }
      }
      const kids = (id) => childrenOf.get(id) || [];
      const heightOf = (id) => heights[id] || UNMEASURED_H;

      // Width of each subtree.
      const widthOf = new Map();
      const measure = (id) => {
        let total = 0;
        kids(id).forEach((child, i) => { total += measure(child) + (i ? GAP_X : 0); });
        const width = Math.max(CARD_W, total);
        widthOf.set(id, width);
        return width;
      };

      // The layout starts at the top-left corner of where the cards are now,
      // so the canvas does not jump somewhere else.
      const originX = Math.min(...sorted.map((n) => n.x));
      const originY = Math.min(...sorted.map((n) => n.y));

      const result = new Map();
      let treeLeft = originX;
      for (const root of roots) {
        measure(root);
        const placed = []; // { id, x, depth }
        const place = (id, left, depth) => {
          const width = widthOf.get(id);
          placed.push({ id, x: left + (width - CARD_W) / 2, depth });
          const children = kids(id);
          const childrenWidth = children.reduce((sum, c, i) => sum + widthOf.get(c) + (i ? GAP_X : 0), 0);
          let childLeft = left + (width - childrenWidth) / 2;
          for (const child of children) {
            place(child, childLeft, depth + 1);
            childLeft += widthOf.get(child) + GAP_X;
          }
        };
        place(root, treeLeft, 0);

        const rowHeight = [];
        for (const item of placed) rowHeight[item.depth] = Math.max(rowHeight[item.depth] || 0, heightOf(item.id));
        const rowTop = [originY];
        for (let d = 1; d < rowHeight.length; d++) rowTop[d] = rowTop[d - 1] + rowHeight[d - 1] + GAP_Y;
        for (const item of placed) result.set(item.id, { x: Math.round(item.x), y: Math.round(rowTop[item.depth]) });

        treeLeft += widthOf.get(root) + TREE_GAP;
      }
      return result;
    }

    // A wheel over a card section that really has overflow scrolls that section
    // instead of panning the canvas.
    function scrollableUnder(target, stopAt) {
      for (let el = target; el && el !== stopAt; el = el.parentElement) {
        if (el.classList && el.classList.contains('scroll') && el.scrollHeight > el.clientHeight + 1) return el;
      }
      return null;
    }

    // --- App ----------------------------------------------------------------

    function App() {
      const [list, setList] = useState({ status: 'loading', items: [], error: null });
      const [canvasId, setCanvasId] = useState(() => location.hash.slice(1) || null);
      const [doc, setDoc] = useState({ status: 'idle', canvas: null, nodes: [], stickies: [], error: null });
      const [view, setView] = useState({ x: 0, y: 0, k: 1 });
      const [heights, setHeights] = useState({});
      const [creating, setCreating] = useState({ busy: false, error: null, title: null });
      const [panning, setPanning] = useState(false);
      // composer: null, or { key, mode: 'continue'|'branch'|'root', parentId, x, y, text, busy, error }
      const [composer, setComposer] = useState(null);
      const [retries, setRetries] = useState({});       // node id -> { busy, error }
      const [pollErrors, setPollErrors] = useState({}); // node id -> message
      const [moves, setMoves] = useState({});           // node id -> { busy, error, x, y } while a position is being saved
      const [draggingId, setDraggingId] = useState(null);
      const [liveText, setLiveText] = useState({});     // node id -> reply text received over the stream so far
      const [readerId, setReaderId] = useState(null);   // node shown in the reader panel
      const [contextOpen, setContextOpen] = useState(false); // the Context panel (shares the reader's place)
      const [selectedId, setSelectedId] = useState(null); // node whose path to the root is highlighted
      const [theme, setTheme] = useState(() => chosenTheme() || systemTheme());
      // Tidy layout: phase is idle | animating | saving | done | restored | failed.
      const [tidy, setTidy] = useState({ phase: 'idle' });
      const [collapsed, setCollapsed] = useState(() => new Set()); // node ids whose descendants are hidden
      const [vpSize, setVpSize] = useState({ w: 0, h: 0 });        // viewport size, for the minimap
      const [stickyHeights, setStickyHeights] = useState({});
      const [editingSticky, setEditingSticky] = useState(null);   // sticky id being edited
      const [draggingSticky, setDraggingSticky] = useState(null);
      const [stickySaves, setStickySaves] = useState({});         // sticky id -> { state: saving|saved|failed, error }
      const [removals, setRemovals] = useState({});               // sticky id -> { busy, error } while its delete confirm is open
      const [stickyAdd, setStickyAdd] = useState({ busy: false, error: null, node: null });
      const [streamTick, setStreamTick] = useState(0);  // bumped when a node drops from streaming to polling

      const viewportRef = useRef(null);
      const loadSeq = useRef(0);
      const fitWhenMeasured = useRef(false);
      const composerSeq = useRef(0);
      const pendingSince = useRef({}); // node id -> ms timestamp the wait started, as seen by this browser
      const polling = useRef(new Set());
      const sources = useRef(new Map());   // node id -> open EventSource
      const noStream = useRef(new Set());  // node ids whose stream failed; these are polled instead
      const liveBuffer = useRef({});       // node id -> text, flushed to state a few times a second
      const flushTimer = useRef(null);
      const viewRef = useRef(view);
      viewRef.current = view;
      const flushStickiesRef = useRef(null);
      const animFrame = useRef(null);
      const animTimer = useRef(null);
      const readerOpenRef = useRef(false);
      readerOpenRef.current = readerId !== null || contextOpen;
      const nodesRef = useRef(doc.nodes);
      nodesRef.current = doc.nodes;

      // -- Theme -------------------------------------------------------------

      // The stylesheet switches on this attribute, so a change shows at once.
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      // Until a theme has been chosen with the toggle, follow the system setting live.
      useEffect(() => {
        if (!window.matchMedia) return;
        const query = window.matchMedia('(prefers-color-scheme: light)');
        const onChange = () => { if (!chosenTheme()) setTheme(systemTheme()); };
        query.addEventListener('change', onChange);
        return () => query.removeEventListener('change', onChange);
      }, []);

      const toggleTheme = () => {
        const next = theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem(THEME_KEY, next); } catch { /* still switches, just not remembered */ }
        setTheme(next);
      };

      // -- Loading -----------------------------------------------------------

      const loadList = useCallback(async () => {
        setList((l) => ({ ...l, status: 'loading', error: null }));
        try {
          const items = await api('/api/canvases');
          setList({ status: 'ready', items, error: null });
          // Keep the canvas from the URL if it exists; otherwise open the newest.
          setCanvasId((current) => (current && items.some((c) => c.id === current) ? current : (items[0] ? items[0].id : null)));
        } catch (err) {
          setList({ status: 'error', items: [], error: err.message });
        }
      }, []);

      const loadCanvas = useCallback(async (id) => {
        const seq = ++loadSeq.current;
        setDoc({ status: 'loading', canvas: null, nodes: [], stickies: [], error: null });
        setHeights({});
        setComposer(null);
        setRetries({});
        setPollErrors({});
        setMoves({});
        cancelAnimationFrame(animFrame.current);
        clearTimeout(animTimer.current);
        setTidy({ phase: 'idle' });
        // Send any sticky text still waiting for its autosave before leaving this canvas.
        if (flushStickiesRef.current) flushStickiesRef.current();
        setReaderId(null);
        setSelectedId(null);
        setStickyHeights({});
        setEditingSticky(null);
        setStickySaves({});
        setRemovals({});
        setStickyAdd({ busy: false, error: null, node: null });
        setLiveText({});
        liveBuffer.current = {};
        noStream.current = new Set();
        try {
          const data = await api('/api/canvases/' + id);
          if (seq !== loadSeq.current) return; // a newer load has started
          fitWhenMeasured.current = true;
          setCollapsed(loadCollapsed(id));
          setDoc({ status: 'ready', canvas: data.canvas, nodes: data.nodes, stickies: data.stickies || [], error: null });
        } catch (err) {
          if (seq !== loadSeq.current) return;
          setDoc({ status: 'error', canvas: null, nodes: [], stickies: [], error: err.message });
        }
      }, []);

      useEffect(() => { loadList(); }, [loadList]);

      useEffect(() => {
        if (list.status !== 'ready') return;
        if (!canvasId) {
          loadSeq.current++;
          setDoc({ status: 'idle', canvas: null, nodes: [], stickies: [], error: null });
          setComposer(null);
          return;
        }
        if (location.hash.slice(1) !== canvasId) history.replaceState(null, '', '#' + canvasId);
        loadCanvas(canvasId);
      }, [canvasId, list.status, loadCanvas]);

      useEffect(() => {
        const onHash = () => {
          const id = location.hash.slice(1);
          if (!id) return;
          setCanvasId(id);
          // A canvas the switcher does not know about yet (e.g. made in another
          // tab): refresh the list, which also falls back if the id is unknown.
          if (!list.items.some((c) => c.id === id)) loadList();
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, [list.items, loadList]);

      // -- Fit to screen -----------------------------------------------------

      const fit = useCallback(() => {
        const rect = viewportRef.current.getBoundingClientRect();
        const byId = new Map(doc.nodes.map((n) => [n.id, n]));
        // Only what is on show counts: collapsed-away nodes and their stickies are left out.
        const hidden = hiddenNodes(collapsed, treeInfo(doc.nodes).childrenOf);
        const shown = doc.nodes.filter((n) => !hidden.has(n.id));
        const stickyRects = doc.stickies
          .filter((st) => !(st.node_id && hidden.has(st.node_id)))
          .map((st) => ({ ...stickyPosition(st, byId), w: STICKY_W, h: stickyHeights[st.id] || 120 }));
        setView(fitView(shown, heights, rect.width, rect.height, stickyRects));
      }, [doc.nodes, doc.stickies, heights, stickyHeights, collapsed]);

      // Fit once after a canvas loads, as soon as every card has been measured.
      useEffect(() => {
        if (!fitWhenMeasured.current || doc.status !== 'ready') return;
        const hidden = hiddenNodes(collapsed, treeInfo(doc.nodes).childrenOf);
        if (doc.nodes.every((n) => hidden.has(n.id) || heights[n.id] !== undefined)) {
          fitWhenMeasured.current = false;
          fit();
        }
      }, [doc, heights, fit, collapsed]);

      // Collapse or expand one node, and remember it for this canvas in this browser.
      const toggleCollapse = (id) => {
        setCollapsed((prev) => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          if (doc.canvas) saveCollapsed(doc.canvas.id, next);
          return next;
        });
      };

      // Track the viewport's size (the minimap needs it to draw what is on screen).
      useLayoutEffect(() => {
        const el = viewportRef.current;
        const measure = () => setVpSize((prev) => (prev.w === el.clientWidth && prev.h === el.clientHeight ? prev : { w: el.clientWidth, h: el.clientHeight }));
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      // Minimap: put the given canvas point at the centre of the screen.
      const centreOn = useCallback((point) => {
        const el = viewportRef.current;
        setView((v) => ({ ...v, x: el.clientWidth / 2 - point.x * v.k, y: el.clientHeight / 2 - point.y * v.k }));
      }, []);

      const onHeight = useCallback((id, value) => {
        setHeights((prev) => (prev[id] === value ? prev : { ...prev, [id]: value }));
      }, []);
      const onStickyHeight = useCallback((id, value) => {
        setStickyHeights((prev) => (prev[id] === value ? prev : { ...prev, [id]: value }));
